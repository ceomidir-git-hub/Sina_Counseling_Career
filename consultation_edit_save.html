<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 조회/수정</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{
  --blue:#1457a6;--blue-dark:#123f78;--blue-soft:#eef6ff;--line:#b9cce3;
  --text:#172033;--muted:#6b7788;--paper:#fff;--bg:#eef1f5;--yellow:#fffdf2;
  --green:#178a4b;--red:#c63c3c;--field-h:36px
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
button,input,select,textarea{font:inherit}
.page-wrap{min-height:100vh;padding:18px 0 30px;display:flex;justify-content:center;align-items:flex-start}
.a4-page{width:210mm;min-height:297mm;max-width:calc(100vw - 24px);background:var(--paper);box-shadow:0 10px 30px rgba(15,23,42,.14);padding:10mm 9mm 8mm}
.top-row{min-height:17mm;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--blue-dark);padding:0 2mm 4mm;margin-bottom:7mm}
h1{margin:0;color:var(--blue-dark);font-size:29px;font-weight:950;letter-spacing:-1.3px;line-height:1}
.top-actions{display:flex;gap:7px;align-items:center}
.pdf-btn,.top-btn{height:36px;padding:0 14px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue-dark);font-weight:900;font-size:13px;cursor:pointer}
.pdf-btn:hover,.top-btn:hover{background:var(--blue-soft)}
.statusMsg{display:none;margin:0 0 4mm;padding:9px 11px;border-radius:7px;font-size:12px;font-weight:800}
.statusMsg.show{display:block}.statusMsg.success{background:#effaf3;border:1px solid #bfe6cd;color:var(--green)}
.statusMsg.error{background:#fff1f1;border:1px solid #efc4c4;color:var(--red)}
.statusMsg.info{background:#eef6ff;border:1px solid #c9dff8;color:var(--blue-dark)}
.section{border:1px solid #6fa3dc;border-radius:6px;overflow:hidden;margin-bottom:6mm;break-inside:avoid;page-break-inside:avoid}
.section-head{min-height:12mm;padding:0 4mm;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#f3f8fe 0%,#e6f2ff 100%);border-bottom:1px solid #a8c6e7}
.section-head h2{margin:0;color:var(--blue);font-size:17px;font-weight:950;letter-spacing:-.5px}
.lookup-btn{height:31px;padding:0 11px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue-dark);font-size:12px;font-weight:900;cursor:pointer}
.lookup-btn:hover{background:var(--blue-soft)}
.section-head-right{display:flex;align-items:center;gap:10px}
.section-body{padding:4mm 4mm 4.5mm;background:#fff}
.grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
.form-pair{min-width:0;display:grid;grid-template-columns:27mm minmax(0,1fr);align-items:center;gap:2.5mm}
.form-pair.full{grid-column:1/-1;grid-template-columns:27mm minmax(0,1fr)}
.form-pair label,.detail-label{font-size:12.5px;font-weight:850;color:#252b34;white-space:nowrap}
input[type="text"],input[type="date"],select,textarea{width:100%;min-width:0;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow);color:#161b22;outline:none;font-size:12.5px;font-weight:650}
input[type="text"],input[type="date"],select{height:var(--field-h);padding:0 10px}
input[readonly]{background:#f8fafc;color:#384557}
input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,87,166,.11)}
.date-time{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.85fr);gap:5px}
.time-input{text-align:center;letter-spacing:.15px}
.time-input::placeholder{color:#9aa5b3;font-size:10.5px;letter-spacing:-.2px}
.tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
.detail-grid{display:grid;grid-template-columns:27mm minmax(0,1fr);gap:2.5mm;align-items:start}
textarea{height:45mm;min-height:45mm;max-height:45mm;resize:none;padding:9px 10px 22px;line-height:1.55}
.textarea-wrap{position:relative}.char-count{position:absolute;right:8px;bottom:6px;background:rgba(255,255,255,.92);color:#7b8796;font-size:10px;font-weight:750;padding-left:6px}
.session-status-wrap{height:var(--field-h);display:flex;align-items:center;gap:16px;padding:0 10px;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow)}
.radio-label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:850;cursor:pointer}.radio-label input{accent-color:var(--blue);margin:0}
.actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12mm;width:72%;margin:7mm auto 0}
.btn{height:40px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue-dark);font-size:13px;font-weight:900;cursor:pointer}
.btn.primary{background:#1461bd;color:#fff;border-color:#1461bd}.btn:disabled{opacity:.45;cursor:not-allowed}
.record-meta{display:none;margin-top:3mm;padding:7px 10px;border-radius:5px;background:#f7fbff;border:1px dashed #9fc0e5;font-size:10.5px;color:#50627a;line-height:1.45}.record-meta.show{display:block}
.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px rgba(198,60,60,.10)!important}

/* 조회 모달 */
.modal-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px}
.modal-backdrop.show{display:flex}
.modal{width:min(760px,96vw);max-height:84vh;overflow:hidden;background:#fff;border-radius:12px;box-shadow:0 26px 70px rgba(15,23,42,.3);border:1px solid #d7e1ec;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
.modal-head{height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4eaf1;background:#f7fbff}.modal-head h3{margin:0;color:var(--blue-dark);font-size:17px;font-weight:950}
.modal-x{width:32px;height:32px;border:0;border-radius:7px;background:#eef2f6;color:#475569;font-size:20px;cursor:pointer}
.modal-search{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-bottom:1px solid #edf1f5}
.modal-search button{min-width:72px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;cursor:pointer}
.lookup-results{min-height:170px;overflow:auto;padding:14px 18px 18px}
.lookup-empty{padding:28px 10px;text-align:center;color:#738095;font-size:12px}
.lookup-card{border:1px solid #d7e1ec;border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}
.lookup-card:hover{border-color:#7ca9dd;background:#f7fbff}
.lookup-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.lookup-card-top strong{font-size:13px;color:#233650}
.type-badge{padding:3px 7px;border-radius:999px;background:#e9f3ff;color:#1457a6;font-size:10px;font-weight:900;white-space:nowrap}
.lookup-card p{margin:2px 0;color:#64748b;font-size:11px;line-height:1.45}
.session-badge{display:inline-block;margin-left:5px;padding:3px 7px;border-radius:999px;background:#eefaf3;color:#178a4b;font-size:10px;font-weight:900}
.lookup-section-label{font-size:11px;color:#64748b;font-weight:900;margin:5px 0 8px}

/* PDF 문서 */
.print-document{display:none}
.print-sheet{width:194mm;margin:0 auto;background:#fff;color:#172033;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif}
.print-title-row{height:16mm;display:flex;align-items:center;border-bottom:1.4pt solid #123f78;padding:0 2mm 3mm;margin-bottom:5mm}
.print-title-row h1{margin:0;color:#123f78;font-size:23pt;font-weight:800;letter-spacing:-.8pt}
.print-section{border:.65pt solid #6fa3dc;border-radius:4px;overflow:hidden;margin-bottom:4mm;break-inside:avoid;page-break-inside:avoid}
.print-section-title{height:10mm;display:flex;align-items:center;padding:0 4mm;background:#eaf4ff;border-bottom:.55pt solid #a8c6e7;color:#1457a6;font-size:12.5pt;font-weight:800}
.print-section-body{padding:3mm 4mm 3.5mm}
.print-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));column-gap:7mm;row-gap:2.6mm}
.print-pair{min-width:0;display:grid;grid-template-columns:26mm minmax(0,1fr);align-items:center;gap:2.5mm}.print-pair.full{grid-column:1/-1}
.print-label{font-size:9.5pt;font-weight:700;color:#252b34;white-space:nowrap}
.print-box{min-width:0;min-height:8mm;display:flex;align-items:center;padding:1.3mm 2.4mm;border:.5pt solid #cfd6df;border-radius:3px;background:#fff;color:#111827;font-size:9.2pt;font-weight:600;line-height:1.25;overflow-wrap:anywhere}
.print-box.detail{min-height:37mm;align-items:flex-start;padding-top:2mm;white-space:pre-wrap;line-height:1.5}
.print-detail-row{display:grid;grid-template-columns:26mm minmax(0,1fr);gap:2.5mm;margin-top:2.6mm}.print-detail-row .print-label{padding-top:2mm}
@page{size:A4 portrait;margin:8mm}
@media(max-width:760px){.a4-page{width:calc(100vw - 16px);padding:18px 14px}.top-row{margin-bottom:16px}.grid-2,.tests{grid-template-columns:1fr}.form-pair.full{grid-column:auto}.actions{width:100%;gap:8px}}
@media print{
  html,body{margin:0!important;padding:0!important;background:#fff!important;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .page-wrap,.modal-backdrop{display:none!important}.print-document{display:block!important}.print-sheet{width:100%!important;margin:0!important}
}

/* ===== FINAL 2026-08-29 : 과거 상담 시간 누락 데이터 표시 ===== */
.legacy-missing{
  border-color:#e6a23c!important;
  background:#fff8e8!important;
}
.legacy-data-warning{
  display:none;
  margin:0 0 4mm;
  padding:9px 11px;
  border:1px solid #f0c36d;
  border-radius:7px;
  background:#fff8e6;
  color:#7a5310;
  font-size:12px;
  font-weight:800;
  line-height:1.5;
}
.legacy-data-warning.show{display:block}

</style>
</head>
<body>
<div class="page-wrap">
<main class="a4-page">
<header class="top-row">
  <h1>상담 조회/수정</h1>
  <div class="top-actions">
    <button type="button" class="pdf-btn no-print" id="pdfSaveBtn">▤ PDF 저장</button>
  </div>
</header>

<div id="statusMsg" class="statusMsg"></div>
<div id="legacyDataWarning" class="legacy-data-warning"></div>

<form id="consultForm" autocomplete="off">
<section class="section">
  <div class="section-head">
    <h2>1. 내담자 정보</h2>
    <div class="section-head-right">
      <button type="button" class="lookup-btn no-print" id="lookupBtn">⌕ 상담조회</button>
    </div>
  </div>
  <div class="section-body">
    <div class="grid-2">
      <div class="form-pair"><label for="clientName">내담자명</label><input type="text" id="clientName" placeholder="내담자명 입력"></div>
      <div class="form-pair"><label for="clientPhone">연락처</label><input type="text" id="clientPhone" placeholder="선택 입력" maxlength="13" inputmode="numeric"></div>
      <div class="form-pair"><label for="gender">성별</label><input type="text" id="gender" readonly placeholder="상담조회 후 자동"></div>
      <div class="form-pair"><label for="birthDate">생년월일</label><input type="text" id="birthDate" readonly placeholder="상담조회 후 자동"></div>
      <div class="form-pair"><label for="age">나이</label><input type="text" id="age" readonly placeholder="자동 계산"></div>
      <div class="form-pair"><label for="job">직업</label><input type="text" id="job" readonly placeholder="상담조회 후 자동"></div>
      <div class="form-pair full"><label for="address">주소</label><input type="text" id="address" readonly placeholder="상담조회 후 자동"></div>
    </div>
    <div id="recordMeta" class="record-meta"></div>
  </div>
</section>

<section class="section">
  <div class="section-head"><h2>2. 진행정보 및 예약현황</h2></div>
  <div class="section-body">
    <div class="grid-2">
      <div class="form-pair"><label for="sessionNo">금회 회기</label>
        <select id="sessionNo">
          <option value="">선택</option>
          <option value="1">1회기</option><option value="2">2회기</option><option value="3">3회기</option>
          <option value="4">4회기</option><option value="5">5회기</option><option value="6">6회기</option>
          <option value="7">7회기</option><option value="8">8회기</option><option value="9">9회기</option><option value="10">10회기</option>
        </select>
      </div>
      <div class="form-pair"><label>접수시 예약일</label><div class="date-time"><input type="date" id="reservationDate" readonly><input type="text" id="reservationTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="자동" readonly></div></div>
      <div class="form-pair"><label>실시일 시작</label><div class="date-time"><input type="date" id="startDate"><input type="text" id="startTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
      <div class="form-pair"><label>실시일 종료</label><div class="date-time"><input type="date" id="endDate"><input type="text" id="endTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
      <div class="form-pair"><label for="duration">상담시간</label><input type="text" id="duration" readonly placeholder="자동 계산"></div>
      <div class="form-pair"><label>진행상태</label><div class="session-status-wrap">
        <label class="radio-label"><input type="radio" name="sessionStatus" value="진행" checked> 진행</label>
        <label class="radio-label"><input type="radio" name="sessionStatus" value="종결"> 종결</label>
      </div></div>
    </div>
    <div class="tests" style="margin-top:3.2mm">
      <div class="form-pair"><label for="testTool1">검사도구1</label><select id="testTool1"><option value="">선택</option></select></div>
      <div class="form-pair"><label for="testTool2">검사도구2</label><select id="testTool2"><option value="">선택</option></select></div>
      <div class="form-pair"><label for="testTool3">검사도구3</label><select id="testTool3"><option value="">선택</option></select></div>
      <div class="form-pair"><label for="testTool4">검사도구4</label><select id="testTool4"><option value="">선택</option></select></div>
      <div class="form-pair"><label for="nextSessionNo">차기 회기</label><input type="text" id="nextSessionNo" readonly placeholder="자동 계산"></div>
      <div class="form-pair"><label>차기 예약일</label><div class="date-time"><input type="date" id="nextReservationDate"><input type="text" id="nextReservationTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
    </div>
  </div>
</section>

<section class="section">
  <div class="section-head"><h2>3. 상담내용</h2></div>
  <div class="section-body">
    <div class="grid-2" style="margin-bottom:3.2mm">
      <div class="form-pair"><label for="consultationTarget">상담대상</label><select id="consultationTarget"><option value="">선택</option></select></div>
      <div class="form-pair"><label for="consultationTopic">상담주제</label><select id="consultationTopic"><option value="">선택</option></select></div>
    </div>
    <div class="detail-grid">
      <label class="detail-label" for="counselDetail" style="padding-top:8px">상세 상담내용</label>
      <div class="textarea-wrap">
        <textarea id="counselDetail" maxlength="1000" placeholder="상담내용을 구체적으로 입력하세요."></textarea>
        <div class="char-count"><span id="charCount">0</span> / 1000</div>
      </div>
    </div>
  </div>
</section>

<div class="actions no-print">
  <button type="submit" class="btn primary" id="saveBtn">✓ 수정/저장</button>
  <button type="reset" class="btn" id="resetBtn">↻ 초기화</button>
  <button type="button" class="btn" id="backBtn">← 이전화면</button>
</div>
</form>
</main>
</div>

<!-- 상담 조회 모달 -->
<div class="modal-backdrop no-print" id="lookupModalBackdrop" aria-hidden="true">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="lookupModalTitle">
  <div class="modal-head"><h3 id="lookupModalTitle">회원 Key 상담조회</h3><button type="button" class="modal-x" id="lookupCloseBtn">×</button></div>
  <div class="modal-search">
    <input type="text" id="lookupMemberKey" placeholder="회원 Key 8자리 입력" maxlength="8" inputmode="numeric" autocomplete="off">
    <button type="button" id="lookupSearchBtn">조회</button>
  </div>
  <div class="lookup-results" id="lookupResults"><div class="lookup-empty">회원 Key를 입력해 상담기록을 조회하세요.</div></div>
</section>
</div>

<div id="printDocument" class="print-document" aria-hidden="true"></div>

<script>
(() => {
console.info("consultation_edit_save build: 20260829-common-verify");
const SUPABASE_URL="https://fafdxaifluftnertbpvr.supabase.co";
const SUPABASE_KEY="sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";
const BASIC_TABLE="DB_basic";
const PSYCH_TABLE="DB_psychological_counseling";
const CAREER_TABLE="DB_career_counseling";

const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{
  auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}
});

let currentEmployee=null;
let selectedRecord=null;
let sexMap={},jobMap={},targetMap={},topicMap={},toolRows=[];
const $=id=>document.getElementById(id);
const form=$("consultForm"),statusMsg=$("statusMsg"),saveBtn=$("saveBtn"),legacyDataWarning=$("legacyDataWarning");
const modalBackdrop=$("lookupModalBackdrop"),lookupResults=$("lookupResults");

function showStatus(type,message){
  statusMsg.className="statusMsg show "+type;
  statusMsg.textContent=message;
  statusMsg.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function hideStatus(){statusMsg.className="statusMsg";statusMsg.textContent=""}
function clearLegacyWarning(){
  legacyDataWarning.className="legacy-data-warning";
  legacyDataWarning.textContent="";
  ["startTime","endTime","nextReservationTime"].forEach(id=>{
    const el=$(id);
    if(el){
      el.classList.remove("legacy-missing");
      if(el.dataset.originalPlaceholder!==undefined){
        el.placeholder=el.dataset.originalPlaceholder;
        delete el.dataset.originalPlaceholder;
      }
    }
  });
}
function markLegacyMissing(id){
  const el=$(id);
  if(!el)return;
  if(el.dataset.originalPlaceholder===undefined) el.dataset.originalPlaceholder=el.placeholder||"";
  el.classList.add("legacy-missing");
  el.placeholder="미등록";
}
function showLegacyWarning(items){
  clearLegacyWarning();
  if(!items.length)return;
  items.forEach(item=>markLegacyMissing(item.id));
  legacyDataWarning.textContent=
    "⚠ 기존 상담기록의 시간 데이터가 일부 저장되지 않았습니다. " +
    items.map(item=>item.label).join(", ") +
    " 값을 입력한 뒤 수정/저장을 누르면 DB에 정상 보완됩니다.";
  legacyDataWarning.classList.add("show");
}
const escapeHtml=v=>String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
const digitsOnly=v=>String(v||"").replace(/\D/g,"");
function formatPhone(v){
  const d=digitsOnly(v).slice(0,11);
  if(d.length<=3)return d;
  if(d.length<=7)return d.slice(0,3)+"-"+d.slice(3);
  return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7);
}
function attachPhoneFormatter(el){el.addEventListener("input",()=>el.value=formatPhone(el.value))}
attachPhoneFormatter($("clientPhone"));

function normalizeTimeInput(value){
  const digits=String(value||"").replace(/\D/g,"").slice(0,4);
  if(!digits)return"";
  if(digits.length<=2)return digits;
  let hh="",mm="";
  if(digits.length===3){hh="0"+digits.slice(0,1);mm=digits.slice(1)}
  else{hh=digits.slice(0,2);mm=digits.slice(2)}
  const h=Number(hh),m=Number(mm);
  if(h>23||m>59)return"";
  return `${hh}:${mm}`;
}
function attachNumericTimeInput(el){
  el.addEventListener("input",()=>{el.value=el.value.replace(/\D/g,"").slice(0,4)});
  el.addEventListener("focus",()=>{if(/^\d{2}:\d{2}$/.test(el.value))el.value=el.value.replace(":","")});
  el.addEventListener("blur",()=>{
    if(!el.value.trim())return;
    const v=normalizeTimeInput(el.value);
    if(!v){el.value="";el.classList.add("invalid");showStatus("error","시간은 0000~2359 범위의 숫자로 입력해주세요. 예: 0930, 1530");return}
    el.value=v;el.classList.remove("invalid");updateDuration();
  });
}
["startTime","endTime","nextReservationTime"].forEach(id=>attachNumericTimeInput($(id)));

function calcAge(birthDate){
  if(!birthDate)return"";
  const birth=new Date(birthDate+"T00:00:00");
  if(Number.isNaN(birth.getTime()))return"";
  const today=new Date();
  let age=today.getFullYear()-birth.getFullYear();
  const md=today.getMonth()-birth.getMonth();
  if(md<0||(md===0&&today.getDate()<birth.getDate()))age--;
  return age>=0?age+"세":"";
}
function isoToKSTParts(iso){
  if(!iso)return{date:"",time:""};
  const d=new Date(iso);if(Number.isNaN(d.getTime()))return{date:"",time:""};
  const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);
  const m={};parts.forEach(p=>{if(p.type!=="literal")m[p.type]=p.value});
  return{date:`${m.year}-${m.month}-${m.day}`,time:`${m.hour}:${m.minute}`};
}
function dateTimeToISO(date,time){
  if(!date||!time)return null;
  const t=/^\d{2}:\d{2}$/.test(time)?time:normalizeTimeInput(time);
  if(!t)return null;
  return new Date(`${date}T${t}:00+09:00`).toISOString();
}
function formatKST(iso){
  const p=isoToKSTParts(iso);
  return p.date?(p.time?`${p.date} ${p.time}`:p.date):"-";
}
function updateDuration(){
  const s=dateTimeToISO($("startDate").value,$("startTime").value);
  const e=dateTimeToISO($("endDate").value,$("endTime").value);
  if(!s||!e||new Date(e)<=new Date(s)){
    $("duration").value="";
    return;
  }
  $("duration").value=Math.round((new Date(e)-new Date(s))/60000)+"분";
}

function parseAssessmentTools(text){
  if(!text)return[];
  const tokens=String(text).split(",").map(v=>v.trim()).filter(Boolean);
  return tokens.map(token=>{
    const byCode=toolRows.find(r=>r.code===token);
    if(byCode)return byCode.code;
    const byName=toolRows.find(r=>r.name===token);
    return byName?byName.code:"";
  }).filter(Boolean).slice(0,4);
}
function topicCodeFromRow(row,type){
  if(row.topic_code)return row.topic_code;
  const name=type==="PC"?row.session_topic_1:row.career_topic_1;
  const found=Object.entries(topicMap).find(([,v])=>v===name);
  return found?found[0]:"";
}
async function getSessionRows(client){
  const ps="id,client_id,receipt_at,visit_at,visit_date,session_no,client_type_code,topic_code,session_topic_1,assessment_tool,session_content,next_session_date,session_status,record_active,session_start_at,session_end_at,next_session_at,updated_at";
  const cs="id,client_id,receipt_at,appointment_at,counseling_date,session_no,client_type_code,topic_code,career_topic_1,assessment_tool,counseling_content,next_session_date,session_status,record_active,session_start_at,session_end_at,next_session_at,updated_at";
  const [p,c]=await Promise.all([
    sb.from(PSYCH_TABLE).select(ps).eq("client_id",client.id).not("session_no","is",null).order("session_no",{ascending:true}),
    sb.from(CAREER_TABLE).select(cs).eq("client_id",client.id).not("session_no","is",null).order("session_no",{ascending:true})
  ]);
  if(p.error)throw p.error;if(c.error)throw c.error;
  const rows=[];
  (p.data||[]).forEach(row=>rows.push({type:"PC",client,row}));
  (c.data||[]).forEach(row=>rows.push({type:"CC",client,row}));
  return rows.sort((a,b)=>{
    if(a.type!==b.type)return a.type.localeCompare(b.type);
    return (a.row.session_no||0)-(b.row.session_no||0);
  });
}

async function searchConsultations(){
  const memberKey=$("lookupMemberKey").value.trim();

    lookupResults.innerHTML='<div class="lookup-empty">회원 Key는 8자리 숫자로 입력해주세요.</div>';
    return;
  }

  lookupResults.innerHTML='<div class="lookup-empty">조회 중...</div>';

  try{
    const {data:client,error}=await sb
      .from(BASIC_TABLE)
      .select("id,member_key,counsel_type,client_name,client_phone,sex_code,birth_date,job_code,client_address")
      .eq("member_key",memberKey)
      .maybeSingle();

    if(error)throw error;

    if(!client){
      lookupResults.innerHTML='<div class="lookup-empty">일치하는 회원 Key의 내담자 기본정보가 없습니다.</div>';
      return;
    }

    const records=await getSessionRows(client);

    if(!records.length){
      lookupResults.innerHTML='<div class="lookup-empty">해당 회원 Key에 등록된 상담 회기가 없습니다.</div>';
      return;
    }

    records.forEach(item=>{
      const typeLabel=item.type==="PC"?"심리상담":"진로상담";
      const row=item.row;
      const date=row.session_start_at
        ? formatKST(row.session_start_at)
        : (item.type==="PC"?(row.visit_date||"-"):(row.counseling_date||"-"));
      const topic=
        topicMap[topicCodeFromRow(row,item.type)]||
        (item.type==="PC"?row.session_topic_1:row.career_topic_1)||
        "-";

      const card=document.createElement("div");
      card.className="lookup-card";
      card.innerHTML=
        `<div class="lookup-card-top">`+
          `<strong>${escapeHtml(item.client.client_name)} · ${escapeHtml(formatPhone(item.client.client_phone||""))}</strong>`+
          `<span><span class="type-badge">${typeLabel}</span><span class="session-badge">${row.session_no}회기</span></span>`+
        `</div>`+
        `<p>회원 Key : ${escapeHtml(item.client.member_key||memberKey)}</p>`+
        `<p>상담일 : ${escapeHtml(date)} · 상태 : ${escapeHtml(row.session_status||"진행")}</p>`+
        `<p>상담주제 : ${escapeHtml(topic)}</p>`;

      card.addEventListener("click",()=>{
        selectedRecord=item;
        populateRecord(item);
        closeLookup();
      });

      lookupResults.appendChild(card);
    });

  }catch(err){
    console.error(err);
    lookupResults.innerHTML=
      `<div class="lookup-empty">조회 중 오류가 발생했습니다.<br>${escapeHtml(err.message||String(err))}</div>`;
  }
}

function populateRecord(item){
  const {client,row,type}=item;

  $("clientName").value=client.client_name||"";
  $("clientPhone").value=formatPhone(client.client_phone||"");
  $("gender").value=sexMap[client.sex_code]||client.sex_code||"";
  $("birthDate").value=client.birth_date||"";
  $("age").value=calcAge(client.birth_date);
  $("job").value=jobMap[client.job_code]||client.job_code||"";
  $("address").value=client.client_address||"";

  $("sessionNo").value=String(row.session_no||"");
  $("nextSessionNo").value=row.session_no&&row.session_no<10?`${row.session_no+1}회기`:"";

  // 접수 당시 예약일시는 기존 접수 데이터에서 정상 복원
  const appt=isoToKSTParts(type==="PC"?row.visit_at:row.appointment_at);
  $("reservationDate").value=appt.date||"";
  $("reservationTime").value=appt.time||"";

  // 상담 실시 시각
  const start=isoToKSTParts(row.session_start_at);
  const end=isoToKSTParts(row.session_end_at);

  // 과거 데이터 호환:
  // 시작/종료 timestamp가 없으면 과거 날짜 컬럼까지만 복원하고,
  // 없는 '시간'은 임의 추정하지 않는다.
  const legacyStartDate=type==="PC"?(row.visit_date||""):(row.counseling_date||"");
  $("startDate").value=start.date||legacyStartDate;
  $("startTime").value=start.time||"";

  $("endDate").value=end.date||$("startDate").value;
  $("endTime").value=end.time||"";

  setSessionStatus(row.session_status||"진행");

  const tools=parseAssessmentTools(row.assessment_tool);
  ["testTool1","testTool2","testTool3","testTool4"].forEach((id,i)=>$(id).value=tools[i]||"");

  // 차기 예약: timestamp 우선, 과거에는 next_session_date만 저장된 자료가 존재
  const next=isoToKSTParts(row.next_session_at);
  $("nextReservationDate").value=next.date||row.next_session_date||"";
  $("nextReservationTime").value=next.time||"";

  $("consultationTarget").value=row.client_type_code||"";
  $("consultationTopic").value=topicCodeFromRow(row,type);
  $("counselDetail").value=(type==="PC"?row.session_content:row.counseling_content)||"";
  $("charCount").textContent=$("counselDetail").value.length;

  // 과거 등록파일에서 누락된 시간 컬럼을 정확히 감지
  const missing=[];
  if(!row.session_start_at){
    missing.push({id:"startTime",label:"실시일 시작시간"});
  }
  if(!row.session_end_at){
    missing.push({id:"endTime",label:"실시일 종료시간"});
  }
  if(row.next_session_date && !row.next_session_at){
    missing.push({id:"nextReservationTime",label:"차기 예약시간"});
  }
  showLegacyWarning(missing);

  updateDuration();

  // 시간이 없으면 '빈칸'처럼 보이지 않도록 상담시간에도 상태를 명확히 표시
  if((!row.session_start_at || !row.session_end_at) && !$("duration").value){
    $("duration").value="시간 미등록";
  }

  $("recordMeta").classList.add("show");
  $("recordMeta").textContent=
    `회원 Key ${client.member_key||"-"} · `+
    `${type==="PC"?"심리상담":"진로상담"} · ${row.session_no}회기 · `+
    `DB ID ${row.id} · 마지막 수정 ${formatKST(row.updated_at)}`;

  document.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));
  hideStatus();

  if(missing.length){
    showStatus(
      "info",
      `${type==="PC"?"심리상담":"진로상담"} ${row.session_no}회기를 불러왔습니다. `+
      `과거 등록 당시 저장되지 않은 시간값이 있어 노란색으로 표시했습니다. 값을 보완한 뒤 저장해주세요.`
    );
  }else{
    showStatus(
      "success",
      `${type==="PC"?"심리상담":"진로상담"} ${row.session_no}회기의 진행정보 및 예약현황을 모두 불러왔습니다.`
    );
  }
}

function collectTools(){
  return ["testTool1","testTool2","testTool3","testTool4"].map(id=>$(id).value).filter(Boolean).map(code=>{
    const found=toolRows.find(r=>r.code===code);return found?found.name:code;

function markInvalid(el,invalid){el.classList.toggle("invalid",!!invalid)}
function validateForm(){
  let ok=true;
  if(!selectedRecord){showStatus("error","먼저 상담조회를 통해 수정할 회기를 선택해주세요.");return false}
  [$("sessionNo"),$("startDate"),$("startTime"),$("endDate"),$("endTime"),$("consultationTarget"),$("consultationTopic"),$("counselDetail")].forEach(el=>{
    const bad=!String(el.value||"").trim();markInvalid(el,bad);if(bad)ok=false;
  });
  const s=dateTimeToISO($("startDate").value,$("startTime").value),e=dateTimeToISO($("endDate").value,$("endTime").value);
  if(s&&e&&new Date(e)<=new Date(s)){
    markInvalid($("endDate"),true);markInvalid($("endTime"),true);ok=false;showStatus("error","실시일 종료는 시작보다 늦어야 합니다.");
  }
  return ok;
}

form.addEventListener("submit",async e=>{
  e.preventDefault();hideStatus();
  if(currentEmployee?.permission==="조회자"){showStatus("error","조회자는 상담 내용을 수정할 수 없습니다.");return}
  if(!validateForm()){if(!statusMsg.classList.contains("show"))showStatus("error","필수 입력항목을 확인해주세요.");return}
  if(!confirm("수정한 상담내용을 저장하시겠습니까?\\n\\n저장하면 기존 상담기록이 변경됩니다."))return;

  const {type,row,client}=selectedRecord;
  const tableName=type==="PC"?PSYCH_TABLE:CAREER_TABLE;
  const sessionNo=Number($("sessionNo").value);
  saveBtn.disabled=true;const original=saveBtn.textContent;saveBtn.textContent="저장 중...";

  try{
    /* 회기 번호를 바꾼 경우 자기 자신을 제외하고 중복 확인 */
    const {data:dupes,error:dupErr}=await sb.from(tableName).select("id").eq("client_id",client.id).eq("session_no",sessionNo).neq("id",row.id).limit(1);
    if(dupErr)throw dupErr;
    if(dupes&&dupes.length)throw new Error(`${sessionNo}회기는 이미 등록되어 있습니다.`);

    const topicCode=$("consultationTopic").value||null;
    const topicName=topicMap[topicCode]||topicCode||null;
    const targetCode=$("consultationTarget").value||null;
    const tools=collectTools()||null;
    const startISO=dateTimeToISO($("startDate").value,$("startTime").value);
    const endISO=dateTimeToISO($("endDate").value,$("endTime").value);
    const nextISO=$("nextReservationDate").value&&$("nextReservationTime").value?dateTimeToISO($("nextReservationDate").value,$("nextReservationTime").value):null;
    const common={
      session_no:sessionNo,
      client_type_code:targetCode,
      topic_code:topicCode,
      assessment_tool:tools,
      next_session_date:$("nextReservationDate").value||null,
      next_session_at:nextISO,
      session_status:selectedStatus(),
      session_start_at:startISO,
      session_end_at:endISO,
      updated_at:new Date().toISOString()
    };
    const payload=type==="PC"
      ? {...common,visit_date:$("startDate").value||null,session_topic_1:topicName,session_content:$("counselDetail").value.trim()||null}
      : {...common,counseling_date:$("startDate").value||null,career_topic_1:topicName,counseling_content:$("counselDetail").value.trim()||null};

    // FINAL 2026-08-29:
    // UPDATE 단계에서는 반환 SELECT를 붙이지 않는다.
    // 이유: PC/CC 전용 컬럼이 잘못 섞여 PostgREST 전체 UPDATE가 실패하는 것을 원천 차단한다.
    const {error:updateError}=await sb
      .from(tableName)
      .update(payload)
      .eq("id",row.id);

    if(updateError) throw updateError;

    // UPDATE 성공 후, 두 상담 테이블에 공통으로 존재하는 컬럼만 별도로 재조회하여 검증한다.
    const {data:verified,error:verifyError}=await sb
      .from(tableName)
      .select("id,session_no,session_start_at,session_end_at,next_session_at,session_status,updated_at")
      .eq("id",row.id)
      .single();

    if(verifyError) throw verifyError;

    // 수정 저장 직후 시간값이 실제 DB에 들어갔는지 재검증
    const normalize=v=>v?new Date(v).toISOString():null;
    const timingMismatch=
      normalize(verified.session_start_at)!==normalize(startISO) ||
      normalize(verified.session_end_at)!==normalize(endISO) ||
      normalize(verified.next_session_at)!==normalize(nextISO);

    if(timingMismatch){
      throw new Error(
        "시간정보 저장 검증에 실패했습니다. " +
        "실시 시작/종료 및 차기 예약시간을 다시 확인해주세요."
      );
    }

    selectedRecord.row={
      ...selectedRecord.row,
      ...payload,
      ...verified
    };

    clearLegacyWarning();
    updateDuration();

    $("recordMeta").textContent=
      `회원 Key ${client.member_key||"-"} · `+
      `${type==="PC"?"심리상담":"진로상담"} · ${sessionNo}회기 · `+
      `DB ID ${row.id} · 마지막 수정 ${formatKST(verified.updated_at)}`;

    showStatus(
      "success",
      `${type==="PC"?"심리상담":"진로상담"} ${sessionNo}회기가 정상적으로 수정 저장되었습니다. `+
      `실시 시작·종료 및 차기 예약시간까지 DB 저장을 확인했습니다.`
    );
  }catch(err){
    console.error(err);
    showStatus("error","수정 저장 중 오류가 발생했습니다: "+(err.message||err));
  }finally{
    saveBtn.disabled=currentEmployee?.permission==="조회자";
    saveBtn.textContent=original;
  }
});

$("pdfSaveBtn").addEventListener("click",()=>{
  if(!selectedRecord){alert("먼저 상담기록을 조회해주세요.");return}
  ["startTime","endTime","nextReservationTime"].forEach(id=>{
    const el=$(id);if(el.value&&!/^\d{2}:\d{2}$/.test(el.value)){const v=normalizeTimeInput(el.value);if(v)el.value=v}
  });
  buildPrintDocument();
  const originalTitle=document.title;
  const name=$("clientName").value.trim()||"미입력";
  const date=$("startDate").value||new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  document.title=`상담조회수정_${name}_${date}`;
  window.print();
  setTimeout(()=>document.title=originalTitle,700);
});

/* 10분 미사용 자동 로그아웃 */
const IDLE_LOGOUT_MS=10*60*1000;
let idleTimer=null,lastMouse=0;
function resetIdleTimer(){
  if(idleTimer)clearTimeout(idleTimer);
  idleTimer=setTimeout(async()=>{
    try{await sb.auth.signOut({scope:"local"})}catch(_){}
    sessionStorage.removeItem("sina_employee");
    alert("10분 동안 사용이 없어 자동 로그아웃되었습니다.");
    location.href="index.html";
  },IDLE_LOGOUT_MS);
}
function recordActivity(e){
  if(e?.type==="mousemove"){const n=Date.now();if(n-lastMouse<1000)return;lastMouse=n}
  resetIdleTimer();
}
["mousedown","mousemove","keydown","touchstart","scroll"].forEach(n=>window.addEventListener(n,recordActivity,{passive:true}));

(async function init(){
  try{
    const ok=await guardLogin();if(!ok)return;
    await loadLookups();resetIdleTimer();
    const params=new URLSearchParams(location.search);
    const directId=params.get("id"),directType=params.get("type");
    if(directId&&["PC","CC"].includes(directType)){
      const table=directType==="PC"?PSYCH_TABLE:CAREER_TABLE;
      const {data:row,error}=await sb.from(table).select("*").eq("id",directId).single();
      if(!error&&row){
        const {data:client}=await sb.from(BASIC_TABLE).select("id,member_key,counsel_type,client_name,client_phone,sex_code,birth_date,job_code,client_address").eq("id",row.client_id).single();
        if(client){selectedRecord={type:directType,client,row};populateRecord(selectedRecord)}
      }
    }
  }catch(err){
    console.error(err);showStatus("error","초기화 중 오류가 발생했습니다: "+(err.message||err));
  }
})();
})();
