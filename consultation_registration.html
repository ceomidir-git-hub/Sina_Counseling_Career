<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 등록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1457a6; --blue-dark:#123f78; --blue-soft:#eef6ff; --line:#b9cce3;
    --text:#172033; --muted:#6b7788; --paper:#fff; --bg:#eef1f5; --yellow:#fffdf2;
    --green:#178a4b; --red:#c63c3c; --field-h:36px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  .page-wrap{min-height:100vh;padding:18px 0 30px;display:flex;justify-content:center;align-items:flex-start}
  .a4-page{width:210mm;min-height:297mm;max-width:calc(100vw - 24px);background:var(--paper);box-shadow:0 10px 30px rgba(15,23,42,.14);padding:10mm 9mm 8mm}
  .top-row{min-height:17mm;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--blue-dark);padding:0 2mm 4mm;margin-bottom:7mm}
  h1{margin:0;color:var(--blue-dark);font-size:29px;font-weight:950;letter-spacing:-1.3px;line-height:1}
  .pdf-btn{height:36px;padding:0 14px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue-dark);font-weight:900;font-size:13px;cursor:pointer}
  .pdf-btn:hover{background:var(--blue-soft)}
  .statusMsg{display:none;margin:0 0 4mm;padding:9px 11px;border-radius:7px;font-size:12px;font-weight:800}
  .statusMsg.show{display:block}.statusMsg.success{background:#effaf3;border:1px solid #bfe6cd;color:var(--green)}
  .statusMsg.error{background:#fff1f1;border:1px solid #efc4c4;color:var(--red)}
  .statusMsg.info{background:#eef6ff;border:1px solid #c9dff8;color:var(--blue-dark)}
  .section{border:1px solid #6fa3dc;border-radius:6px;overflow:hidden;margin-bottom:6mm;break-inside:avoid;page-break-inside:avoid}
  .section-head{min-height:12mm;padding:0 4mm;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#f3f8fe 0%,#e6f2ff 100%);border-bottom:1px solid #a8c6e7}
  .section-head h2{margin:0;color:var(--blue);font-size:17px;font-weight:950;letter-spacing:-.5px}
  .lookup-btn{height:31px;padding:0 11px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue-dark);font-size:12px;font-weight:900;cursor:pointer}
  .lookup-btn:hover{background:var(--blue-soft)}
  .section-body{padding:4mm 4mm 4.5mm;background:#fff}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
  .form-pair{min-width:0;display:grid;grid-template-columns:27mm minmax(0,1fr);align-items:center;gap:2.5mm}
  .form-pair.full{grid-column:1/-1;grid-template-columns:27mm minmax(0,1fr)}
  .form-pair label,.detail-label{font-size:12.5px;font-weight:850;color:#252b34;white-space:nowrap}
  input[type="text"],input[type="date"],input[type="time"],select,textarea{width:100%;min-width:0;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow);color:#161b22;outline:none;font-size:12.5px;font-weight:650}
  input[type="text"],input[type="date"],input[type="time"],select{height:var(--field-h);padding:0 10px}
  input[readonly]{background:#f8fafc;color:#384557}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,87,166,.11)}
  .date-time{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.85fr);gap:5px}

  .time-input{
    text-align:center;
    letter-spacing:.15px;
  }
  .time-input::placeholder{
    color:#9aa5b3;
    font-size:10.5px;
    letter-spacing:-.2px;
  }
  .tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
  .detail-grid{display:grid;grid-template-columns:27mm minmax(0,1fr);gap:2.5mm;align-items:start}
  textarea{height:45mm;min-height:45mm;max-height:45mm;resize:none;padding:9px 10px 22px;line-height:1.55}
  .textarea-wrap{position:relative}.char-count{position:absolute;right:8px;bottom:6px;background:rgba(255,255,255,.92);color:#7b8796;font-size:10px;font-weight:750;padding-left:6px}
  .session-status-wrap{height:var(--field-h);display:flex;align-items:center;gap:16px;padding:0 10px;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow)}
  .radio-label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:850;cursor:pointer}.radio-label input{accent-color:var(--blue);margin:0}
  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12mm;width:72%;margin:7mm auto 0}
  .btn{height:40px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue-dark);font-size:13px;font-weight:900;cursor:pointer}
  .btn.primary{background:#1461bd;color:#fff;border-color:#1461bd}.btn:disabled{opacity:.45;cursor:not-allowed}
  .receipt-meta{display:none;margin-top:3mm;padding:7px 10px;border-radius:5px;background:#f7fbff;border:1px dashed #9fc0e5;font-size:10.5px;color:#50627a;line-height:1.45}.receipt-meta.show{display:block}
  .modal-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}
  .modal{width:min(720px,96vw);max-height:82vh;overflow:hidden;background:#fff;border-radius:12px;box-shadow:0 26px 70px rgba(15,23,42,.3);border:1px solid #d7e1ec;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
  .modal-head{height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4eaf1;background:#f7fbff}.modal-head h3{margin:0;color:var(--blue-dark);font-size:17px;font-weight:950}
  .modal-x{width:32px;height:32px;border:0;border-radius:7px;background:#eef2f6;color:#475569;font-size:20px;cursor:pointer}
  .modal-search{padding:14px 18px;display:grid;grid-template-columns:1fr 1fr auto;gap:8px;border-bottom:1px solid #edf1f5}.modal-search button{min-width:72px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;cursor:pointer}
  .lookup-results{min-height:160px;overflow:auto;padding:14px 18px 18px}.lookup-empty{padding:28px 10px;text-align:center;color:#738095;font-size:12px}
  .lookup-card{border:1px solid #d7e1ec;border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}.lookup-card:hover{border-color:#7ca9dd;background:#f7fbff}
  .lookup-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.lookup-card-top strong{font-size:13px;color:#233650}
  .type-badge{padding:3px 7px;border-radius:999px;background:#e9f3ff;color:#1457a6;font-size:10px;font-weight:900;white-space:nowrap}
  .lookup-card p{margin:2px 0;color:#64748b;font-size:11px;line-height:1.45}.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px rgba(198,60,60,.10)!important}
  @media(max-width:760px){.a4-page{width:calc(100vw - 16px);padding:18px 14px}.top-row{margin-bottom:16px}.grid-2,.tests{grid-template-columns:1fr}.form-pair.full{grid-column:auto}.actions{width:100%;gap:8px}}

  /* PDF 전용 문서폼: 화면 입력 컨트롤을 직접 인쇄하지 않고 값만 문서칸으로 변환 */
  .print-document{display:none}
  .print-sheet{
    width:194mm;
    margin:0 auto;
    background:#fff;
    color:#172033;
    font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  }
  .print-title-row{
    height:16mm;
    display:flex;
    align-items:center;
    border-bottom:1.4pt solid #123f78;
    padding:0 2mm 3mm;
    margin-bottom:5mm;
  }
  .print-title-row h1{
    margin:0;
    color:#123f78;
    font-size:23pt;
    font-weight:800;
    letter-spacing:-.8pt;
  }
  .print-section{
    border:.65pt solid #6fa3dc;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:4mm;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .print-section-title{
    height:10mm;
    display:flex;
    align-items:center;
    padding:0 4mm;
    background:#eaf4ff;
    border-bottom:.55pt solid #a8c6e7;
    color:#1457a6;
    font-size:12.5pt;
    font-weight:800;
  }
  .print-section-body{padding:3mm 4mm 3.5mm}
  .print-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:7mm;
    row-gap:2.6mm;
  }
  .print-pair{
    min-width:0;
    display:grid;
    grid-template-columns:26mm minmax(0,1fr);
    align-items:center;
    gap:2.5mm;
  }
  .print-pair.full{grid-column:1/-1}
  .print-label{
    font-size:9.5pt;
    font-weight:700;
    color:#252b34;
    white-space:nowrap;
  }
  .print-box{
    min-width:0;
    min-height:8mm;
    display:flex;
    align-items:center;
    padding:1.3mm 2.4mm;
    border:.5pt solid #cfd6df;
    border-radius:3px;
    background:#fff;
    color:#111827;
    font-size:9.2pt;
    font-weight:600;
    line-height:1.25;
    overflow-wrap:anywhere;
  }
  .print-box.detail{
    min-height:37mm;
    align-items:flex-start;
    padding-top:2mm;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .print-detail-row{
    display:grid;
    grid-template-columns:26mm minmax(0,1fr);
    gap:2.5mm;
    margin-top:2.6mm;
  }
  .print-detail-row .print-label{padding-top:2mm}
  @page{size:A4 portrait;margin:8mm}
  @media print{
    html,body{
      margin:0!important;
      padding:0!important;
      background:#fff!important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .page-wrap,.modal-backdrop{display:none!important}
    .print-document{display:block!important}
    .print-sheet{width:100%!important;margin:0!important}
  }</style>
</head>
<body>
<div class="page-wrap">
<main class="a4-page">
<header class="top-row"><h1>상담 등록</h1><button type="button" class="pdf-btn no-print" id="pdfSaveBtn">▤ PDF 저장</button></header>
<div id="statusMsg" class="statusMsg"></div>
<form id="consultForm" autocomplete="off">
<section class="section">
<div class="section-head"><h2>1. 내담자 정보</h2><button type="button" class="lookup-btn no-print" id="lookupBtn">⌕ 접수상담조회</button></div>
<div class="section-body">
<div class="grid-2">
<div class="form-pair"><label for="clientName">내담자명</label><input type="text" id="clientName" placeholder="내담자명 입력"></div>
<div class="form-pair"><label for="clientPhone">연락처</label><input type="text" id="clientPhone" placeholder="010-0000-0000" maxlength="13" inputmode="numeric"></div>
<div class="form-pair"><label for="gender">성별</label><input type="text" id="gender" readonly placeholder="접수상담조회 후 자동"></div>
<div class="form-pair"><label for="birthDate">생년월일</label><input type="text" id="birthDate" readonly placeholder="접수상담조회 후 자동"></div>
<div class="form-pair"><label for="age">나이</label><input type="text" id="age" readonly placeholder="자동 계산"></div>
<div class="form-pair"><label for="job">직업</label><input type="text" id="job" readonly placeholder="접수상담조회 후 자동"></div>
<div class="form-pair full"><label for="address">주소</label><input type="text" id="address" readonly placeholder="접수상담조회 후 자동"></div>
</div>
<div id="receiptMeta" class="receipt-meta"></div>
</div>
</section>

<section class="section">
<div class="section-head"><h2>2. 예약 및 진행 정보</h2></div>
<div class="section-body">
<div class="grid-2">
<div class="form-pair"><label for="sessionNo">금회 회기</label><select id="sessionNo"><option value="">선택</option><option value="1">1회기</option><option value="2">2회기</option><option value="3">3회기</option><option value="4">4회기</option><option value="5">5회기</option><option value="6">6회기</option><option value="7">7회기</option><option value="8">8회기</option><option value="9">9회기</option><option value="10">10회기</option></select></div>
<div class="form-pair"><label>예약일</label><div class="date-time"><input type="date" id="reservationDate" readonly><input type="text" id="reservationTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력" readonly></div></div>
<div class="form-pair"><label>실시일 시작</label><div class="date-time"><input type="date" id="startDate"><input type="text" id="startTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
<div class="form-pair"><label>실시일 종료</label><div class="date-time"><input type="date" id="endDate"><input type="text" id="endTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
<div class="form-pair"><label for="duration">상담시간</label><input type="text" id="duration" readonly placeholder="자동 계산"></div>
<div class="form-pair"><label>진행상태</label><div class="session-status-wrap"><label class="radio-label"><input type="radio" name="sessionStatus" value="진행" checked> 진행</label><label class="radio-label"><input type="radio" name="sessionStatus" value="종결"> 종결</label></div></div>
</div>

<div class="tests" style="margin-top:3.2mm">
<div class="form-pair"><label for="testTool1">검사도구1</label><select id="testTool1"><option value="">선택</option></select></div>
<div class="form-pair"><label for="testTool2">검사도구2</label><select id="testTool2"><option value="">선택</option></select></div>
<div class="form-pair"><label for="testTool3">검사도구3</label><select id="testTool3"><option value="">선택</option></select></div>
<div class="form-pair"><label for="testTool4">검사도구4</label><select id="testTool4"><option value="">선택</option></select></div>
<div class="form-pair"><label for="nextSessionNo">차기 회기</label><input type="text" id="nextSessionNo" readonly placeholder="자동 계산"></div>
<div class="form-pair"><label>차기 예약일</label><div class="date-time"><input type="date" id="nextReservationDate"><input type="text" id="nextReservationTime" class="time-input" inputmode="numeric" maxlength="5" placeholder="숫자입력"></div></div>
</div>
</div>
</section>

<section class="section">
<div class="section-head"><h2>3. 상담내용</h2></div>
<div class="section-body">
<div class="grid-2" style="margin-bottom:3.2mm">
<div class="form-pair"><label for="consultationTarget">상담대상</label><select id="consultationTarget"><option value="">선택</option></select></div>
<div class="form-pair"><label for="consultationTopic">상담주제</label><select id="consultationTopic"><option value="">선택</option></select></div>
</div>
<div class="detail-grid"><label class="detail-label" for="counselDetail" style="padding-top:8px">상세 상담내용</label><div class="textarea-wrap"><textarea id="counselDetail" maxlength="1000" placeholder="상담내용을 구체적으로 입력하세요."></textarea><div class="char-count"><span id="charCount">0</span> / 1000</div></div></div>
</div>
</section>

<div class="actions no-print">
<button type="submit" class="btn primary" id="submitBtn">✓ 등록</button>
<button type="reset" class="btn" id="resetBtn">↻ 초기화</button>
<button type="button" class="btn" id="backBtn">← 이전화면</button>
</div>
</form>
</main>
</div>

<div class="modal-backdrop no-print" id="lookupModalBackdrop" aria-hidden="true">
<section class="modal" role="dialog" aria-modal="true" aria-labelledby="lookupModalTitle">
<div class="modal-head"><h3 id="lookupModalTitle">접수상담조회</h3><button type="button" class="modal-x" id="lookupCloseBtn">×</button></div>
<div class="modal-search"><input type="text" id="lookupName" placeholder="내담자명"><input type="text" id="lookupPhone" placeholder="010-0000-0000" maxlength="13"><button type="button" id="lookupSearchBtn">조회</button></div>
<div class="lookup-results" id="lookupResults"><div class="lookup-empty">내담자명과 연락처로 접수상담을 조회하세요.</div></div>
</section>
</div>

<div id="printDocument" class="print-document" aria-hidden="true"></div>

<script>
(() => {
const SUPABASE_URL="https://fafdxaifluftnertbpvr.supabase.co";
const SUPABASE_KEY="sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";
const BASIC_TABLE="DB_basic",PSYCH_TABLE="DB_psychological_counseling",CAREER_TABLE="DB_career_counseling";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY,{auth:{storage:window.sessionStorage,persistSession:true,autoRefreshToken:true}});
let currentEmployee=null,selectedReceipt=null,sexMap={},jobMap={},targetMap={},topicMap={},toolMap={};
const $=id=>document.getElementById(id),form=$("consultForm"),statusMsg=$("statusMsg"),submitBtn=$("submitBtn"),modalBackdrop=$("lookupModalBackdrop"),lookupResults=$("lookupResults");

function showStatus(type,message){statusMsg.className="statusMsg show "+type;statusMsg.textContent=message;statusMsg.scrollIntoView({behavior:"smooth",block:"nearest"})}
function hideStatus(){statusMsg.className="statusMsg";statusMsg.textContent=""}
const digitsOnly=v=>String(v||"").replace(/\D/g,"");
function formatPhone(v){const d=digitsOnly(v).slice(0,11);if(d.length<=3)return d;if(d.length<=7)return d.slice(0,3)+"-"+d.slice(3);return d.slice(0,3)+"-"+d.slice(3,7)+"-"+d.slice(7)}
function attachPhoneFormatter(el){el.addEventListener("input",()=>el.value=formatPhone(el.value))}
attachPhoneFormatter($("clientPhone"));attachPhoneFormatter($("lookupPhone"));

// 시간은 드롭다운/브라우저 time picker를 사용하지 않고 숫자로 직접 입력한다.
// 예: 930 -> 09:30, 1530 -> 15:30
function normalizeTimeInput(value){
  const digits=String(value||"").replace(/\D/g,"").slice(0,4);
  if(!digits) return "";
  let hh="",mm="";
  if(digits.length<=2) return digits;
  if(digits.length===3){hh="0"+digits.slice(0,1);mm=digits.slice(1);}
  else{hh=digits.slice(0,2);mm=digits.slice(2);}
  const h=Number(hh),m=Number(mm);
  if(h>23||m>59) return "";
  return `${hh}:${mm}`;
}
function attachNumericTimeInput(el){
  if(!el||el.readOnly) return;
  el.addEventListener("input",()=>{
    const digits=el.value.replace(/\D/g,"").slice(0,4);
    el.value=digits;
  });
  el.addEventListener("blur",()=>{
    if(!el.value.trim()) return;
    const formatted=normalizeTimeInput(el.value);
    if(!formatted){
      el.value="";
      el.classList.add("invalid");
      showStatus("error","시간은 0000~2359 범위의 숫자 4자리로 입력해주세요. 예: 0930, 1530");
      return;
    }
    el.value=formatted;
    el.classList.remove("invalid");
    updateDuration();
  });
  el.addEventListener("focus",()=>{
    if(/^\d{2}:\d{2}$/.test(el.value)) el.value=el.value.replace(":","");
  });
}
["startTime","endTime","nextReservationTime"].forEach(id=>attachNumericTimeInput($(id)));

function calcAge(birthDate){if(!birthDate)return"";const birth=new Date(birthDate+"T00:00:00");if(Number.isNaN(birth.getTime()))return"";const today=new Date();let age=today.getFullYear()-birth.getFullYear();const md=today.getMonth()-birth.getMonth();if(md<0||(md===0&&today.getDate()<birth.getDate()))age--;return age>=0?age+"세":""}
function isoToLocalParts(iso){if(!iso)return{date:"",time:""};const d=new Date(iso);if(Number.isNaN(d.getTime()))return{date:"",time:""};const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);const map={};parts.forEach(p=>{if(p.type!=="literal")map[p.type]=p.value});return{date:`${map.year}-${map.month}-${map.day}`,time:`${map.hour}:${map.minute}`}}
function formatKST(iso){if(!iso)return"-";const p=isoToLocalParts(iso);return p.date&&p.time?`${p.date} ${p.time}`:"-"}
const selectedStatus=()=>document.querySelector('input[name="sessionStatus"]:checked')?.value||"진행";
function combineDateTime(d,t){if(!d||!t)return null;const nt=/^\d{2}:\d{2}$/.test(t)?t:normalizeTimeInput(t);if(!nt)return null;return new Date(`${d}T${nt}:00+09:00`)}
function updateDuration(){const s=combineDateTime($("startDate").value,$("startTime").value),e=combineDateTime($("endDate").value,$("endTime").value);if(!s||!e||e<=s){$("duration").value="";return}$("duration").value=Math.round((e-s)/60000)+"분"}
["startDate","startTime","endDate","endTime"].forEach(id=>$(id).addEventListener("change",updateDuration));
let sessionDuplicateBlocked=false;
async function checkSelectedSessionDuplicate(){
  sessionDuplicateBlocked=false;
  const n=Number($("sessionNo").value);
  $("nextSessionNo").value=Number.isFinite(n)&&n>0&&n<10?`${n+1}회기`:"";
  markInvalid($("sessionNo"), false);

  if(!selectedReceipt || !Number.isFinite(n) || n<=0){
    if(currentEmployee?.permission!=="조회자") submitBtn.disabled=false;
    return;
  }

  const tableName=selectedReceipt.type==="PC"?PSYCH_TABLE:CAREER_TABLE;
  try{
    const exists=await duplicateSessionExists(tableName,selectedReceipt.client.id,n);
    if(exists){
      sessionDuplicateBlocked=true;
      markInvalid($("sessionNo"), true);
      submitBtn.disabled=true;
      showStatus("error",`선택한 ${n}회기는 이미 등록되어 있습니다. 다른 회기를 선택해주세요.`);
    }else{
      if(statusMsg.classList.contains("error") && statusMsg.textContent.includes("회기")) hideStatus();
      if(currentEmployee?.permission!=="조회자") submitBtn.disabled=false;
      showStatus("info",`${n}회기는 등록 가능합니다.`);
    }
  }catch(err){
    console.error("회기 중복 확인 오류:",err);
    submitBtn.disabled=true;
    showStatus("error","회기 중복 여부를 확인하지 못했습니다. 잠시 후 다시 시도해주세요.");
  }
}
$("sessionNo").addEventListener("change",checkSelectedSessionDuplicate);
$("counselDetail").addEventListener("input",()=>$("charCount").textContent=$("counselDetail").value.length);

async function loadCodeTable(tableName){const {data,error}=await sb.from(tableName).select("code,name,sort_order,active").eq("active",true).order("sort_order",{ascending:true});if(error)throw error;return data||[]}
function fillSelect(el,rows){el.innerHTML='<option value="">선택</option>';rows.forEach(r=>{const o=document.createElement("option");o.value=r.code;o.textContent=r.name;el.appendChild(o)})}
async function loadLookups(){try{const [s,j,t,tp,tools]=await Promise.all([loadCodeTable("sex_codes"),loadCodeTable("job_codes"),loadCodeTable("counsel_client_type"),loadCodeTable("counsel_topic"),loadCodeTable("inspection_tool_codes")]);sexMap=Object.fromEntries(s.map(r=>[r.code,r.name]));jobMap=Object.fromEntries(j.map(r=>[r.code,r.name]));targetMap=Object.fromEntries(t.map(r=>[r.code,r.name]));topicMap=Object.fromEntries(tp.map(r=>[r.code,r.name]));toolMap=Object.fromEntries(tools.map(r=>[r.code,r.name]));fillSelect($("consultationTarget"),t);fillSelect($("consultationTopic"),tp);["testTool1","testTool2","testTool3","testTool4"].forEach(id=>fillSelect($(id),tools))}catch(err){console.error(err);showStatus("error","선택 목록을 불러오지 못했습니다. 로그인 상태 또는 DB 권한을 확인해주세요.")}}

async function guardLogin(){const {data:{session}}=await sb.auth.getSession();if(!session?.user){alert("로그인이 필요한 화면입니다. 메인화면으로 이동합니다.");location.href="index.html";return false}const {data:employee,error}=await sb.from("employee").select("name,position,permission,active").eq("auth_user_id",session.user.id).maybeSingle();if(error||!employee||!employee.active){alert("사용자 권한을 확인할 수 없습니다. 메인화면으로 이동합니다.");location.href="index.html";return false}currentEmployee=employee;if(employee.permission==="조회자"){submitBtn.disabled=true;submitBtn.title="조회자는 상담 등록 권한이 없습니다.";showStatus("info","현재 권한은 조회자입니다. 조회와 PDF 저장만 사용할 수 있습니다.")}return true}

function openLookup(){$("lookupName").value=$("clientName").value.trim();$("lookupPhone").value=$("clientPhone").value.trim();lookupResults.innerHTML='<div class="lookup-empty">내담자명과 연락처로 접수상담을 조회하세요.</div>';modalBackdrop.classList.add("show");modalBackdrop.setAttribute("aria-hidden","false");setTimeout(()=>$("lookupName").focus(),0)}
function closeLookup(){modalBackdrop.classList.remove("show");modalBackdrop.setAttribute("aria-hidden","true")}
$("lookupBtn").addEventListener("click",openLookup);$("lookupCloseBtn").addEventListener("click",closeLookup);modalBackdrop.addEventListener("click",e=>{if(e.target===modalBackdrop)closeLookup()});document.addEventListener("keydown",e=>{if(e.key==="Escape")closeLookup()});

async function getReceiptRows(client){const ps="id,client_id,receptionist_name,receptionist_phone,receptionist_relationship,receipt_at,visit_at,client_type_code,topic_code,application_content,session_no,record_active";const cs="id,client_id,receptionist_name,receptionist_phone,receptionist_relationship,receipt_at,appointment_at,client_type_code,topic_code,counseling_content,session_no,record_active";const [p,c]=await Promise.all([sb.from(PSYCH_TABLE).select(ps).eq("client_id",client.id).eq("record_active",true).order("receipt_at",{ascending:false,nullsFirst:false}),sb.from(CAREER_TABLE).select(cs).eq("client_id",client.id).eq("record_active",true).order("receipt_at",{ascending:false,nullsFirst:false})]);if(p.error)throw p.error;if(c.error)throw c.error;const rows=[];(p.data||[]).forEach(row=>rows.push({type:"PC",client,row}));(c.data||[]).forEach(row=>rows.push({type:"CC",client,row}));return rows.sort((a,b)=>new Date(b.row.receipt_at||0)-new Date(a.row.receipt_at||0))}
function escapeHtml(v){return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]))}

async function searchReceipts(){const name=$("lookupName").value.trim(),phone=$("lookupPhone").value.trim();if(!name||!phone){lookupResults.innerHTML='<div class="lookup-empty">내담자명과 연락처를 모두 입력해주세요.</div>';return}lookupResults.innerHTML='<div class="lookup-empty">조회 중...</div>';try{const {data:clients,error}=await sb.from(BASIC_TABLE).select("id,counsel_type,client_name,client_phone,sex_code,birth_date,job_code,client_address").eq("client_name",name);if(error)throw error;const np=digitsOnly(phone),matched=(clients||[]).filter(c=>digitsOnly(c.client_phone)===np);if(!matched.length){lookupResults.innerHTML='<div class="lookup-empty">일치하는 내담자 기본정보가 없습니다.</div>';return}let candidates=[];for(const client of matched)candidates.push(...await getReceiptRows(client));if(!candidates.length){lookupResults.innerHTML='<div class="lookup-empty">일치하는 활성 접수상담 기록이 없습니다.</div>';return}lookupResults.innerHTML="";candidates.forEach(item=>{const typeLabel=item.type==="PC"?"심리상담":"진로상담",appt=item.type==="PC"?item.row.visit_at:item.row.appointment_at,card=document.createElement("div");card.className="lookup-card";card.innerHTML=`<div class="lookup-card-top"><strong>${escapeHtml(item.client.client_name)} · ${escapeHtml(formatPhone(item.client.client_phone))}</strong><span class="type-badge">${typeLabel}</span></div><p>접수일시 : ${escapeHtml(formatKST(item.row.receipt_at))}</p><p>예약일시 : ${escapeHtml(formatKST(appt))}</p><p>상담대상 : ${escapeHtml(targetMap[item.row.client_type_code]||item.row.client_type_code||"-")} · 상담주제 : ${escapeHtml(topicMap[item.row.topic_code]||item.row.topic_code||"-")}</p>`;card.addEventListener("click",()=>{selectedReceipt=item;populateFromReceipt(item);closeLookup()});lookupResults.appendChild(card)})}catch(err){console.error(err);lookupResults.innerHTML=`<div class="lookup-empty">조회 중 오류가 발생했습니다.<br>${escapeHtml(err.message||String(err))}</div>`}}
$("lookupSearchBtn").addEventListener("click",searchReceipts);

function populateFromReceipt(item){const {client,row,type}=item,appt=isoToLocalParts(type==="PC"?row.visit_at:row.appointment_at);$("clientName").value=client.client_name||"";$("clientPhone").value=formatPhone(client.client_phone||"");$("gender").value=sexMap[client.sex_code]||client.sex_code||"";$("birthDate").value=client.birth_date||"";$("age").value=calcAge(client.birth_date);$("job").value=jobMap[client.job_code]||client.job_code||"";$("address").value=client.client_address||"";$("reservationDate").value=appt.date||"";$("reservationTime").value=appt.time||"";$("consultationTarget").value=row.client_type_code||"";$("consultationTopic").value=row.topic_code||"";const typeLabel=type==="PC"?"심리상담":"진로상담";$("receiptMeta").classList.add("show");$("receiptMeta").textContent=`${typeLabel} 접수 연결 · 접수일시 ${formatKST(row.receipt_at)} · 접수자 ${row.receptionist_name||"-"} · 접수내용 ${type==="PC"?(row.application_content||"-"):(row.counseling_content||"-")}`;const today=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());if(!$("startDate").value)$("startDate").value=today;hideStatus();showStatus("success",`${typeLabel} 접수기록을 상담등록 화면에 불러왔습니다.`)}

const markInvalid=(el,invalid)=>el.classList.toggle("invalid",!!invalid);
const collectTools=()=>["testTool1","testTool2","testTool3","testTool4"].map(id=>$(id).value).filter(Boolean);
async function duplicateSessionExists(tableName,clientId,sessionNo){const {data,error}=await sb.from(tableName).select("id").eq("client_id",clientId).eq("session_no",sessionNo).limit(1);if(error)throw error;return !!(data&&data.length)}
function buildSessionPayload(){const type=selectedReceipt.type,row=selectedReceipt.row,sessionNo=Number($("sessionNo").value),tools=collectTools().join(", "),topicCode=$("consultationTopic").value||row.topic_code||null,topicName=topicMap[topicCode]||topicCode||null,sessionStatus=selectedStatus(),nextDate=$("nextReservationDate").value||null,startDate=$("startDate").value||null;const targetCode=$("consultationTarget").value||row.client_type_code||null;if(type==="PC")return{client_type_code:targetCode,session_no:sessionNo,visit_date:startDate,session_topic_1:topicName,assessment_tool:tools||null,session_content:$("counselDetail").value.trim()||null,next_session_date:nextDate,session_status:sessionStatus};return{client_type_code:targetCode,counseling_date:startDate,session_no:sessionNo,career_topic_1:topicName,assessment_tool:tools||null,counseling_content:$("counselDetail").value.trim()||null,next_session_date:nextDate,session_status:sessionStatus}}
function validateForm(){let ok=true;[$("clientName"),$("clientPhone"),$("sessionNo"),$("startDate"),$("startTime"),$("endDate"),$("endTime"),$("consultationTarget"),$("consultationTopic"),$("counselDetail")].forEach(el=>{const invalid=!String(el.value||"").trim();markInvalid(el,invalid);if(invalid)ok=false});const s=combineDateTime($("startDate").value,$("startTime").value),e=combineDateTime($("endDate").value,$("endTime").value);if(s&&e&&e<=s){markInvalid($("endDate"),true);markInvalid($("endTime"),true);ok=false;showStatus("error","실시일 종료는 시작보다 늦어야 합니다.")}if(!selectedReceipt){ok=false;showStatus("error","먼저 접수상담조회를 통해 등록할 접수기록을 선택해주세요.")}if(sessionDuplicateBlocked){ok=false;showStatus("error","선택한 회기는 이미 등록되어 있습니다. 다른 회기를 선택해주세요.")}return ok}

form.addEventListener("submit",async e=>{e.preventDefault();hideStatus();if(currentEmployee?.permission==="조회자"){showStatus("error","조회자는 상담을 등록할 수 없습니다.");return}if(!validateForm()){if(!statusMsg.classList.contains("show"))showStatus("error","필수 입력항목을 확인해주세요.");return}if(!confirm("입력한 상담내용을 등록하시겠습니까?"))return;submitBtn.disabled=true;const original=submitBtn.textContent;submitBtn.textContent="등록 중...";try{const type=selectedReceipt.type,tableName=type==="PC"?PSYCH_TABLE:CAREER_TABLE,sessionNo=Number($("sessionNo").value);if(await duplicateSessionExists(tableName,selectedReceipt.client.id,sessionNo))throw new Error(`이미 ${sessionNo}회기가 등록되어 있습니다.`);const sessionPayload=buildSessionPayload(),receiptRow=selectedReceipt.row;if(receiptRow.session_no==null){const {error}=await sb.from(tableName).update(sessionPayload).eq("id",receiptRow.id);if(error)throw error;selectedReceipt.row.session_no=sessionNo}else{let newRow;if(type==="PC"){newRow={client_id:selectedReceipt.client.id,receptionist_name:receiptRow.receptionist_name,receptionist_phone:receiptRow.receptionist_phone,receptionist_relationship:receiptRow.receptionist_relationship,receipt_at:receiptRow.receipt_at,visit_at:receiptRow.visit_at,client_type_code:receiptRow.client_type_code,topic_code:receiptRow.topic_code,application_content:receiptRow.application_content,record_active:false,...sessionPayload}}else{newRow={client_id:selectedReceipt.client.id,receptionist_name:receiptRow.receptionist_name,receptionist_phone:receiptRow.receptionist_phone,receptionist_relationship:receiptRow.receptionist_relationship,receipt_at:receiptRow.receipt_at,appointment_at:receiptRow.appointment_at,client_type_code:receiptRow.client_type_code,topic_code:receiptRow.topic_code,record_active:false,...sessionPayload}}const {error}=await sb.from(tableName).insert([newRow]);if(error)throw error}showStatus("success",`${type==="PC"?"심리상담":"진로상담"} ${sessionNo}회기가 정상적으로 등록되었습니다.`)}catch(err){console.error(err);showStatus("error","상담 등록 중 오류가 발생했습니다: "+(err.message||err))}finally{submitBtn.disabled=currentEmployee?.permission==="조회자";submitBtn.textContent=original}});

form.addEventListener("reset",()=>setTimeout(()=>{selectedReceipt=null;sessionDuplicateBlocked=false;$("charCount").textContent="0";$("duration").value="";$("nextSessionNo").value="";$("receiptMeta").classList.remove("show");$("receiptMeta").textContent="";document.querySelectorAll(".invalid").forEach(el=>el.classList.remove("invalid"));hideStatus();submitBtn.disabled=currentEmployee?.permission==="조회자";if(currentEmployee?.permission==="조회자")showStatus("info","현재 권한은 조회자입니다. 조회와 PDF 저장만 사용할 수 있습니다.")},0));

// 10분 미사용 자동 로그아웃
const IDLE_LOGOUT_MS=10*60*1000;
let idleLogoutTimer=null;
let lastMouseMoveAt=0;
function clearIdleLogoutTimer(){if(idleLogoutTimer!==null){clearTimeout(idleLogoutTimer);idleLogoutTimer=null;}}
function scheduleIdleLogout(){
  clearIdleLogoutTimer();
  idleLogoutTimer=setTimeout(async()=>{
    try{await sb.auth.signOut({scope:"local"});}catch(err){console.warn("자동 로그아웃 경고:",err);}
    sessionStorage.removeItem("sina_employee");
    alert("10분 동안 사용이 없어 자동 로그아웃되었습니다.");
    location.href="index.html";
  },IDLE_LOGOUT_MS);
}
function recordActivity(e){
  if(e?.type==="mousemove"){
    const now=Date.now();
    if(now-lastMouseMoveAt<1000)return;
    lastMouseMoveAt=now;
  }
  scheduleIdleLogout();
}
["mousedown","mousemove","keydown","touchstart","scroll"].forEach(name=>window.addEventListener(name,recordActivity,{passive:true}));

$("backBtn").addEventListener("click",()=>{if(history.length>1)history.back();else location.href="index.html"});
