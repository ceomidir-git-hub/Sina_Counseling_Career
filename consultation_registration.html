<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담 등록</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --blue:#1457a6; --blue-dark:#123f78; --blue-soft:#eef6ff; --line:#b9cce3;
    --text:#172033; --muted:#6b7788; --paper:#fff; --bg:#eef1f5; --yellow:#fffdf2;
    --green:#178a4b; --red:#c63c3c; --field-h:36px;
  }
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:"Malgun Gothic","Noto Sans KR",system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--text);background:var(--bg)}
  button,input,select,textarea{font:inherit}
  .page-wrap{min-height:100vh;padding:18px 0 30px;display:flex;justify-content:center;align-items:flex-start}
  .a4-page{width:210mm;min-height:297mm;max-width:calc(100vw - 24px);background:var(--paper);box-shadow:0 10px 30px rgba(15,23,42,.14);padding:10mm 9mm 8mm}
  .top-row{min-height:17mm;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:2px solid var(--blue-dark);padding:0 2mm 4mm;margin-bottom:7mm}
  h1{margin:0;color:var(--blue-dark);font-size:29px;font-weight:950;letter-spacing:-1.3px;line-height:1}
  .pdf-btn{height:36px;padding:0 14px;border:1px solid var(--blue);border-radius:7px;background:#fff;color:var(--blue-dark);font-weight:900;font-size:13px;cursor:pointer}
  .pdf-btn:hover{background:var(--blue-soft)}
  .statusMsg{display:none;margin:0 0 4mm;padding:9px 11px;border-radius:7px;font-size:12px;font-weight:800}
  .statusMsg.show{display:block}.statusMsg.success{background:#effaf3;border:1px solid #bfe6cd;color:var(--green)}
  .statusMsg.error{background:#fff1f1;border:1px solid #efc4c4;color:var(--red)}
  .statusMsg.info{background:#eef6ff;border:1px solid #c9dff8;color:var(--blue-dark)}
  .section{border:1px solid #6fa3dc;border-radius:6px;overflow:hidden;margin-bottom:6mm;break-inside:avoid;page-break-inside:avoid}
  .section-head{min-height:12mm;padding:0 4mm;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(180deg,#f3f8fe 0%,#e6f2ff 100%);border-bottom:1px solid #a8c6e7}
  .section-head h2{margin:0;color:var(--blue);font-size:17px;font-weight:950;letter-spacing:-.5px}
  .lookup-btn{height:31px;padding:0 11px;border:1px solid var(--blue);border-radius:6px;background:#fff;color:var(--blue-dark);font-size:12px;font-weight:900;cursor:pointer}
  .lookup-btn:hover{background:var(--blue-soft)}
  .section-body{padding:4mm 4mm 4.5mm;background:#fff}
  .grid-2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
  .form-pair{min-width:0;display:grid;grid-template-columns:27mm minmax(0,1fr);align-items:center;gap:2.5mm}
  .form-pair.full{grid-column:1/-1;grid-template-columns:27mm minmax(0,1fr)}
  .form-pair label,.detail-label{font-size:12.5px;font-weight:850;color:#252b34;white-space:nowrap}
  input[type="text"],input[type="date"],input[type="time"],select,textarea{width:100%;min-width:0;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow);color:#161b22;outline:none;font-size:12.5px;font-weight:650}
  input[type="text"],input[type="date"],input[type="time"],select{height:var(--field-h);padding:0 10px}
  input[readonly]{background:#f8fafc;color:#384557}
  input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 2px rgba(20,87,166,.11)}
  .date-time{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,.85fr);gap:5px}

  .time-input{
    text-align:center;
    letter-spacing:.15px;
  }
  .time-input::placeholder{
    color:#9aa5b3;
    font-size:10.5px;
    letter-spacing:-.2px;
  }
  .tests{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:3.2mm 7mm}
  .detail-grid{display:grid;grid-template-columns:27mm minmax(0,1fr);gap:2.5mm;align-items:start}
  textarea{height:45mm;min-height:45mm;max-height:45mm;resize:none;padding:9px 10px 22px;line-height:1.55}
  .textarea-wrap{position:relative}.char-count{position:absolute;right:8px;bottom:6px;background:rgba(255,255,255,.92);color:#7b8796;font-size:10px;font-weight:750;padding-left:6px}
  .session-status-wrap{height:var(--field-h);display:flex;align-items:center;gap:16px;padding:0 10px;border:1px solid #cfd6df;border-radius:4px;background:var(--yellow)}
  .radio-label{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:850;cursor:pointer}.radio-label input{accent-color:var(--blue);margin:0}
  .actions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12mm;width:72%;margin:7mm auto 0}
  .btn{height:40px;border-radius:6px;border:1px solid var(--blue);background:#fff;color:var(--blue-dark);font-size:13px;font-weight:900;cursor:pointer}
  .btn.primary{background:#1461bd;color:#fff;border-color:#1461bd}.btn:disabled{opacity:.45;cursor:not-allowed}
  .receipt-meta{display:none;margin-top:3mm;padding:7px 10px;border-radius:5px;background:#f7fbff;border:1px dashed #9fc0e5;font-size:10.5px;color:#50627a;line-height:1.45}.receipt-meta.show{display:block}
  .modal-backdrop{position:fixed;inset:0;z-index:9999;background:rgba(15,23,42,.52);display:none;align-items:center;justify-content:center;padding:20px}.modal-backdrop.show{display:flex}
  .modal{width:min(720px,96vw);max-height:82vh;overflow:hidden;background:#fff;border-radius:12px;box-shadow:0 26px 70px rgba(15,23,42,.3);border:1px solid #d7e1ec;display:grid;grid-template-rows:auto auto minmax(0,1fr)}
  .modal-head{height:52px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #e4eaf1;background:#f7fbff}.modal-head h3{margin:0;color:var(--blue-dark);font-size:17px;font-weight:950}
  .modal-x{width:32px;height:32px;border:0;border-radius:7px;background:#eef2f6;color:#475569;font-size:20px;cursor:pointer}
  .modal-search{padding:14px 18px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;border-bottom:1px solid #edf1f5}.modal-search button{min-width:72px;border:0;border-radius:6px;background:var(--blue);color:#fff;font-size:12px;font-weight:900;cursor:pointer}
  .lookup-results{min-height:160px;overflow:auto;padding:14px 18px 18px}.lookup-empty{padding:28px 10px;text-align:center;color:#738095;font-size:12px}
  .lookup-card{border:1px solid #d7e1ec;border-radius:8px;padding:11px 12px;margin-bottom:8px;cursor:pointer;background:#fff}.lookup-card:hover{border-color:#7ca9dd;background:#f7fbff}
  .lookup-card-top{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:5px}.lookup-card-top strong{font-size:13px;color:#233650}
  .type-badge{padding:3px 7px;border-radius:999px;background:#e9f3ff;color:#1457a6;font-size:10px;font-weight:900;white-space:nowrap}
  .lookup-card p{margin:2px 0;color:#64748b;font-size:11px;line-height:1.45}.invalid{border-color:var(--red)!important;box-shadow:0 0 0 2px rgba(198,60,60,.10)!important}
  @media(max-width:760px){.a4-page{width:calc(100vw - 16px);padding:18px 14px}.top-row{margin-bottom:16px}.grid-2,.tests{grid-template-columns:1fr}.form-pair.full{grid-column:auto}.actions{width:100%;gap:8px}}


  /* ===== FINAL 2026-08-29 : 이전상담 요약 정식 표기 ===== */
  .receipt-summary-row{
    grid-column:1 / -1;
    display:grid;
    grid-template-columns:27mm minmax(0,1fr);
    align-items:start;
    gap:2.5mm;
    margin-top:3.2mm;
  }
  .receipt-summary-label{
    padding-top:9px;
    font-size:12.5px;
    font-weight:850;
    color:#252b34;
    white-space:nowrap;
  }
  .receipt-summary-box{
    min-height:24mm;
    padding:9px 10px;
    border:1px solid #cfd6df;
    border-radius:4px;
    background:#f8fafc;
    color:#384557;
    font-size:12.5px;
    font-weight:650;
    line-height:1.55;
    white-space:pre-wrap;
    overflow-wrap:anywhere;
  }

  /* 상세 상담내용: 제목 1행 + 입력칸 다음행 전체 폭 */
  .detail-grid{
    display:grid;
    grid-template-columns:1fr;
    row-gap:1.6mm;
    align-items:start;
  }
  .detail-grid .detail-label{
    display:block;
    width:max-content;
    padding-top:0!important;
  }
  .detail-grid .textarea-wrap{
    width:100%;
    min-width:0;
  }

  /* 화면용 최종 바닥글 */
  .screen-footer{
    margin-top:8mm;
    padding:0 1mm 2mm;
  }
  .screen-footer .footer-rights{
    margin:0 0 1.5mm;
    color:#6b7280;
    font-size:12px;
    font-weight:500;
    line-height:1.3;
    text-align:left;
  }
  .screen-footer .footer-divider{
    border:0;
    border-top:1.2pt solid #1457a6;
    margin:0;
  }
  .screen-footer .footer-company{
    margin:2.5mm 0 0;
    color:#123f78;
    font-size:29px;
    font-weight:950;
    line-height:1;
    letter-spacing:-1.3px;
    text-align:center;
  }

  /* PDF 최종 바닥글 */
  .print-footer{
    position:fixed;
    left:8mm;
    right:8mm;
    bottom:4mm;
    background:#fff;
  }
  .print-footer-rights{
    margin:0 0 1mm;
    color:#6b7280;
    font-size:17px;
    font-weight:500;
    line-height:1.25;
    text-align:left;
  }
  .print-footer-divider{
    border:0;
    border-top:1.2pt solid #1457a6;
    margin:0;
  }
  .print-footer-company{
    margin:2mm 0 0;
    color:#123f78;
    font-size:23pt;
    font-weight:900;
    line-height:1;
    letter-spacing:-1px;
    text-align:center;
  }

  @media(max-width:760px){
    .receipt-summary-row{grid-template-columns:90px minmax(0,1fr)}
  }

  /* PDF 전용 문서폼: 화면 입력 컨트롤을 직접 인쇄하지 않고 값만 문서칸으로 변환 */
  .print-document{display:none}
  .print-sheet{
    width:194mm;
    margin:0 auto;
    background:#fff;
    color:#172033;
    font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;
  }
  .print-title-row{
    height:16mm;
    display:flex;
    align-items:center;
    border-bottom:1.4pt solid #123f78;
    padding:0 2mm 3mm;
    margin-bottom:5mm;
  }
  .print-title-row h1{
    margin:0;
    color:#123f78;
    font-size:23pt;
    font-weight:800;
    letter-spacing:-.8pt;
  }
  .print-section{
    border:.65pt solid #6fa3dc;
    border-radius:4px;
    overflow:hidden;
    margin-bottom:4mm;
    break-inside:avoid;
    page-break-inside:avoid;
  }
  .print-section-title{
    height:10mm;
    display:flex;
    align-items:center;
    padding:0 4mm;
    background:#eaf4ff;
    border-bottom:.55pt solid #a8c6e7;
    color:#1457a6;
    font-size:12.5pt;
    font-weight:800;
  }
  .print-section-body{padding:3mm 4mm 3.5mm}
  .print-grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    column-gap:7mm;
    row-gap:2.6mm;
  }
  .print-pair{
    min-width:0;
    display:grid;
    grid-template-columns:26mm minmax(0,1fr);
    align-items:center;
    gap:2.5mm;
  }
  .print-pair.full{grid-column:1/-1}
  .print-label{
    font-size:9.5pt;
    font-weight:700;
    color:#252b34;
    white-space:nowrap;
  }
  .print-box{
    min-width:0;
    min-height:8mm;
    display:flex;
    align-items:center;
    padding:1.3mm 2.4mm;
    border:.5pt solid #cfd6df;
    border-radius:3px;
    background:#fff;
    color:#111827;
    font-size:9.2pt;
    font-weight:600;
    line-height:1.25;
    overflow-wrap:anywhere;
  }
  .print-box.detail{
    min-height:37mm;
    align-items:flex-start;
    padding-top:2mm;
    white-space:pre-wrap;
    line-height:1.5;
  }
  .print-detail-row{
    display:grid;
    grid-template-columns:26mm minmax(0,1fr);
    gap:2.5mm;
    margin-top:2.6mm;
  }
  .print-detail-row .print-label{padding-top:2mm}
  @page{size:A4 portrait;margin:8mm}
  @media print{
    html,body{
      margin:0!important;
      padding:0!important;
      background:#fff!important;
      -webkit-print-color-adjust:exact;
      print-color-adjust:exact;
    }
    .page-wrap,.modal-backdrop,.screen-footer{display:none!important}
    .print-document{display:block!important}
    .print-sheet{
      width:100%!important;
      margin:0!important;
      padding-bottom:28mm!important;
    }
  }
/* ==========================================================
   FINAL 2026-08-29 : 상담등록 화면/PDF 동일 구성
   - 머릿글/바닥글: 접수상담등록 확정 형식과 동일
   - 이전상담 요약: 주소 아래 정식 항목
   - 상세 상담내용: 제목 다음 행 전체 폭
   - A4 세로 1페이지 유지
   ========================================================== */
@media print{
  @page{size:210mm 297mm;margin:0}

  html,body{
    width:210mm!important;
    height:297mm!important;
    min-height:297mm!important;
    max-height:297mm!important;
    margin:0!important;
    padding:0!important;
    overflow:hidden!important;
    background:#fff!important;
    -webkit-print-color-adjust:exact!important;
    print-color-adjust:exact!important;
  }

  .page-wrap,.modal-backdrop,.screen-footer{
    display:none!important;
  }

  .print-document{
    display:block!important;
    width:210mm!important;
    height:297mm!important;
    min-height:297mm!important;
    max-height:297mm!important;
    margin:0!important;
    padding:0!important;
    overflow:hidden!important;
    background:#fff!important;
  }

  .print-sheet{
    position:relative!important;
    width:210mm!important;
    height:297mm!important;
    min-height:297mm!important;
    max-height:297mm!important;
    margin:0!important;
    padding:8mm 7mm 22mm!important;
    overflow:hidden!important;
    background:#fff!important;
  }

  /* 머릿글: 확정 위치 유지 */
  .print-title-row{
    width:100%!important;
    min-height:13mm!important;
    height:13mm!important;
    margin:0 0 2mm!important;
    padding:0 0 2mm!important;
    display:flex!important;
    align-items:flex-end!important;
    border-bottom:1.2pt solid #123f78!important;
  }
  .print-title-row h1{
    margin:0!important;
    color:#123f78!important;
    font-size:23pt!important;
    font-weight:900!important;
    line-height:1!important;
    letter-spacing:-1px!important;
  }

  /* 화면의 section 구조와 동일한 비율 */
  .print-section{
    border:1px solid #6fa3dc!important;
    border-radius:6px!important;
    overflow:hidden!important;
    margin:0 0 3mm!important;
    background:#fff!important;
    break-inside:avoid!important;
    page-break-inside:avoid!important;
  }
  .print-section-title{
    min-height:8mm!important;
    height:8mm!important;
    display:flex!important;
    align-items:center!important;
    padding:0 3mm!important;
    background:linear-gradient(180deg,#f3f8fe 0%,#e6f2ff 100%)!important;
    border-bottom:1px solid #a8c6e7!important;
    color:#1457a6!important;
    font-size:15pt!important;
    font-weight:950!important;
    letter-spacing:-.5px!important;
  }
  .print-section-body{
    padding:2.2mm 3mm 2.5mm!important;
    background:#fff!important;
  }

  .print-grid{
    display:grid!important;
    grid-template-columns:repeat(2,minmax(0,1fr))!important;
    column-gap:5mm!important;
    row-gap:2.2mm!important;
  }
  .print-pair{
    min-width:0!important;
    display:grid!important;
    grid-template-columns:27mm minmax(0,1fr)!important;
    align-items:center!important;
    gap:2.5mm!important;
  }
  .print-pair.full{
    grid-column:1 / -1!important;
  }
  .print-label{
    color:#252b34!important;
    font-size:10pt!important;
    font-weight:850!important;
    line-height:1.25!important;
    white-space:nowrap!important;
  }
  .print-box{
    min-width:0!important;
    min-height:7.5mm!important;
    height:7.5mm!important;
    display:flex!important;
    align-items:center!important;
    padding:0 2.4mm!important;
    border:1px solid #cfd6df!important;
    border-radius:4px!important;
    background:#f8fafc!important;
    color:#384557!important;
    font-size:10pt!important;
    font-weight:650!important;
    line-height:1.3!important;
    overflow:hidden!important;
    overflow-wrap:anywhere!important;
  }

  /* 주소 아래 '이전상담 요약' - 화면과 동일한 정식 항목 */
  .print-summary-row{
    display:grid!important;
    grid-template-columns:27mm minmax(0,1fr)!important;
    align-items:start!important;
    gap:2.5mm!important;
    margin-top:2.2mm!important;
  }
  .print-summary-row .print-label{
    padding-top:2mm!important;
  }
  .print-summary-box{
    min-height:15mm!important;
    height:15mm!important;
    padding:1.8mm 2.4mm!important;
    align-items:flex-start!important;
    white-space:pre-wrap!important;
    line-height:1.4!important;
    overflow:hidden!important;
  }

  /* 상세 상담내용: 제목 한 행 + 입력내용 다음 행 전체 폭 */
  .print-counsel-detail{
    margin-top:2.2mm!important;
  }
  .print-counsel-detail .print-label{
    display:block!important;
    margin:0 0 1.2mm!important;
    padding:0!important;
  }
  .print-box.detail{
    width:100%!important;
    min-height:27mm!important;
    height:27mm!important;
    padding:2mm 2.4mm!important;
    align-items:flex-start!important;
    white-space:pre-wrap!important;
    line-height:1.45!important;
    overflow:hidden!important;
  }

  /* 바닥글: 접수상담등록 확정 형식/위치와 동일 */
  .print-footer{
    display:block!important;
    position:fixed!important;
    left:7mm!important;
    right:7mm!important;
    bottom:3.5mm!important;
    z-index:9999!important;
    background:#fff!important;
    pointer-events:none!important;
  }
  .print-footer-rights{
    margin:0 0 1mm!important;
    text-align:left!important;
    color:#6b7280!important;
    font-size:17px!important;
    font-weight:500!important;
    line-height:1.25!important;
  }
  .print-footer-divider{
    height:0!important;
    border:0!important;
    border-top:1.2pt solid #1457a6!important;
    margin:0!important;
  }
  .print-footer-company{
    margin:2mm 0 0!important;
    text-align:center!important;
    color:#123f78!important;
    font-size:23pt!important;
    font-weight:900!important;
    line-height:1!important;
    letter-spacing:-1px!important;
    white-space:nowrap!important;
  }
}


/* ===== FINAL PDF 안정화 2026-08-29 : 2열 폼을 Flex로 고정 ===== */
@media print{
  .print-grid{
    display:flex!important;
    flex-wrap:wrap!important;
    justify-content:space-between!important;
    align-items:stretch!important;
    column-gap:0!important;
    row-gap:2.2mm!important;
  }
  .print-pair{
    width:48.7%!important;
    min-width:0!important;
    display:flex!important;
    align-items:center!important;
    gap:2.5mm!important;
  }
  .print-pair.full{
    width:100%!important;
  }
  .print-pair > .print-label{
    flex:0 0 27mm!important;
    width:27mm!important;
  }
  .print-pair > .print-box{
    flex:1 1 auto!important;
    width:auto!important;
  }

  .print-summary-row{
    display:flex!important;
    align-items:flex-start!important;
    gap:2.5mm!important;
  }
  .print-summary-row > .print-label{
    flex:0 0 27mm!important;
    width:27mm!important;
  }
  .print-summary-row > .print-summary-box{
    flex:1 1 auto!important;
    width:auto!important;
  }
}


/* ===== FINAL 2026-08-29 : 모든 날짜 요일 표기 ===== */
.date-time.weekday-enabled{
  grid-template-columns:minmax(0,1.25fr) 34px minmax(0,.72fr);
  gap:5px;
}
.weekday-chip{
  height:var(--field-h);
  display:flex;
  align-items:center;
  justify-content:center;

function isoToLocalParts(iso){if(!iso)return{date:"",time:""};const d=new Date(iso);if(Number.isNaN(d.getTime()))return{date:"",time:""};const parts=new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit",hour12:false}).formatToParts(d);const map={};parts.forEach(p=>{if(p.type!=="literal")map[p.type]=p.value});return{date:`${map.year}-${map.month}-${map.day}`,time:`${map.hour}:${map.minute}`}}

    "receipt_at","appointment_at","counseling_date","client_type_code","topic_code",
    "counseling_content","session_no","career_topic_1",
    "session_start_at","session_end_at","next_session_date","next_session_at",
    "session_status","assessment_tool","record_active","created_at","updated_at","contact_method"
  ].join(",");

  const [p,c]=await Promise.all([
    sb.from(PSYCH_TABLE).select(ps).eq("client_id",client.id),

function escapeHtml(v){
  return String(v??"").replace(/[&<>"']/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch]));
}

function historyDateText(type,row,stage){

}

function receiptContentOf(type,row){

function sessionContentOf(type,row){

function compactPreview(value,maxLen=110){
  const oneLine=String(value||"").replace(/\s+/g," ").trim();
  if(!oneLine) return "-";
  return oneLine.length>maxLen?oneLine.slice(0,maxLen)+"…":oneLine;
}

function pickReceiptRow(rows){
  if(!rows.length) return null;

  const pureReceipt=rows
    .filter(r=>r.session_no==null)
    .sort((a,b)=>String(a.receipt_at||a.created_at||"").localeCompare(String(b.receipt_at||b.created_at||"")))[0];

  if(pureReceipt) return pureReceipt;

  return rows.slice().sort((a,b)=>{
    const da=String(a.receipt_at||a.created_at||"");
    const db=String(b.receipt_at||b.created_at||"");
    if(da!==db) return da.localeCompare(db);
    return Number(a.session_no||999)-Number(b.session_no||999);
  })[0];
}

function buildHistoryItems(type,client,rows){
  if(!rows.length) return [];

  const receiptRow=pickReceiptRow(rows);
  const maxSessionNo=rows.reduce((max,row)=>{
    const n=Number(row.session_no);
    return Number.isFinite(n)&&n>max?n:max;
  },0);

  const items=[];

  if(receiptRow){
    items.push({
      type,client,row:receiptRow,receiptRow,
      stage:"receipt",stageLabel:"접수",sessionNo:0,maxSessionNo,
      topic:receiptTopicOf(receiptRow),
      content:receiptContentOf(type,receiptRow),
      dateText:historyDateText(type,receiptRow,"receipt")
    });
  }

  const bySession=new Map();
  rows.forEach(row=>{
    const n=Number(row.session_no);
    if(!Number.isFinite(n)||n<=0) return;

    const previous=bySession.get(n);
    if(!previous){
      bySession.set(n,row);
      return;
    }

    const oldTime=String(previous.updated_at||previous.created_at||"");
    const newTime=String(row.updated_at||row.created_at||"");
    if(newTime>oldTime) bySession.set(n,row);
  });

  Array.from(bySession.keys()).sort((a,b)=>a-b).forEach(n=>{
    const row=bySession.get(n);
    items.push({
      type,client,row,receiptRow:receiptRow||row,
      stage:"session",stageLabel:`${n}회기`,sessionNo:n,maxSessionNo,
      topic:sessionTopicOf(type,row),
      content:sessionContentOf(type,row),
      dateText:historyDateText(type,row,"session")
    });
  });

  return items;
}

async function searchReceipts(){

  if(!memberKey){
    lookupResults.innerHTML='<div class="lookup-empty">회원 KEY를 입력해주세요.</div>';
    return;
  }

  lookupResults.innerHTML='<div class="lookup-empty">접수 및 이전 상담 이력을 조회 중입니다...</div>';

  try{
    const {data:client,error}=await sb
      .from(BASIC_TABLE)
      .select("id,member_key,counsel_type,client_name,client_phone,sex_code,birth_date,job_code,client_address")

      return;
    }

    const history=await getHistoryRows(client);
    const candidates=[
      ...buildHistoryItems("PC",client,history.PC),
      ...buildHistoryItems("CC",client,history.CC)
    ];

    if(!candidates.length){
      lookupResults.innerHTML='<div class="lookup-empty">해당 회원 KEY의 접수 또는 이전 상담 이력이 없습니다.</div>';
      return;
    }

    candidates.sort((a,b)=>{
      if(a.type!==b.type) return a.type==="PC"?-1:1;
      return a.sessionNo-b.sessionNo;
    });

    lookupResults.innerHTML="";

    candidates.forEach(item=>{
      const typeLabel=item.type==="PC"?"심리상담":"진로상담";
      const card=document.createElement("div");

      card.className="lookup-card";
      card.innerHTML=
        `<div class="lookup-card-top">`+

          `<span class="type-badge">${typeLabel}</span>`+

}

async function duplicateSessionExists(tableName,clientId,sessionNo){const {data,error}=await sb.from(tableName).select("id").eq("client_id",clientId).eq("session_no",sessionNo).limit(1);if(error)throw error;return !!(data&&data.length)}

function assertSavedSessionTiming(savedRow, expectedPayload){
  if(!savedRow) throw new Error("상담 저장 후 DB 확인 결과를 받지 못했습니다.");

  const normalize=v=>v ? new Date(v).toISOString() : null;
  const checks=[
    ["session_start_at","실시일 시작"],
    ["session_end_at","실시일 종료"],
    ["next_session_at","차기 예약일시"]
  ];

  const mismatches=[];
  checks.forEach(([key,label])=>{
    const expected=normalize(expectedPayload[key]);
    const actual=normalize(savedRow[key]);
    if(expected!==actual){
      mismatches.push(`${label}: 입력=${expected||"(없음)"} / DB=${actual||"(없음)"}`);
    }
  });

  if(mismatches.length){
    throw new Error(
      "상담 시간정보 저장 검증에 실패했습니다.\\n" + mismatches.join("\\n")
    );
  }
}

form.addEventListener("submit",async e=>{

        receptionist_relationship:receiptRow.receptionist_relationship,

        visit_at:receiptRow.visit_at,

        topic_code:$("consultationTopic").value||receiptRow.topic_code||null,
        application_content:receiptRow.application_content||null,
        contact_method:receiptRow.contact_method||null,
        record_active:true,
        ...sessionPayload
      };
    }else{
      newRow={
        client_id:selectedReceipt.client.id,
        receptionist_name:receiptRow.receptionist_name,
        receptionist_phone:receiptRow.receptionist_phone,
        receptionist_relationship:receiptRow.receptionist_relationship,
        receipt_at:receiptRow.receipt_at,
        appointment_at:receiptRow.appointment_at,
        client_type_code:$("consultationTarget").value||receiptRow.client_type_code||null,
        topic_code:$("consultationTopic").value||receiptRow.topic_code||null,
        contact_method:receiptRow.contact_method||null,
        record_active:true,
        ...sessionPayload
      };
    }

    const {data,error}=await sb
      .from(tableName)
      .insert([newRow])
      .select("id,session_no,session_start_at,session_end_at,next_session_at,next_session_date,session_status,record_active,updated_at")
      .single();

    if(error) throw error;
    savedRow=data;
    selectedReceipt.maxSessionNo=sessionNo;

    // 저장 직후 DB의 시간값을 다시 비교하여 누락 저장을 차단
    assertSavedSessionTiming(savedRow,sessionPayload);

    expectedNextSessionNo=sessionNo+1;

    showStatus(
      "success",
      `${type==="PC"?"심리상담":"진로상담"} ${sessionNo}회기가 정상적으로 등록되었습니다. `+
      `접수 원본은 유지되며, 실시 시작·종료 및 차기 예약시간까지 DB 저장을 확인했습니다.`
    );
  }catch(err){
    console.error(err);
    showStatus("error","상담 등록 중 오류가 발생했습니다: "+(err.message||err));
  }finally{

    submitBtn.textContent=original;
  }
});

            <div class="print-pair"><div class="print-label">검사도구1</div><div class="print-box">${escapeHtml(printable(getSelectText("testTool1")))}</div></div>
            <div class="print-pair"><div class="print-label">검사도구2</div><div class="print-box">${escapeHtml(printable(getSelectText("testTool2")))}</div></div>
            <div class="print-pair"><div class="print-label">검사도구3</div><div class="print-box">${escapeHtml(printable(getSelectText("testTool3")))}</div></div>
            <div class="print-pair"><div class="print-label">검사도구4</div><div class="print-box">${escapeHtml(printable(getSelectText("testTool4")))}</div></div>
            <div class="print-pair"><div class="print-label">차기 회기</div><div class="print-box">${escapeHtml(printable($("nextSessionNo").value))}</div></div>
            <div class="print-pair"><div class="print-label">차기 예약일</div><div class="print-box">${escapeHtml(printable(formatDateTimeWithWeekday($("nextReservationDate").value,$("nextReservationTime").value)))}</div></div>
          </div>
        </div>
      </section>

      <section class="print-section">
        <div class="print-section-title">3. 상담내용</div>
        <div class="print-section-body">
          <div class="print-grid">
            <div class="print-pair"><div class="print-label">상담대상</div><div class="print-box">${escapeHtml(printable(getSelectText("consultationTarget")))}</div></div>
            <div class="print-pair"><div class="print-label">상담주제</div><div class="print-box">${escapeHtml(printable(getSelectText("consultationTopic")))}</div></div>
          </div>
          <div class="print-counsel-detail">
            <div class="print-label">상세 상담내용</div>
            <div class="print-box detail">${escapeHtml(printable($("counselDetail").value))}</div>
          </div>
        </div>
      </section>

      <footer class="print-footer">
        <p class="print-footer-rights">이 문서의 저작권은 마음:시나브로심리상담연구소에 있습니다.</p>
        <hr class="print-footer-divider">
        <p class="print-footer-company">마음:시나브로 심리상담연구소</p>
      </footer>
    </div>`;
  $("printDocument").innerHTML=html;
}

$("pdfSaveBtn").addEventListener("click",()=>{
  ["startTime","endTime","nextReservationTime"].forEach(id=>{
    const el=$(id);if(el.value&&!/^\d{2}:\d{2}$/.test(el.value)){const v=normalizeTimeInput(el.value);if(v)el.value=v;}
  });
  buildPrintDocument();
  const originalTitle=document.title,name=$("clientName").value.trim()||"미입력",date=$("startDate").value||new Intl.DateTimeFormat("en-CA",{timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"}).format(new Date());
  document.title=`상담등록_${name}_${date}`;
  window.print();
  setTimeout(()=>document.title=originalTitle,700);
});
(async function init(){const ok=await guardLogin();if(ok){await loadLookups();scheduleIdleLogout();}})();
})();
</script>
