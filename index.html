<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>마음:시나브로심리상담연구소 관제센타 - 로그인</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --navy:#172742;
      --navy2:#233a63;
      --purple:#6c63e8;
      --blue:#4e90f8;
      --bg:#eef3f9;
      --card:#ffffff;
      --line:#dce4ef;
      --text:#1d2940;
      --muted:#7f8a9c;
      --danger:#d64545;
      --success:#2f9a5d;
      --shadow:0 22px 60px rgba(23,39,66,.18);
    }

    *{box-sizing:border-box}

    html,body{
      margin:0;
      width:100%;
      min-width:1180px;
      height:100%;
      font-family:"Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;
      background:
        radial-gradient(circle at 18% 12%, rgba(108,99,232,.14), transparent 34%),
        radial-gradient(circle at 85% 78%, rgba(78,144,248,.13), transparent 34%),
        linear-gradient(135deg,#edf2f8 0%,#f8fafc 48%,#eaf0f7 100%);
      color:var(--text);
    }

    body{
      overflow:hidden;
    }

    .login-page{
      width:100vw;
      height:100vh;
      display:grid;
      place-items:center;
      padding:28px;
      position:relative;
    }

    .login-page::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background-image:
        linear-gradient(rgba(23,39,66,.025) 1px, transparent 1px),
        linear-gradient(90deg, rgba(23,39,66,.025) 1px, transparent 1px);
      background-size:32px 32px;
      mask-image:linear-gradient(to bottom,rgba(0,0,0,.75),transparent);
    }

    .login-shell{
      position:relative;
      z-index:1;
      width:940px;
      height:570px;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      border:1px solid rgba(255,255,255,.7);
      border-radius:24px;
      overflow:hidden;
      background:rgba(255,255,255,.82);
      backdrop-filter:blur(12px);
      box-shadow:var(--shadow);
    }

    .visual-panel{
      position:relative;
      padding:48px 46px;
      color:#fff;
      background:
        linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,0)),
        linear-gradient(145deg,var(--navy) 0%,#21385f 52%,#344f87 100%);
      overflow:hidden;
    }

    .visual-panel::before,
    .visual-panel::after{
      content:"";
      position:absolute;
      border-radius:50%;
      border:1px solid rgba(255,255,255,.12);
    }

    .visual-panel::before{
      width:350px;height:350px;
      right:-160px;top:-90px;
    }

    .visual-panel::after{
      width:260px;height:260px;
      left:-115px;bottom:-110px;
    }

    .brand-badge{
      display:inline-flex;
      align-items:center;
      gap:9px;
      height:34px;
      padding:0 13px;
      border-radius:999px;
      background:rgba(255,255,255,.11);
      border:1px solid rgba(255,255,255,.18);
      font-size:12px;
      font-weight:800;
      letter-spacing:.2px;
    }

    .brand-badge i{
      width:8px;height:8px;border-radius:50%;
      background:#6ce39a;
      box-shadow:0 0 0 5px rgba(108,227,154,.10);
    }

    .visual-copy{
      margin-top:88px;
      position:relative;
      z-index:2;
    }

    .visual-copy h1{
      margin:0;
      font-size:31px;
      line-height:1.35;
      letter-spacing:-1.25px;
      font-weight:900;
    }

    .visual-copy h1 span{
      display:block;
      color:#b9ccff;
    }

    .visual-copy p{
      margin:21px 0 0;
      width:90%;
      font-size:13.5px;
      line-height:1.85;
      color:#d4deec;
      letter-spacing:-.25px;
    }

    .flow-box{
      position:absolute;
      left:46px;
      right:46px;
      bottom:44px;
      z-index:2;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:8px;
    }

    .flow-box div{
      height:62px;
      display:grid;
      place-items:center;
      align-content:center;
      gap:6px;
      background:rgba(255,255,255,.08);
      border:1px solid rgba(255,255,255,.12);
      border-radius:12px;
      text-align:center;
    }

    .flow-box strong{
      font-size:12px;
      color:#fff;
    }

    .flow-box small{
      font-size:9.5px;
      color:#bfcce0;
    }

    .form-panel{
      padding:54px 58px 44px;
      background:rgba(255,255,255,.95);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }

    .form-title small{
      display:block;
      color:var(--purple);
      font-size:11.5px;
      font-weight:900;
      letter-spacing:.8px;
      margin-bottom:8px;
    }

    .form-title h2{
      margin:0;
      font-size:26px;
      letter-spacing:-.9px;
    }

    .form-title p{
      margin:9px 0 0;
      color:var(--muted);
      font-size:12.5px;
      line-height:1.6;
    }

    .login-form{
      margin-top:32px;
      display:grid;
      gap:18px;
    }

    .field label{
      display:block;
      margin-bottom:7px;
      font-size:11.5px;
      font-weight:850;
      color:#536177;
    }

    .input-wrap{
      height:48px;
      display:grid;
      grid-template-columns:42px minmax(0,1fr) 38px;
      align-items:center;
      border:1px solid var(--line);
      border-radius:11px;
      background:#fbfcfe;
      transition:.16s ease;
      overflow:hidden;
    }

    .input-wrap:focus-within{
      border-color:#8ca4e8;
      background:#fff;
      box-shadow:0 0 0 3px rgba(108,99,232,.08);
    }

    .field-icon{
      display:grid;
      place-items:center;
      color:#77859a;
      font-size:16px;
    }

    .input-wrap input{
      min-width:0;
      width:100%;
      height:100%;
      border:0;
      outline:0;
      background:transparent;
      color:#22304a;
      font-size:14px;
      font-weight:650;
      padding:0 7px 0 0;
    }

    .input-wrap input::placeholder{
      color:#a0a9b7;
      font-weight:500;
    }

    .toggle-password{
      width:32px;height:32px;
      display:grid;
      place-items:center;
      border:0;
      border-radius:8px;
      background:transparent;
      color:#8792a3;
      cursor:pointer;
      font-size:12px;
    }

    .toggle-password:hover{background:#f0f3f8;color:#4e5d73}

    .login-btn{
      height:50px;
      border:0;
      border-radius:11px;
      color:#fff;
      background:linear-gradient(135deg,#7568ee 0%,#5e63df 55%,#4e84e8 100%);
      font-size:14px;
      font-weight:900;
      letter-spacing:.2px;
      cursor:pointer;
      box-shadow:0 10px 22px rgba(93,99,223,.24);
      transition:.16s ease;
    }

    .login-btn:hover{transform:translateY(-1px);box-shadow:0 13px 26px rgba(93,99,223,.29)}
    .login-btn:disabled{opacity:.58;cursor:not-allowed;transform:none;box-shadow:none}

    .message{
      min-height:36px;
      padding:0 11px;
      display:flex;
      align-items:center;
      border-radius:8px;
      font-size:11.5px;
      font-weight:750;
      visibility:hidden;
    }

    .message.show{visibility:visible}
    .message.error{background:#fff1f1;color:var(--danger);border:1px solid #f2caca}
    .message.success{background:#edf9f2;color:var(--success);border:1px solid #c9ead6}

    .login-foot{
      margin-top:16px;
      padding-top:15px;
      border-top:1px solid #edf0f4;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      color:#8c96a6;
      font-size:10.5px;
    }

    .login-foot b{
      color:#66758c;
      font-weight:800;
    }

    .loading-dot{
      display:none;
      width:14px;height:14px;
      margin-right:7px;
      border:2px solid rgba(255,255,255,.45);
      border-top-color:#fff;
      border-radius:50%;
      animation:spin .75s linear infinite;
      vertical-align:-2px;
    }

    .login-btn.loading .loading-dot{display:inline-block}

    @keyframes spin{to{transform:rotate(360deg)}}

    @media(max-height:700px){
      .login-shell{height:520px}
      .visual-copy{margin-top:60px}
      .form-panel{padding-top:38px;padding-bottom:34px}
      .flow-box{bottom:28px}
    }
  </style>
</head>
<body>
  <main class="login-page">
    <section class="login-shell" aria-label="로그인">
      <div class="visual-panel">
        <div class="brand-badge"><i></i> Sina Counseling & Career</div>

        <div class="visual-copy">
          <h1>
            마음:시나브로
            <span>심리상담연구소 관제센타</span>
          </h1>
          <p>
            상담 · 구직 · 기업 · 매칭 업무를 하나의 화면에서 관리합니다.
            등록된 직원만 로그인할 수 있습니다.
          </p>
        </div>

        <div class="flow-box" aria-hidden="true">
          <div><strong>상담</strong><small>Counseling</small></div>
          <div><strong>구직</strong><small>Career</small></div>
          <div><strong>매칭</strong><small>Matching</small></div>
          <div><strong>관리</strong><small>Control</small></div>
        </div>
      </div>

      <div class="form-panel">
        <div class="form-title">
          <small>CONTROL CENTER LOGIN</small>
          <h2>로그인</h2>
          <p>등록된 이메일 주소와 비밀번호를 입력해 주세요.</p>
        </div>

        <form class="login-form" id="loginForm" autocomplete="on">
          <div class="field">
            <label for="email">이메일 주소</label>
            <div class="input-wrap">
              <span class="field-icon">✉</span>
              <input
                id="email"
                name="email"
                type="email"
                autocomplete="username"
                placeholder="example@gmail.com"
                required
              />
              <span></span>
            </div>
          </div>

          <div class="field">
            <label for="password">비밀번호</label>
            <div class="input-wrap">
              <span class="field-icon">●</span>
              <input
                id="password"
                name="password"
                type="password"
                autocomplete="current-password"
                placeholder="비밀번호 입력"
                required
              />
              <button class="toggle-password" id="togglePassword" type="button" title="비밀번호 표시">보기</button>
            </div>
          </div>

          <div class="message" id="message" role="alert"></div>

          <button class="login-btn" id="loginBtn" type="submit">
            <span class="loading-dot"></span>
            <span id="loginBtnText">LOG IN</span>
          </button>
        </form>

        <div class="login-foot">
          <span>Database <b>Sina_counseling_career</b></span>
          <span>Authorized Users Only</span>
        </div>
      </div>
    </section>
  </main>

<script>
  const SUPABASE_URL = "https://fafdxaifluftnertbpvr.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";

  const supabaseClient = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth: {
        persistSession: true,
        autoRefreshToken: true,
        detectSessionInUrl: true
      }
    }
  );

  const loginForm = document.getElementById("loginForm");
  const emailEl = document.getElementById("email");
  const passwordEl = document.getElementById("password");
  const loginBtn = document.getElementById("loginBtn");
  const loginBtnText = document.getElementById("loginBtnText");
  const messageEl = document.getElementById("message");
  const togglePassword = document.getElementById("togglePassword");

  function showMessage(text, type = "error") {
    messageEl.textContent = text;
    messageEl.className = `message show ${type}`;
  }

  function clearMessage() {
    messageEl.textContent = "";
    messageEl.className = "message";
  }

  function setLoading(loading) {
    loginBtn.disabled = loading;
    loginBtn.classList.toggle("loading", loading);
    loginBtnText.textContent = loading ? "로그인 확인 중..." : "LOG IN";
  }

  async function validateEmployee(user) {
    const { data: employee, error } = await supabaseClient
      .from("employee")
      .select("employee_code, position, name, email, permission, active")
      .eq("auth_user_id", user.id)
      .maybeSingle();

    if (error) {
      console.error("employee 조회 오류:", error);
      throw new Error("직원정보 확인 중 오류가 발생했습니다.");
    }

    if (!employee) {
      throw new Error("등록된 직원정보가 없습니다. 관리자에게 문의해 주세요.");
    }

    if (!employee.active) {
      throw new Error("현재 사용이 중지된 계정입니다.");
    }

    sessionStorage.setItem("sina_employee", JSON.stringify(employee));
    return employee;
  }

  async function moveToMainIfLoggedIn() {
    try {
      const { data: { user } } = await supabaseClient.auth.getUser();
      if (!user) return;

      await validateEmployee(user);
      window.location.replace("main.html");
    } catch (err) {
      await supabaseClient.auth.signOut();
      sessionStorage.removeItem("sina_employee");
    }
  }

  togglePassword.addEventListener("click", () => {
    const showing = passwordEl.type === "text";
    passwordEl.type = showing ? "password" : "text";
    togglePassword.textContent = showing ? "보기" : "숨김";
    togglePassword.title = showing ? "비밀번호 표시" : "비밀번호 숨기기";
    passwordEl.focus();
  });

  loginForm.addEventListener("submit", async (event) => {
    event.preventDefault();
    clearMessage();

    const email = emailEl.value.trim();
    const password = passwordEl.value;

    if (!email || !password) {
      showMessage("이메일 주소와 비밀번호를 입력해 주세요.");
      return;
    }

    setLoading(true);

    try {
      const { data, error } = await supabaseClient.auth.signInWithPassword({
        email,
        password
      });

      if (error || !data.user) {
        throw new Error("이메일 주소 또는 비밀번호가 올바르지 않습니다.");
      }

      const employee = await validateEmployee(data.user);

      showMessage(`${employee.name} ${employee.position}님 로그인되었습니다.`, "success");

      setTimeout(() => {
        window.location.replace("main.html");
      }, 450);

    } catch (err) {
      console.error(err);
      await supabaseClient.auth.signOut();
      sessionStorage.removeItem("sina_employee");
      showMessage(err.message || "로그인에 실패했습니다.");
    } finally {
      setLoading(false);
    }
  });

  moveToMainIfLoggedIn();
</script>
</body>
</html>
