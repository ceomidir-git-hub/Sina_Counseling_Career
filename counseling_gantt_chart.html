<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>상담칸트챠트 - 마음:시나브로심리상담연구소</title>
<style>
  :root{
    --line:#d9e0e6;
    --head:#0f3342;
    --sub:#eef4f7;
    --text:#1f2d33;
    --muted:#667780;
    --today:#d62828;
    --psych:#10a66a;
    --career:#1687d9;
    --job:#d98900;
    --done:#7b8790;
    --reserve:#8e44ad;
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    background:#f4f7f9;
    color:var(--text);
    font-family:"Malgun Gothic","맑은 고딕",Arial,sans-serif;
  }
  .page{
    width:min(1600px,100%);
    margin:0 auto;
    background:#fff;
    min-height:100vh;
  }
  .topbar{
    background:linear-gradient(90deg,#0b2c3a,#0f4557);
    color:#fff;
    padding:12px 18px;
    display:flex;
    align-items:center;
    gap:18px;
    flex-wrap:wrap;
  }
  .title{font-size:21px;font-weight:800;letter-spacing:-.5px}
  .range{margin-left:auto;font-size:13px;opacity:.95}
  .back-btn{
    height:32px;
    padding:0 12px;
    display:inline-flex;
    align-items:center;
    justify-content:center;
    border:1px solid rgba(255,255,255,.42);
    border-radius:6px;
    background:rgba(255,255,255,.10);
    color:#fff;
    text-decoration:none;
    font-size:12px;
    font-weight:800;
    white-space:nowrap;
  }
  .back-btn:hover{background:rgba(255,255,255,.18)}
  .filters{
    display:flex;
    gap:8px;
    padding:10px 14px;
    border-bottom:1px solid var(--line);
    background:#fff;
    align-items:center;
    flex-wrap:wrap;
  }
  .filters input,.filters select,.filters button{
    height:34px;
    border:1px solid #bfcbd2;
    border-radius:5px;
    background:#fff;
    padding:0 10px;
    font-family:inherit;
    font-size:13px;
  }
  .filters button{
    background:#163d4d;
    color:#fff;
    border-color:#163d4d;
    cursor:pointer;
    font-weight:700;
  }
  .filters button:disabled{opacity:.55;cursor:not-allowed}
  .db-status{
    min-width:110px;
    font-size:11px;
    font-weight:800;
    color:#50626c;
    white-space:nowrap;
  }
  .db-status.ok{color:#14734a}
  .db-status.error{color:#b42318}
  .legend{
    margin-left:auto;
    display:flex;
    gap:12px;
    align-items:center;
    font-size:12px;
    color:#42545d;
  }
  .legend span{display:inline-flex;align-items:center;gap:5px}
  .dot{width:11px;height:11px;border-radius:3px;display:inline-block}
  .summary{
    display:grid;
    grid-template-columns:repeat(5,minmax(120px,1fr));
    gap:8px;
    padding:10px 14px 0;
  }
  .card{
    border:1px solid var(--line);
    border-radius:7px;
    padding:9px 12px;
    background:#fff;
  }
  .card b{display:block;font-size:18px;margin-top:2px}
  .card small{color:var(--muted);font-size:11px}
  .gantt-wrap{
    padding:10px 14px 18px;
    overflow:auto;
  }
  .gantt{
    min-width:1380px;
    border:1px solid var(--line);
    display:grid;
    position:relative;
    background:#fff;
  }
  .cell{
    min-height:34px;
    border-right:1px solid var(--line);
    border-bottom:1px solid var(--line);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:4px 5px;
    font-size:11px;
    position:relative;
    background:#fff;
    z-index:1;
  }
  .head{
    background:var(--head);
    color:#fff;
    font-weight:700;
    min-height:42px;
    position:sticky;
    top:0;
    z-index:10;
  }
  .name{font-weight:700}
  .left{text-align:left;justify-content:flex-start}
  .muted{color:var(--muted)}
  .status{
    font-size:10px;
    padding:3px 6px;
    border-radius:9px;
    background:#edf2f5;
  }
  .dayhead{padding:0;font-size:10px}
  .sat{background:#eaf4ff;color:#1261a0}
  .sun{background:#fff0f0;color:#bd1f1f}
  .weekend-cell{background:#fafcfd}
  .today-col::after{
    content:"";
    position:absolute;
    top:0;
    bottom:0;
    width:2px;
    left:50%;
    background:rgba(214,40,40,.7);
    pointer-events:none;
    z-index:4;
  }
  .bar{
    position:absolute;
    height:16px;
    border-radius:8px;
    top:50%;
    transform:translateY(-50%);
    z-index:6;
    box-shadow:0 1px 2px rgba(0,0,0,.15);
  }
  .psych{background:var(--psych)}
  .career{background:var(--career)}
  .job{background:var(--job)}
  .done{background:var(--done)}
  .reserve-marker{
    width:10px;height:10px;
    background:var(--reserve);
    transform:rotate(45deg);
    position:absolute;
    top:50%;left:50%;
    margin:-5px 0 0 -5px;
    z-index:7;
    border:1px solid #fff;
  }
  .session-marker{
    width:8px;height:8px;
    border-radius:50%;
    background:#fff;
    border:2px solid #22333a;
    position:absolute;
    top:50%;left:50%;
    margin:-4px 0 0 -4px;
    z-index:8;
  }
  .empty{
    grid-column:1/-1;
    min-height:110px;
    display:grid;
    place-items:center;
    color:#71808a;
    font-size:13px;
    background:#fbfcfd;
  }
  .footnote{
    padding:0 14px 18px;
    color:#61727a;
    font-size:11px;
    line-height:1.65;
  }
  @media (max-width:900px){
    .summary{grid-template-columns:repeat(2,1fr)}
    .range{margin-left:0;width:100%}
    .legend{margin-left:0;width:100%;overflow-x:auto}
  }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.95.0"></script>
</head>
<body>
<div class="page">
  <div class="topbar">
    <div class="title">상담칸트챠트</div>
    <div>심리상담 · 진로상담 · 취업상담 통합 일정</div>
    <div class="range" id="rangeLabel">조회기간 확인 중</div>
    <a class="back-btn" href="index.html" title="대시보드로 돌아가기">이전화면</a>
  </div>

  <div class="filters">
    <select id="typeFilter">
      <option value="all">전체 상담</option>
      <option value="심리">심리상담</option>
      <option value="진로">진로상담</option>
      <option value="취업">취업상담</option>
    </select>
    <input id="keyword" type="text" placeholder="회원KEY 또는 이름">
    <select id="statusFilter">
      <option value="all">전체 상태</option>
      <option value="진행">진행</option>
      <option value="예정">예정</option>
      <option value="보류">보류</option>
      <option value="종결">종결</option>
    </select>
    <button id="searchBtn" type="button">조회</button>
    <button id="resetBtn" type="button">초기화</button>
    <span class="db-status" id="dbStatus">DB 연결 중...</span>

    <div class="legend">
      <span><i class="dot" style="background:var(--psych)"></i>심리</span>
      <span><i class="dot" style="background:var(--career)"></i>진로</span>
      <span><i class="dot" style="background:var(--job)"></i>취업</span>
      <span><i class="dot" style="background:var(--reserve)"></i>차기예약</span>
      <span><i class="dot" style="background:var(--done)"></i>종결</span>
    </div>
  </div>

  <div class="summary" id="summary"></div>

  <div class="gantt-wrap">
    <div class="gantt" id="gantt"></div>
  </div>

  <div class="footnote">
    DB 연결 기준: DB_basic 회원 KEY + DB_psychological_counseling + DB_career_counseling 실제값을 사용합니다.
    막대는 해당 월에 확인되는 최초 일정부터 최종 일정까지의 범위, ○는 실제 상담일, ◆는 차기예약일입니다.
    담당상담사는 현재 상담 DB에 연결 컬럼이 없어 임의값을 생성하지 않고 “-”로 표시합니다.
  </div>
</div>

<script>
(() => {
  "use strict";

  const SUPABASE_URL = "https://fafdxaifluftnertbpvr.supabase.co";
  const SUPABASE_PUBLISHABLE_KEY = "sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db";
  const SECURE_SCHEDULE_URL = `${SUPABASE_URL}/functions/v1/secure-schedule-read`;

  if (!window.supabase) {
    alert("Supabase 라이브러리를 불러오지 못했습니다.");
    return;
  }

  const db = window.supabase.createClient(
    SUPABASE_URL,
    SUPABASE_PUBLISHABLE_KEY,
    {
      auth:{
        storage:window.sessionStorage,
        persistSession:true,
        autoRefreshToken:true,
        detectSessionInUrl:true
      }
    }
  );

  const els = {
    typeFilter:document.getElementById("typeFilter"),
    statusFilter:document.getElementById("statusFilter"),
    keyword:document.getElementById("keyword"),
    searchBtn:document.getElementById("searchBtn"),
    resetBtn:document.getElementById("resetBtn"),
    dbStatus:document.getElementById("dbStatus"),
    summary:document.getElementById("summary"),
    gantt:document.getElementById("gantt"),
    rangeLabel:document.getElementById("rangeLabel")
  };

  let rows = [];
  let displayYear = 0;
  let displayMonth = 0;
  let days = 30;
  let today = null;

  function getSeoulTodayParts(){
    const parts = new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",
      year:"numeric",
      month:"2-digit",
      day:"2-digit"
    }).formatToParts(new Date());
    const map = {};
    parts.forEach(p => { if(p.type !== "literal") map[p.type] = p.value; });
    return {year:Number(map.year),month:Number(map.month),day:Number(map.day)};
  }

  function daysInMonth(year,month){
    return new Date(Date.UTC(year,month,0)).getUTCDate();
  }

  function two(n){ return String(n).padStart(2,"0"); }

  function dateOnly(value){
    if(!value) return null;
    const s=String(value);
    const m=s.match(/^(\d{4})-(\d{2})-(\d{2})/);
    if(m) return {year:Number(m[1]),month:Number(m[2]),day:Number(m[3]),text:`${m[1]}-${m[2]}-${m[3]}`};
    const d=new Date(value);
    if(Number.isNaN(d.getTime())) return null;
    const parts=new Intl.DateTimeFormat("en-CA",{
      timeZone:"Asia/Seoul",year:"numeric",month:"2-digit",day:"2-digit"
    }).formatToParts(d);
    const map={};
    parts.forEach(p=>{if(p.type!=="literal")map[p.type]=p.value;});
    return {
      year:Number(map.year),
      month:Number(map.month),
      day:Number(map.day),
      text:`${map.year}-${map.month}-${map.day}`
    };
  }

  function timeValue(value){
    if(!value) return Number.NEGATIVE_INFINITY;
    const d=new Date(value);
    const t=d.getTime();
    return Number.isFinite(t)?t:Number.NEGATIVE_INFINITY;
  }

  function monthStartValue(){
    return Date.parse(`${displayYear}-${two(displayMonth)}-01T00:00:00+09:00`);
  }

  function nextMonthStartValue(){
    let y=displayYear,m=displayMonth+1;
    if(m===13){y+=1;m=1;}
    return Date.parse(`${y}-${two(m)}-01T00:00:00+09:00`);
  }

  function clampToMonthDay(value){
    if(!value) return null;
    const d=dateOnly(value);
    if(!d) return null;
    if(d.year < displayYear || (d.year===displayYear && d.month<displayMonth)) return 1;
    if(d.year > displayYear || (d.year===displayYear && d.month>displayMonth)) return days;
    return Math.min(days,Math.max(1,d.day));
  }

  function dayIfInMonth(value){
    const d=dateOnly(value);
    if(!d || d.year!==displayYear || d.month!==displayMonth) return null;
    return d.day;
  }

  function mmdd(value){
    const d=dateOnly(value);
    return d ? `${two(d.month)}/${two(d.day)}` : "-";
  }

  function uniqueSortedNumbers(values){
    return [...new Set(values.filter(v=>Number.isInteger(v)))].sort((a,b)=>a-b);
  }

  function dayOfWeek(day){
    return new Date(Date.UTC(displayYear,displayMonth-1,day)).getUTCDay();
  }

  function typeClass(type,status){
    if(status==="종결" || status==="완료" || status==="종료") return "done";
    if(type==="심리") return "psych";
    if(type==="취업") return "job";
    return "career";
  }

  function normalizeStatus(value){
    const s=String(value||"").trim();
    if(["종결","완료","종료"].includes(s)) return "종결";
    if(["보류","중지"].includes(s)) return "보류";
    if(["예정","예약"].includes(s)) return "예정";
    if(["진행","진행중"].includes(s)) return "진행";
    return s || "진행";
  }

  function filteredRows(){
    const tf=els.typeFilter.value;
    const sf=els.statusFilter.value;
    const kw=els.keyword.value.trim().toLowerCase();
    return rows.filter(r =>
      (tf==="all" || r.type===tf) &&
      (sf==="all" || r.status===sf) &&
      (!kw || r.key.toLowerCase().includes(kw) || r.name.toLowerCase().includes(kw))
    );
  }

  function renderSummary(data){
    const total=data.length;
    const psych=data.filter(x=>x.type==="심리").length;
    const career=data.filter(x=>x.type==="진로").length;
    const job=data.filter(x=>x.type==="취업").length;
    const todayCount=today
      ? data.filter(x=>x.sessions.includes(today) || x.reserves.includes(today)).length
      : 0;
    const items=[
      ["조회대상", total+"명"],
      ["심리상담", psych+"명"],
      ["진로상담", career+"명"],
      ["취업상담", job+"명"],
      ["오늘 일정", todayCount+"건"]
    ];
    els.summary.innerHTML=items.map(([a,b])=>`<div class="card"><small>${a}</small><b>${b}</b></div>`).join("");
  }

  function render(){
    const data=filteredRows();
    renderSummary(data);

    els.gantt.innerHTML="";
    els.gantt.style.gridTemplateColumns=`78px 86px 86px 92px 86px 88px 94px repeat(${days},28px)`;
    els.gantt.style.minWidth=`${624 + days*28}px`;

    const heads=["회원KEY","이름","상담구분","담당상담사","상태","최근상담일","차기예약일"];
    heads.forEach(h=>{
      const c=document.createElement("div");
      c.className="cell head";
      c.textContent=h;
      els.gantt.appendChild(c);
    });

    for(let d=1;d<=days;d++){
      const dow=dayOfWeek(d);
      const c=document.createElement("div");
      c.className="cell head dayhead "+(dow===0?"sun":dow===6?"sat":"");
      c.textContent=d;
      els.gantt.appendChild(c);
    }

    if(!data.length){
      const empty=document.createElement("div");
      empty.className="empty";
      empty.textContent="조회 조건에 해당하는 상담 일정이 없습니다.";
      els.gantt.appendChild(empty);
      return;
    }

    data.forEach(r=>{
      const vals=[
        [r.key,"muted"],
        [r.name,"name left"],
        [r.type+"상담",""],
        [r.counselor,""],
        [r.status,""],
        [r.recent,""],
        [r.next,""]
      ];

      vals.forEach(([v,cls],i)=>{
        const c=document.createElement("div");
        c.className="cell "+cls;
        if(i===4) c.innerHTML=`<span class="status">${escapeHtml(v)}</span>`;
        else c.textContent=v;
        els.gantt.appendChild(c);
      });

      for(let d=1;d<=days;d++){
        const dow=dayOfWeek(d);
        const c=document.createElement("div");
        c.className="cell "+((dow===0||dow===6)?"weekend-cell ":"")+(d===today?"today-col":"");

        if(d===r.start){
          const bar=document.createElement("div");
          bar.className="bar "+typeClass(r.type,r.status);
          const width=Math.max(24,(r.end-r.start+1)*28-4);
          bar.style.left="2px";
          bar.style.width=width+"px";
          c.appendChild(bar);
        }

        if(r.sessions.includes(d)){
          const m=document.createElement("div");
          m.className="session-marker";
          m.title="실제 상담";
          c.appendChild(m);
        }

        if(r.reserves.includes(d)){
          const m=document.createElement("div");
          m.className="reserve-marker";
          m.title="차기예약";
          c.appendChild(m);
        }

        els.gantt.appendChild(c);
      }
    });
  }

  function escapeHtml(value){
    return String(value??"").replace(/[&<>"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[ch]));
  }

  function rowEventTime(row,type){
    const values = type==="심리"
      ? [row.session_start_at,row.visit_at,row.receipt_at,row.next_session_at,row.next_session_date]
      : [row.session_start_at,row.appointment_at,row.receipt_at,row.next_session_at,row.next_session_date];
    return Math.max(...values.map(timeValue));
  }

  function actualSessionValue(row,type){
    if(row.session_start_at) return row.session_start_at;
    const n=Number(row.session_no);
    if(Number.isFinite(n) && n>0){
      return type==="심리" ? row.visit_at : row.appointment_at;
    }
    return null;
  }

  function classifyCareer(row,meta){
    if(meta?.linked_recruitment_id || meta?.linked_job_hunting_id) return "취업";
    return "진로";
  }

  function buildRows(scheduleData,memberKeyMap,careerMetaMap){
    const groups=new Map();

    function push(type,row){
      const meta=type==="진로" ? careerMetaMap.get(row.id) : null;
      const finalType=type==="진로" ? classifyCareer(row,meta) : "심리";
      const clientId=String(row.client_id||row.basic?.id||"");
      if(!clientId) return;

      const groupKey=`${finalType}|${clientId}`;
      if(!groups.has(groupKey)){
        groups.set(groupKey,{
          type:finalType,
          clientId,
          name:String(row.basic?.client_name||"-"),
          key:String(memberKeyMap.get(clientId)||"-"),
          items:[]
        });
      }
      groups.get(groupKey).items.push(row);
    }

    (scheduleData?.psych||[]).forEach(row=>push("심리",row));
    (scheduleData?.career||[]).forEach(row=>push("진로",row));

    const result=[];

    groups.forEach(group=>{
      const items=group.items;
      const allDates=[];
      const sessions=[];
      const reserves=[];

      items.forEach(r=>{
        const type=group.type==="심리"?"심리":"진로";
        const actual=actualSessionValue(r,type);
        const reserve=r.next_session_at||r.next_session_date||null;
        const primary=type==="심리" ? r.visit_at : r.appointment_at;

        [r.receipt_at,primary,r.session_start_at,r.session_end_at,reserve]
          .filter(Boolean).forEach(v=>allDates.push(v));

        const sessionDay=dayIfInMonth(actual);
        if(sessionDay) sessions.push(sessionDay);

        const reserveDay=dayIfInMonth(reserve);
        if(reserveDay) reserves.push(reserveDay);
      });

      if(!allDates.length) return;

      const startRaw=allDates.reduce((a,b)=>timeValue(a)<=timeValue(b)?a:b);
      const endRaw=allDates.reduce((a,b)=>timeValue(a)>=timeValue(b)?a:b);
      const start=clampToMonthDay(startRaw);
      const end=clampToMonthDay(endRaw);

      const actualDates=items
        .map(r=>actualSessionValue(r,group.type==="심리"?"심리":"진로"))
        .filter(Boolean)
        .sort((a,b)=>timeValue(a)-timeValue(b));

      const reserveDates=items
        .map(r=>r.next_session_at||r.next_session_date||null)
        .filter(Boolean)
        .sort((a,b)=>timeValue(a)-timeValue(b));

      const latestItem=[...items].sort((a,b)=>{
        return rowEventTime(b,group.type==="심리"?"심리":"진로")-
               rowEventTime(a,group.type==="심리"?"심리":"진로");
      })[0];

      result.push({
        key:group.key,
        name:group.name,
        type:group.type,
        counselor:"-",
        status:normalizeStatus(latestItem?.session_status),
        recent:actualDates.length?mmdd(actualDates[actualDates.length-1]):"-",
        next:reserveDates.length?mmdd(reserveDates[reserveDates.length-1]):"-",
        start:Math.min(start||1,end||days),
        end:Math.max(start||1,end||days),
        sessions:uniqueSortedNumbers(sessions),
        reserves:uniqueSortedNumbers(reserves)
      });
    });

    result.sort((a,b)=>{
      if(a.start!==b.start) return a.start-b.start;
      return a.key.localeCompare(b.key,"ko");
    });

    return result;
  }

  async function loadMemberKeys(clientIds){
    const ids=[...new Set(clientIds.filter(Boolean))];
    const map=new Map();
    if(!ids.length) return map;

    const chunkSize=100;
    for(let i=0;i<ids.length;i+=chunkSize){
      const chunk=ids.slice(i,i+chunkSize);
      const {data,error}=await db
        .from("DB_basic")
        .select("id,member_key")
        .in("id",chunk);
      if(error) throw error;
      (data||[]).forEach(r=>map.set(String(r.id),r.member_key||"-"));
    }
    return map;
  }

  async function loadCareerMeta(careerIds){
    const ids=[...new Set(careerIds.filter(Boolean))];
    const map=new Map();
    if(!ids.length) return map;

    const chunkSize=100;
    for(let i=0;i<ids.length;i+=chunkSize){
      const chunk=ids.slice(i,i+chunkSize);
      const {data,error}=await db
        .from("DB_career_counseling")
        .select("id,topic_code,linked_recruitment_id,linked_job_hunting_id")
        .in("id",chunk);
      if(error) throw error;
      (data||[]).forEach(r=>map.set(String(r.id),r));
    }
    return map;
  }

  async function loadScheduleSecure(session){
    const response=await fetch(SECURE_SCHEDULE_URL,{
      method:"POST",
      headers:{
        "Content-Type":"application/json",
        "apikey":SUPABASE_PUBLISHABLE_KEY,
        "Authorization":`Bearer ${session.access_token}`
      },
      body:JSON.stringify({year:displayYear,month:displayMonth}),
      cache:"no-store"
    });

    const result=await response.json().catch(()=>({}));
    if(!response.ok || !result?.ok){
      throw new Error(result?.error||`상담 일정 조회 실패 (${response.status})`);
    }
    return result.data||{psych:[],career:[]};
  }

  async function loadDb(){
    els.searchBtn.disabled=true;
    els.resetBtn.disabled=true;
    els.dbStatus.className="db-status";
    els.dbStatus.textContent="DB 연결 중...";

    try{
      const {data:{session},error:sessionError}=await db.auth.getSession();
      if(sessionError) throw sessionError;

      if(!session?.user){
        alert("로그인 세션이 없습니다. 대시보드에서 로그인 후 다시 이용해 주세요.");
        location.href="index.html";
        return;
      }

      const scheduleData=await loadScheduleSecure(session);

      const clientIds=[
        ...(scheduleData.psych||[]).map(r=>r.client_id),
        ...(scheduleData.career||[]).map(r=>r.client_id)
      ];
      const careerIds=(scheduleData.career||[]).map(r=>r.id);

      const [memberKeyMap,careerMetaMap]=await Promise.all([
        loadMemberKeys(clientIds),
        loadCareerMeta(careerIds)
      ]);

      rows=buildRows(scheduleData,memberKeyMap,careerMetaMap);
      els.dbStatus.className="db-status ok";
      els.dbStatus.textContent=`DB 연결 완료 · ${rows.length}명`;
      render();

    }catch(err){
      console.error("상담칸트챠트 DB 조회 오류:",err);
      rows=[];
      els.dbStatus.className="db-status error";
      els.dbStatus.textContent="DB 조회 오류";
      render();
      alert(err?.message||"상담 일정 DB 조회 중 오류가 발생했습니다.");
    }finally{
      els.searchBtn.disabled=false;
      els.resetBtn.disabled=false;
    }
  }

  function resetFilters(){
    els.typeFilter.value="all";
    els.statusFilter.value="all";
    els.keyword.value="";
    render();
  }

  function initDate(){
    const now=getSeoulTodayParts();
    displayYear=now.year;
    displayMonth=now.month;
    days=daysInMonth(displayYear,displayMonth);
    today=now.day;
    els.rangeLabel.textContent=
      `${displayYear}년 ${displayMonth}월 1일 ~ ${displayMonth}월 ${days}일`;
  }

  els.searchBtn.addEventListener("click",render);
  els.resetBtn.addEventListener("click",resetFilters);
  els.keyword.addEventListener("keydown",e=>{
    if(e.key==="Enter") render();
  });

  initDate();
  renderSummary([]);
  loadDb();
})();
</script>
</body>
</html>
