<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>접수 상담 등록</title>
  <style>
    :root {
      --blue: #0b63e5;
      --blue-dark: #0b2a66;
      --bg: #f7f9fc;
      --card: #ffffff;
      --text: #111827;
      --muted: #718096;
      --line: #dbe3ee;
      --line-soft: #edf1f7;
      --shadow: 0 12px 32px rgba(15, 23, 42, 0.08);
      --radius: 18px;
      --field-height: 46px;
      --label-width: 136px;
      --green: #16a34a;
      --red: #dc2626;
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      min-height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: linear-gradient(135deg, #eaf3ff, #ffffff);
      color: var(--text);
    }

    button, input, select, textarea { font: inherit; }

    .page {
      min-height: 100vh;
      padding: 20px;
      display: flex;
      justify-content: center;
      align-items: flex-start;
    }

    .phone {
      width: min(430px, 100%);
      min-height: 860px;
      background: #101010;
      border-radius: 42px;
      padding: 12px;
      box-shadow: 0 22px 60px rgba(15, 23, 42, 0.35);
    }

    .screen {
      min-height: 836px;
      background: #ffffff;
      border-radius: 32px;
      overflow: hidden;
      position: relative;
    }

    .status {
      height: 58px;
      padding: 16px 24px 0;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      font-weight: 800;
      color: #111827;
      position: relative;
    }

    .status::after {
      content: "";
      position: absolute;
      left: 50%;
      top: 14px;
      transform: translateX(-50%);
      width: 104px;
      height: 31px;
      background: #050505;
      border-radius: 999px;
    }

    .status span { position: relative; z-index: 1; font-size: 13px; }

    .container { padding: 18px 18px 24px; }

    .page-title {
      margin: 0 0 18px;
      color: var(--blue-dark);
      font-size: 30px;
      line-height: 1.15;
      font-weight: 950;
      letter-spacing: -1.2px;
    }

    .section {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 16px 14px;
      margin-bottom: 12px;
      box-shadow: 0 8px 22px rgba(15, 23, 42, 0.035);
    }

    .section-title {
      margin: 0 0 16px;
      color: var(--blue);
      font-size: 17px;
      font-weight: 950;
      letter-spacing: -0.4px;
    }

    .form-grid { display: grid; gap: 10px; }

    .form-row {
      display: grid;
      grid-template-columns: 96px 1fr;
      gap: 10px;
      align-items: center;
    }

    .datetime-controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    label {
      font-size: 14px;
      font-weight: 850;
      color: #111827;
      letter-spacing: -0.3px;
    }

    .field, select, textarea {
      width: 100%;
      border: 1px solid var(--line);
      border-radius: 9px;
      background: #fff;
      color: #111827;
      outline: none;
      transition: border 0.15s ease, box-shadow 0.15s ease;
    }

    .field, select {
      height: var(--field-height);
      padding: 0 12px;
      font-size: 14px;
      min-width: 0;
    }

    .field[readonly] {
      background: #f1f5f9;
      color: #64748b;
    }

    select {
      appearance: none;
      background-image: linear-gradient(45deg, transparent 50%, #475569 50%),
        linear-gradient(135deg, #475569 50%, transparent 50%);
      background-position: calc(100% - 18px) 19px, calc(100% - 13px) 19px;
      background-size: 5px 5px, 5px 5px;
      background-repeat: no-repeat;
      padding-right: 28px;
    }

    textarea {
      min-height: 116px;
      resize: vertical;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
    }

    .field:focus, select:focus, textarea:focus {
      border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(11, 99, 229, 0.12);
    }

    .field::placeholder, textarea::placeholder { color: #94a3b8; }

    .hint {
      grid-column: 2 / -1;
      font-size: 11px;
      color: var(--muted);
      margin-top: -4px;
    }

    .preview-badge {
      display: inline-block;
      font-size: 12px;
      font-weight: 850;
      color: var(--blue);
      background: #eef4ff;
      border: 1px solid #d7e6ff;
      border-radius: 8px;
      padding: 5px 10px;
    }

    .preview-row { margin-top: -2px; }

    .textarea-wrap { position: relative; }

    .counter {
      position: absolute;
      right: 12px;
      bottom: 10px;
      color: #64748b;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255, 255, 255, 0.88);
      padding-left: 8px;
    }

    .actions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 8px;
      margin-top: 18px;
      padding-bottom: 6px;
    }

    .btn {
      height: 48px;
      border-radius: 10px;
      border: 1px solid #b7c3d3;
      background: #fff;
      color: #475569;
      font-weight: 950;
      font-size: 13px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 5px;
      text-decoration: none;
      letter-spacing: -0.5px;
      white-space: nowrap;
    }

    .btn.primary {
      background: linear-gradient(135deg, #0b63e5, #1d74f5);
      color: #fff;
      border-color: #0b63e5;
      box-shadow: 0 8px 18px rgba(11, 99, 229, 0.25);
    }

    .btn.primary:disabled {
      opacity: .6;
      cursor: not-allowed;
    }

    .btn:active { transform: translateY(1px); }

    .statusMsg {
      display: none;
      border-radius: 12px;
      padding: 10px 12px;
      font-size: 13px;
      font-weight: 850;
      margin-bottom: 12px;
    }

    .statusMsg.show { display: block; }

    .statusMsg.success {
      background: #ecfdf3;
      border: 1px solid #bbf7d0;
      color: var(--green);
    }

    .statusMsg.error {
      background: #fef2f2;
      border: 1px solid #fecaca;
      color: var(--red);
    }

    .field.invalid, select.invalid {
      border-color: var(--red);
      box-shadow: 0 0 0 3px rgba(220, 38, 38, 0.10);
    }

    /* ===== 조회 시 후보(동명이인 연락처 / 여러 접수건) 선택 리스트 ===== */
    .lookup-item {
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 12px;
      margin-bottom: 8px;
      cursor: pointer;
      transition: border-color 0.15s ease, box-shadow 0.15s ease, background 0.15s ease;
      background: #fff;
    }

    .lookup-item:hover, .lookup-item:active {
      border-color: var(--blue);
      background: #f7fbff;
      box-shadow: 0 4px 12px rgba(11, 99, 229, 0.12);
    }

    .lookup-item-date {
      font-weight: 850;
      color: var(--blue-dark);
      font-size: 13px;
      margin-bottom: 4px;
    }

    .lookup-item-sub {
      font-size: 12px;
      color: var(--muted);
    }

    .lookup-result-count {
      font-size: 12px;
      color: var(--muted);
      font-weight: 800;
      margin-bottom: 8px;
    }

    /* 조회 결과를 불러와 수정 중인 상태임을 알려주는 배지 */
    .edit-mode-badge {
      display: none;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      font-weight: 850;
      color: #92400e;
      background: #fffbeb;
      border: 1px solid #fde68a;
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 12px;
    }
    .edit-mode-badge.show { display: flex; }


    /* ===== 접수 정보 전용 배치 =====
       1행: 접수자명 / 접수자 연락처 / 내담자와의 관계
       2행: 접수날짜 / 시간 / 방문날짜 / 시간
       전체 프레임 크기는 기존 값을 그대로 유지한다.
    */
    .receipt-info-grid {
      display: grid;
      gap: 10px;
      align-items: end;
    }

    .receipt-info-grid.row-3 {
      grid-template-columns: 1fr 1.25fr 1fr;
    }

    .receipt-info-grid.row-4 {
      grid-template-columns: 1.15fr 0.85fr 1.15fr 0.85fr;
    }

    .receipt-field {
      min-width: 0;
    }

    .receipt-field label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 850;
      color: #111827;
      letter-spacing: -0.35px;
      white-space: nowrap;
    }

    .receipt-field .field,
    .receipt-field select {
      width: 100%;
      min-width: 0;
      height: var(--field-height);
    }

    .receipt-row + .receipt-row {
      margin-top: 12px;
    }

    .receipt-preview-hidden {
      display: none !important;
    }

    /* ===== 내담자 정보 전용 배치 =====
       1행: 내담자명 / 연락처 / 국적 / 외국인번호 / 비자
       2행: 성별 / 생년월일 / 직업
    */
    .client-info-grid {
      display: grid;
      gap: 10px;
      align-items: end;
    }

    .client-info-grid.row-5 {
      grid-template-columns: 1.05fr 1.25fr 0.85fr 1.15fr 0.85fr;
    }

    .client-info-grid.row-3 {
      grid-template-columns: 0.85fr 1fr 1.15fr;
    }

    .client-field {
      min-width: 0;
    }

    .client-field label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      line-height: 1.2;
      font-weight: 850;
      color: #111827;
      letter-spacing: -0.35px;
      white-space: nowrap;
    }

    .client-field .field,
    .client-field select {
      width: 100%;
      min-width: 0;
      height: var(--field-height);
    }

    .client-row + .client-row {
      margin-top: 12px;
    }

    @media (max-width: 699px) {
      .receipt-info-grid.row-3,
      .receipt-info-grid.row-4,
      .client-info-grid.row-5,
      .client-info-grid.row-3 {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 360px) {
      .receipt-info-grid.row-3,
      .receipt-info-grid.row-4,
      .client-info-grid.row-5,
      .client-info-grid.row-3 {
        grid-template-columns: 1fr;
      }
    }


    /* ===== 상단 제목 + 상담구분 라디오 ===== */
    .title-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      margin-bottom: 18px;
    }

    .title-row .page-title {
      margin: 0;
      flex: 0 0 auto;
    }

    .consult-type-group {
      margin-left: auto;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 16px;
      white-space: nowrap;
    }

    .consult-type-option {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 900;
      color: #1f2937;
    }

    .consult-type-option input[type="radio"] {
      width: 17px;
      height: 17px;
      margin: 0;
      accent-color: var(--blue);
      cursor: pointer;
    }

    /* ===== 내담자 정보 : 7개 항목 한 행 ===== */
    .client-section-head {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 12px;
    }

    .client-section-head .section-title {
      margin: 0;
    }

    .foreign-btn {
      height: 36px;
      padding: 0 14px;
      border: 1px solid #0b63e5;
      border-radius: 9px;
      background: #eef4ff;
      color: #0b63e5;
      font-size: 13px;
      font-weight: 950;
      cursor: pointer;
      white-space: nowrap;
    }

    .foreign-btn:hover {
      background: #e2edff;
    }

    .client-info-grid.single-row-6 {
      grid-template-columns:
        0.95fr
        1.15fr
        0.68fr
        0.95fr
        0.64fr
        1.00fr;
      gap: 8px;
    }

    .client-info-grid.address-row {
      grid-template-columns: minmax(0, 1fr);
      margin-top: 10px;
    }

    .client-info-grid.single-row-6 .client-field label,
    .client-info-grid.address-row .client-field label {
      font-size: 12px;
      margin-bottom: 5px;
    }

    .client-info-grid.single-row-6 .field,
    .client-info-grid.single-row-6 select,
    .client-info-grid.address-row .field {
      height: 42px;
      padding-left: 9px;
      padding-right: 9px;
      font-size: 12px;
    }

    .age-field {
      background: #f1f5f9 !important;
      color: #475569 !important;
      text-align: center;
      font-weight: 850;
    }

    /* ===== 외국인 정보 팝업 ===== */
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.48);
      display: none;
      align-items: center;
      justify-content: center;
      padding: 20px;
      z-index: 9999;
    }

    .modal-backdrop.show {
      display: flex;
    }

    .foreign-modal {
      width: min(760px, 96vw);
      background: #fff;
      border-radius: 16px;
      box-shadow: 0 24px 70px rgba(15, 23, 42, 0.28);
      overflow: hidden;
      border: 1px solid #dbe3ee;
    }

    .foreign-modal-head {
      height: 58px;
      padding: 0 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #e5e7eb;
      background: #f8fbff;
    }

    .foreign-modal-title {
      margin: 0;
      color: var(--blue-dark);
      font-size: 18px;
      font-weight: 950;
    }

    .modal-x {
      width: 34px;
      height: 34px;
      border: 0;
      border-radius: 8px;
      background: transparent;
      color: #475569;
      font-size: 24px;
      line-height: 1;
      cursor: pointer;
    }

    .modal-x:hover {
      background: #eef2f7;
    }

    .foreign-modal-body {
      padding: 20px;
    }

    .foreign-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 14px;
    }

    .foreign-field {
      min-width: 0;
    }

    .foreign-field label {
      display: block;
      margin: 0 0 6px;
      font-size: 13px;
      font-weight: 900;
      color: #111827;
    }

    .foreign-field .field,
    .foreign-field select {
      height: 44px;
      font-size: 13px;
    }

    .foreign-modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 8px;
      padding: 0 20px 20px;
    }

    .modal-btn {
      min-width: 92px;
      height: 42px;
      border-radius: 9px;
      border: 1px solid #b7c3d3;
      background: #fff;
      color: #475569;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
    }

    .modal-btn.primary {
      border-color: var(--blue);
      background: var(--blue);
      color: #fff;
    }

    @media (max-width: 699px) {
      .title-row {
        align-items: flex-start;
        flex-direction: column;
        gap: 10px;
      }

      .consult-type-group {
        margin-left: 0;
        justify-content: flex-start;
      }

      .client-info-grid.single-row-6,
      .client-info-grid.address-row {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }

      .foreign-grid {
        grid-template-columns: repeat(2, minmax(0, 1fr));
      }
    }

    @media (max-width: 360px) {
      .client-info-grid.single-row-6,
      .client-info-grid.address-row,
      .foreign-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 480px) {
      .page { padding: 0; background: #fff; }
      .phone { width: 100%; min-height: 100vh; padding: 0; border-radius: 0; background: #fff; box-shadow: none; }
      .screen { min-height: 100vh; border-radius: 0; }
      .container { padding: 14px 14px 22px; }
      .page-title { font-size: 28px; margin-bottom: 16px; }
      .section { padding: 15px 12px; border-radius: 15px; }
      .form-row { grid-template-columns: 100px 1fr; gap: 8px; }
      label { font-size: 13px; }
      .field, select { height: 44px; font-size: 13px; }
      textarea { min-height: 108px; font-size: 13px; }
      .actions { gap: 6px; }
      .btn { height: 46px; font-size: 12px; padding: 0 4px; }
    }

    @media (max-width: 360px) {
      .form-row { grid-template-columns: 1fr; gap: 5px; }
      .btn { font-size: 13px; }
      .hint { grid-column: 1 / -1; }
    }

    @media (min-width: 700px) {
      .phone { width: min(760px, 100%); min-height: auto; border-radius: 34px; }
      .screen { min-height: auto; border-radius: 24px; }
      .container { padding: 24px 28px 28px; }
      .page-title { font-size: 34px; }
      .section { padding: 18px 22px; }
      .form-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); column-gap: 28px; row-gap: 12px; }
      .form-row.full { grid-column: 1 / -1; }
      .actions { grid-template-columns: repeat(4, 1fr); max-width: 720px; margin-left: auto; margin-right: auto; }
    }

    @media (min-width: 1100px) {
      .page { padding: 36px; }
      .phone { width: min(980px, 100%); padding: 0; background: transparent; box-shadow: none; }
      .screen { border-radius: 22px; box-shadow: var(--shadow); }
      .status { display: none; }
      .container { padding: 34px 42px 36px; }
      .section { padding: 20px 26px; }
      .form-row { grid-template-columns: var(--label-width) 1fr; }
    }
  
    /* =========================================================
       PC 1366x768 기준 세로 스크롤 방지용 수치 최적화
       - 브라우저 뷰포트 높이: 768px 가정
       - page 상/하 여백: 10px + 10px = 20px
       - 사용 가능 높이: 약 748px
       - 실제 폼 목표 높이: 약 620~650px
       ========================================================= */
    @media (min-width: 1100px) {
      html, body {
        height: 100%;
        overflow: hidden;
      }

      .page {
        height: 100vh;
        min-height: 0;
        padding: 10px 24px;
        align-items: flex-start;
        overflow: hidden;
      }

      .phone {
        width: min(980px, 100%);
        min-height: 0;
        height: auto;
      }

      .screen {
        min-height: 0;
        max-height: calc(100vh - 20px);
        overflow: hidden;
      }

      .container {
        padding: 12px 24px 12px;
      }

      /* 상단 제목부: 약 38px */
      .title-row {
        min-height: 34px;
        margin-bottom: 8px;
        gap: 12px;
      }

      .page-title {
        font-size: 27px;
        line-height: 1.08;
        letter-spacing: -1px;
      }

      .consult-type-group {
        gap: 14px;
      }

      .consult-type-option {
        font-size: 13px;
      }

      .consult-type-option input[type="radio"] {
        width: 15px;
        height: 15px;
      }

      /* 공통 카드: 기존 폭 유지, 세로만 축소 */
      .section {
        padding: 10px 14px;
        margin-bottom: 6px;
        border-radius: 14px;
      }

      .section-title {
        margin-bottom: 8px;
        font-size: 15px;
        line-height: 1.15;
      }

      .client-section-head {
        margin-bottom: 7px;
      }

      .hint {
        margin-bottom: 6px !important;
        font-size: 10px;
        line-height: 1.25;
      }

      /* 입력칸 목표 높이: 34px */
      :root {
        --field-height: 34px;
      }

      .receipt-info-grid,
      .client-info-grid,
      .foreign-grid {
        gap: 7px;
      }

      .receipt-row + .receipt-row,
      .client-row + .client-row {
        margin-top: 7px;
      }

      .client-info-grid.address-row {
        margin-top: 7px;
      }

      .receipt-field label,
      .client-field label,
      .foreign-field label {
        margin-bottom: 3px;
        font-size: 11px;
        line-height: 1.1;
      }

      .receipt-field .field,
      .receipt-field select,
      .client-info-grid.single-row-6 .field,
      .client-info-grid.single-row-6 select,
      .client-info-grid.address-row .field,
      .field,
      select {
        height: 34px;
        min-height: 34px;
        padding: 0 8px;
        font-size: 11px;
        border-radius: 7px;
      }

      /* 주소 칸은 한 줄 유지 */
      #clientAddress {
        height: 34px;
      }

      /* 외국인 버튼 */
      .foreign-btn {
        height: 30px;
        padding: 0 11px;
        font-size: 11px;
        border-radius: 7px;
      }

      /* 상담 신청 내용 영역 */

  <!-- Supabase JS SDK -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script>
    // ===== 0) UI 초기화는 Supabase 연결 성공 여부와 무관하게 항상 먼저 실행 =====
    const DAY_KR = ["일", "월", "화", "수", "목", "금", "토"];

    // ===== 0-1) 조회/등록 모드 상태 =====
    // mode: "new"  -> 새 접수 등록 모드 (기본)
    // mode: "loaded" -> 조회로 기존 기록을 불러와 수정 중인 모드
    let mode = "new";
    let loadedRecordId = null;      // 상담 접수(심리/진로) 레코드 ID
    let loadedClientId = null;      // DB_basic.id
    let loadedRecordType = null;    // "PC" 또는 "CC"


    // ===== 24시간 숫자입력 공통 처리 =====
    // 입력 예:
    // 0900 -> 09:00
    // 1730 -> 17:30
    // 900  -> 포커스를 벗어나면 09:00
    function normalizeTimeDigits(value) {
      let digits = String(value || "").replace(/\D/g, "").slice(0, 4);

      if (!digits) return null;

      // 3자리 입력은 앞에 0을 붙임: 900 -> 0900
      if (digits.length === 3) digits = "0" + digits;
      if (digits.length !== 4) return null;

      const hour = parseInt(digits.slice(0, 2), 10);
      const minute = parseInt(digits.slice(2, 4), 10);

      if (
        Number.isNaN(hour) ||
        Number.isNaN(minute) ||
        hour < 0 || hour > 23 ||
        minute < 0 || minute > 59
      ) {
        return null;
      }

      return `${String(hour).padStart(2, "0")}:${String(minute).padStart(2, "0")}`;
    }

    function timeStringToDigits(timeStr) {
      if (!timeStr) return "";
      return String(timeStr).replace(/\D/g, "").slice(0, 4);
    }

    function formatTimeInputNow(inputEl, allowThreeDigit = false) {
      let digits = String(inputEl.value || "").replace(/\D/g, "").slice(0, 4);

      if (!digits) {
        inputEl.value = "";
        markInvalid(inputEl, false);
        return null;
      }

      // 4자리 입력 즉시 HH:MM으로 자동 변환
      if (digits.length === 4) {
        const normalized = normalizeTimeDigits(digits);

        if (normalized) {
          inputEl.value = normalized;
          markInvalid(inputEl, false);
          return normalized;
        }

        // 유효하지 않은 4자리 시간
        inputEl.value = digits;
        markInvalid(inputEl, true);
        return null;
      }

      // 3자리는 포커스를 벗어날 때 자동 보정: 900 -> 09:00
      if (allowThreeDigit && digits.length === 3) {
        const normalized = normalizeTimeDigits(digits);

        if (normalized) {
          inputEl.value = normalized;
          markInvalid(inputEl, false);
          return normalized;
        }
      }

      inputEl.value = digits;
      markInvalid(inputEl, false);
      return null;
    }

    function attachNumericTimeInput(inputEl, previewUpdater) {
      inputEl.addEventListener("input", () => {
        formatTimeInputNow(inputEl, false);
        previewUpdater();
      });

      inputEl.addEventListener("blur", () => {
        const raw = inputEl.value.trim();

        if (!raw) {
          markInvalid(inputEl, false);
          previewUpdater();
          return;
        }

        const normalized = formatTimeInputNow(inputEl, true);

        if (!normalized) {
          markInvalid(inputEl, true);
        }

        previewUpdater();
      });

      inputEl.addEventListener("focus", () => {
        inputEl.select();
      });
    }

    // 1) 접수일시: 날짜+24시간 숫자입력 (기본값 = 현재 KST 시각, 수정 가능)
    const receivedDateEl = document.getElementById("receivedDate");
    const receivedDateDisplayEl = document.getElementById("receivedDateDisplay");
    const receivedTimeEl = document.getElementById("receivedTime");
    const receivedPreviewEl = document.getElementById("receivedPreview");

    function formatDateWithWeekday(dateValue) {
      if (!dateValue) return "";

      const parts = dateValue.split("-").map(Number);
      if (parts.length !== 3 || parts.some(Number.isNaN)) return dateValue;

      const d = new Date(parts[0], parts[1] - 1, parts[2], 12, 0, 0);
      if (isNaN(d.getTime())) return dateValue;

      return `${dateValue} (${DAY_KR[d.getDay()]})`;
    }

    function updateReceivedDateDisplay() {
      receivedDateDisplayEl.value = formatDateWithWeekday(receivedDateEl.value);
    }

    function getNowKSTParts() {
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(new Date());
      const map = {};
      parts.forEach(p => map[p.type] = p.value);
      return { date: `${map.year}-${map.month}-${map.day}`, hour: parseInt(map.hour, 10), minute: parseInt(map.minute, 10) };
    }


    function setReceivedDefaultToNow() {
      const nowKST = getNowKSTParts();
      const roundedMinute = Math.floor(nowKST.minute / 10) * 10;
      receivedDateEl.value = nowKST.date;
      receivedTimeEl.value =
        `${String(nowKST.hour).padStart(2, "0")}:${String(roundedMinute).padStart(2, "0")}`;
      updateReceivedDateDisplay();
      updateReceivedPreview();
    }

    function updateReceivedPreview() {
      const dateVal = receivedDateEl.value;
      const timeVal = normalizeTimeDigits(receivedTimeEl.value);

      if (!dateVal || !timeVal) {
        receivedPreviewEl.textContent = "접수일시를 입력하면 여기에 표시됩니다.";
        return;
      }

      const d = new Date(dateVal + "T00:00:00");
      const dayLabel = DAY_KR[d.getDay()];
      receivedPreviewEl.textContent = `${dateVal}(${dayLabel}) ${timeVal}`;
    }
    receivedDateEl.addEventListener("change", () => {
      updateReceivedDateDisplay();
      updateReceivedPreview();
    });
    attachNumericTimeInput(receivedTimeEl, updateReceivedPreview);

    function getReceivedISO() {
      const dateVal = receivedDateEl.value;
      const timeVal = normalizeTimeDigits(receivedTimeEl.value);
      if (!dateVal || !timeVal) return null;
      return new Date(`${dateVal}T${timeVal}:00+09:00`).toISOString();
    }

    setReceivedDefaultToNow();



    // 2) 연락처 자동 하이픈 포맷 (000-0000-0000)
    function attachPhoneFormatter(inputEl) {
      inputEl.addEventListener("input", () => {
        let digits = inputEl.value.replace(/\D/g, "").slice(0, 11);
        let formatted = digits;
        if (digits.length > 3 && digits.length <= 7) {
          formatted = digits.slice(0, 3) + "-" + digits.slice(3);
        } else if (digits.length > 7) {
          formatted = digits.slice(0, 3) + "-" + digits.slice(3, 7) + "-" + digits.slice(7);
        }
        inputEl.value = formatted;
      });
    }
    const receptionistPhoneEl = document.getElementById("receptionistPhone");
    const clientPhoneEl = document.getElementById("clientPhone");
    attachPhoneFormatter(receptionistPhoneEl);
    attachPhoneFormatter(clientPhoneEl);

    function isValidPhone(value) {
      return /^\d{3}-\d{3,4}-\d{4}$/.test(value);
    }

    // 3) 생년월일 자동 하이픈 포맷 (0000-00-00)
    const birthDateEl = document.getElementById("birthDate");
    birthDateEl.addEventListener("input", () => {
      let digits = birthDateEl.value.replace(/\D/g, "").slice(0, 8);
      let formatted = digits;
      if (digits.length > 4 && digits.length <= 6) {
        formatted = digits.slice(0, 4) + "-" + digits.slice(4);
      } else if (digits.length > 6) {
        formatted = digits.slice(0, 4) + "-" + digits.slice(4, 6) + "-" + digits.slice(6);
      }
      birthDateEl.value = formatted;
    });

    function isValidBirthDate(value) {
      const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);
      if (!m) return false;
      const year = parseInt(m[1], 10);
      const month = parseInt(m[2], 10);
      const day = parseInt(m[3], 10);
      if (month < 1 || month > 12) return false;
      const daysInMonth = new Date(year, month, 0).getDate();
      if (day < 1 || day > daysInMonth) return false;
      return true;
    }

    function birthDateToISO(value) {
      // 이미 0000-00-00 형식이므로 그대로 사용
      return value;
    }

    // 4-1) 저장된 ISO(UTC) 시각을 KST 기준 {date, time} 문자열로 변환 (조회 결과를 폼에 채울 때 사용)
    function isoToKSTParts(iso) {
      if (!iso) return null;
      const d = new Date(iso);
      if (isNaN(d.getTime())) return null;
      const parts = new Intl.DateTimeFormat("en-CA", {
        timeZone: "Asia/Seoul",
        year: "numeric", month: "2-digit", day: "2-digit",
        hour: "2-digit", minute: "2-digit", hour12: false
      }).formatToParts(d);
      const map = {};
      parts.forEach(p => map[p.type] = p.value);
      return { date: `${map.year}-${map.month}-${map.day}`, time: `${map.hour}:${map.minute}` };
    }

      const parts = isoToKSTParts(iso);

      const dObj = new Date(parts.date + "T00:00:00");

      const ampm = parseInt(parts.time.split(":")[0], 10) < 12 ? "오전" : "오후";

    function updateClientAge() {
      const value = birthDateEl.value.trim();
      const m = value.match(/^(\d{4})-(\d{2})-(\d{2})$/);

      if (!m) {
        clientAgeEl.value = "";
        return;
      }

      const birth = new Date(
        parseInt(m[1], 10),
        parseInt(m[2], 10) - 1,
        parseInt(m[3], 10)
      );

      if (isNaN(birth.getTime())) {
        clientAgeEl.value = "";
        return;
      }

      const now = new Date();
      let age = now.getFullYear() - birth.getFullYear();
      const beforeBirthday =
        now.getMonth() < birth.getMonth() ||
        (now.getMonth() === birth.getMonth() && now.getDate() < birth.getDate());

      if (beforeBirthday) age -= 1;
      clientAgeEl.value = age >= 0 ? String(age) : "";
    }

        __session: session,
        __type: typeCode,
        __appointmentISO: session[timeColumn]
      }));
    }

    function populateFormFromRecord(record) {
      const client = record.__client;
      const row = record.__session;
      const typeCode = record.__type;
      const appointmentISO = typeCode === "CC" ? row.appointment_at : row.visit_at;

      setSelectedCounselType(typeCode);

      const receivedParts = isoToKSTParts(row.receipt_at);
      if (receivedParts) {
        receivedDateEl.value = receivedParts.date;
        setTimeSelectValue(receivedTimeEl, receivedParts.time);
      }
      const apptParts = isoToKSTParts(appointmentISO);
      if (apptParts) {
        reservationDateEl.value = apptParts.date;
        setTimeSelectValue(reservationTimeEl, apptParts.time);
      }
      updateReceivedDateDisplay();
      updateReservationDateDisplay();
      updateReceivedPreview();
      updateReservationPreview();

      document.getElementById("receptionistName").value = row.receptionist_name || "";
      receptionistPhoneEl.value = row.receptionist_phone || "";
      document.getElementById("relationship").value = row.receptionist_relationship || "본인";

      document.getElementById("clientName").value = client.client_name || "";
      clientPhoneEl.value = client.client_phone || "";
      document.getElementById("gender").value = client.sex_code || "";
      birthDateEl.value = client.birth_date || "";
      updateClientAge();
      document.getElementById("job").value = client.job_code || "";
      document.getElementById("clientAddress").value = client.client_address || "";

      document.getElementById("foreignNationality").value = client.nationality || "";
      document.getElementById("foreignEntryDate").value = client.entry_date || "";
      document.getElementById("foreignExitDate").value = client.departure_date || "";
      document.getElementById("foreignNumber").value = client.foreigner_no || "";
      document.getElementById("foreignVisa").value = client.visa_type || "";
      document.getElementById("foreignResult").value = client.legal_status || "";
      openForeignModalBtn.textContent = client.nationality ? `외국인 · ${client.nationality}` : "외국인";

      document.getElementById("consultationTarget").value = row.client_type_code || "";
      document.getElementById("consultationTopic").value = row.topic_code || "";
      details.value = typeCode === "CC" ? (row.counseling_content || "") : (row.application_content || "");
      detailsCounter.textContent = `${details.value.length} / 1000`;

      clearAllInvalid();
      loadedClientId = client.id;
      loadedRecordId = row.id;
      loadedRecordType = typeCode;
      setMode("loaded");
    }

    function showClientSelection(clients, typeCode) {
      let html = `<div class="lookup-result-count">동일한 이름의 내담자가 여러 명 있습니다. 연락처를 선택해주세요.</div>`;
      clients.forEach((client, idx) => {
        html += `
          <div class="lookup-item" data-idx="${idx}">
            <div class="lookup-item-date">${escapeHTML(client.client_phone || "연락처 없음")}</div>
            <div class="lookup-item-sub">${escapeHTML(jobMap[client.job_code] || client.job_code || "직업 미등록")}</div>
          </div>`;
      });
      lookupSelectionAreaEl.innerHTML = html;
      lookupSelectionAreaEl.style.display = "block";

      lookupSelectionAreaEl.querySelectorAll(".lookup-item").forEach((el) => {
        el.addEventListener("click", async () => {
          const idx = parseInt(el.getAttribute("data-idx"), 10);
          lookupSelectionAreaEl.style.display = "none";
          lookupSelectionAreaEl.innerHTML = "";
          try {
            const records = await fetchSessionsForClient(clients[idx], typeCode);
            proceedWithRecords(records);
          } catch (error) {
            console.error(error);
            showLookupMsg("error", "접수 이력 조회 중 오류가 발생했습니다: " + error.message);
          }
        });
      });
    }

    function proceedWithRecords(records) {
      lookupSelectionAreaEl.style.display = "none";
      lookupSelectionAreaEl.innerHTML = "";

      if (!records || records.length === 0) {
        showLookupMsg("error", "선택한 상담구분의 접수 기록이 없습니다.");
        return;
      }

      if (records.length === 1) {
        populateFormFromRecord(records[0]);
        showLookupMsg("success", "조회 결과를 불러왔습니다. 수정 모드가 자동 활성화되었습니다.");
        return;
      }

      let html = `<div class="lookup-result-count">총 ${records.length}건의 접수 기록이 있습니다. 하나를 선택해주세요.</div>`;
      records.forEach((record, idx) => {
        const row = record.__session;
        const target = targetMap[row.client_type_code] || row.client_type_code || "-";
        const topic = topicMap[row.topic_code] || row.topic_code || "-";
        html += `
          <div class="lookup-item" data-idx="${idx}">
            <div class="lookup-item-date">${formatKST(row.receipt_at)}</div>
            <div class="lookup-item-sub">상담대상: ${escapeHTML(target)} · 상담주제: ${escapeHTML(topic)}</div>
          </div>`;
      });
      lookupSelectionAreaEl.innerHTML = html;
      lookupSelectionAreaEl.style.display = "block";

      lookupSelectionAreaEl.querySelectorAll(".lookup-item").forEach((el) => {
        el.addEventListener("click", () => {
          const idx = parseInt(el.getAttribute("data-idx"), 10);
          lookupSelectionAreaEl.style.display = "none";
          lookupSelectionAreaEl.innerHTML = "";
          populateFormFromRecord(records[idx]);
          showLookupMsg("success", "조회 결과를 불러왔습니다. 수정 모드가 자동 활성화되었습니다.");
        });
      });
    }

    async function handleLookup() {
      hideLookupMsg();
      hideStatus();
      lookupSelectionAreaEl.style.display = "none";
      lookupSelectionAreaEl.innerHTML = "";

      if (!sb) {
        showLookupMsg("error", "조회 서버(Supabase) 연결에 실패했습니다.");
        return;
      }
      if (!isLoggedIn()) {
        showLookupMsg("error", "로그인이 필요합니다. 메인화면에서 먼저 로그인해주세요.");
        return;
      }

      const name = document.getElementById("clientName").value.trim();
      const phone = clientPhoneEl.value.trim();
      const typeCode = getSelectedCounselType();

      markInvalid(document.getElementById("clientName"), !name);
      if (!name) {
        showLookupMsg("error", "내담자명을 입력해주세요.");
        return;
      }
      if (phone && !isValidPhone(phone)) {
        markInvalid(clientPhoneEl, true);
        showLookupMsg("error", "연락처 형식이 올바르지 않습니다. (예: 010-0000-0000)");
        return;
      }
      markInvalid(clientPhoneEl, false);

      lookupSaveBtn.disabled = true;
      const originalText = lookupSaveBtn.textContent;
      lookupSaveBtn.textContent = "조회 중...";

      try {
        let query = sb
          .from(BASIC_TABLE)
          .select("id, counsel_type, nationality, entry_date, departure_date, foreigner_no, visa_type, legal_status, client_name, sex_code, birth_date, client_phone, client_address, job_code")
          .eq("client_name", name)
          .order("created_at", { ascending: false });
        if (phone) query = query.eq("client_phone", phone);

        const { data: clients, error } = await query;
        if (error) throw error;
        if (!clients || clients.length === 0) {
          showLookupMsg("error", "일치하는 내담자 기본정보가 없습니다.");
          return;
        }

        if (!phone && clients.length > 1) {
          showClientSelection(clients, typeCode);
          return;
        }

        const records = await fetchSessionsForClient(clients[0], typeCode);
        proceedWithRecords(records);
      } catch (error) {
        console.error(error);
        showLookupMsg("error", "조회 중 오류가 발생했습니다: " + (error?.message || error));
      } finally {
        lookupSaveBtn.textContent = originalText;
        updateLoginGate();
      }
    }

    // ===== 11) 조회된 접수 수정 저장 =====
    async function handleSave() {
      hideStatus();
      hideLookupMsg();

      if (!sb) {
        showStatus("error", "저장 서버(Supabase) 연결에 실패했습니다.");
        return;
      }
      if (!isLoggedIn()) {
        showStatus("error", "로그인이 필요합니다. 메인화면에서 먼저 로그인해주세요.");
        return;
      }
      if (!loadedRecordId || !loadedClientId || !loadedRecordType) {
        showStatus("error", "수정할 기존 데이터가 없습니다. 먼저 조회를 진행해주세요.");
        return;
      }

      const { hasError, counselType, basicPayload, sessionPayload } = collectAndValidateFormData();
      if (hasError) {
        showStatus("error", "입력값을 다시 확인해주세요. 빨간색으로 표시된 항목을 채워주세요.");
        return;
      }
      if (counselType !== loadedRecordType) {
        showStatus("error", "조회된 접수의 상담구분은 수정할 수 없습니다. 초기화 후 신규 등록해주세요.");
        return;
      }

      const confirmed = window.confirm("수정한 내용을 저장하시겠습니까?");
      if (!confirmed) return;

      editSaveBtn.disabled = true;
      const originalText = editSaveBtn.textContent;
      editSaveBtn.textContent = "저장 중...";

      try {
        // 기본정보의 상담구분은 기존 PC/CC/BOTH를 보존하여 다른 상담 이력을 잃지 않게 함
        const { data: currentBasic, error: basicReadError } = await sb
          .from(BASIC_TABLE)
          .select("counsel_type")
          .eq("id", loadedClientId)
          .single();
        if (basicReadError) throw basicReadError;

        const { error: basicError } = await sb
          .from(BASIC_TABLE)
          .update({
            ...basicPayload,
            counsel_type: mergeCounselType(currentBasic.counsel_type, loadedRecordType)
          })
          .eq("id", loadedClientId);
        if (basicError) throw basicError;

        const tableName = getSessionTable(loadedRecordType);
        const { error: sessionError } = await sb
          .from(tableName)
          .update(sessionPayload)
          .eq("id", loadedRecordId);
        if (sessionError) throw sessionError;

        showStatus("success", "수정한 접수 상담 정보가 정상적으로 저장되었습니다.");
        resetFormToNewMode();
      } catch (error) {
        console.error(error);
        showStatus("error", "수정 저장 중 오류가 발생했습니다: " + (error?.message || error));
      } finally {
        editSaveBtn.textContent = originalText;
        updateLoginGate();
      }
    }

    lookupSaveBtn.addEventListener("click", handleLookup);
    editSaveBtn.addEventListener("click", handleSave);

    // ===== A4 세로 PDF 저장 =====
    const pdfSaveBtn = document.getElementById("pdfSaveBtn");

    if (pdfSaveBtn) {
      pdfSaveBtn.addEventListener("click", () => {
        window.print();
      });
    }

  </script>
</body>
</html>
