.type-summary{border-top:1px solid var(--line2);padding:11px 14px;background:#fff}

.loading-cover{position:fixed;inset:72px 0 0;z-index:50;background:rgba(244,247,251,.72);display:none;place-items:center;backdrop-filter:blur(1px)}.loading-cover.show{display:grid}.loading-box{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 20px;box-shadow:var(--shadow);font-size:12px;font-weight:850;color:#42526a}

@media(max-width:1450px){

</style>

<body>
<div class="app">
  <header class="topbar">
    <div class="brand">

<script>
/*
  [DB 설계 원칙 - 조회 전용 스케줄]
  1) 별도 schedule 테이블을 만들지 않는다.
  2) 기본정보는 DB_basic.id = 각 상담 테이블.client_id 로 조회한다.
  3) 심리상담 일정: DB_psychological_counseling.visit_at
     - 실제 상담 시작/종료: session_start_at / session_end_at
     - 차기예약: next_session_at 우선, 없으면 next_session_date
  4) 진로상담 일정: DB_career_counseling.appointment_at
     - 실제 상담 시작/종료: session_start_at / session_end_at
     - 차기예약: next_session_at 우선, 없으면 next_session_date
  5) 화면 표시 대상은 record_active=true 또는 이미 완료(session_end_at 존재)된 기록이다.
     - 비활성 + 미실시 기록은 상담구분 변경 과정에서 생긴 중복 접수 가능성이 있어 제외한다.
     - 비활성이라도 실제 완료된 과거 상담은 일정 이력으로 보존해 표시한다.
  6) receipt_at은 '접수일'이지 상담 일정이 아니므로 달력에서 제외한다.
  7) 이 화면은 SELECT 전용이다. INSERT/UPDATE/DELETE를 하지 않는다.
*/

(() => {
  'use strict';

  const SUPABASE_URL = 'https://fafdxaifluftnertbpvr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storage: window.sessionStorage,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  const IDLE_MS = 10 * 60 * 1000;
  const MAX_CELL_ITEMS = 3;
  const KST_OFFSET_MS = 9 * 60 * 60 * 1000;

  const els = {
    userName: document.getElementById('userName'), userRole: document.getElementById('userRole'),
    monthLabel: document.getElementById('monthLabel'), calGrid: document.getElementById('calGrid'),
    summaryDate: document.getElementById('summaryDate'), timelineDate: document.getElementById('timelineDate'),
    timelineTotal: document.getElementById('timelineTotal'), timelineScroll: document.getElementById('timelineScroll'),
    loading: document.getElementById('loadingCover'), toast: document.getElementById('toast'),
    psychCount: document.getElementById('psychCount'), careerCount: document.getElementById('careerCount'),
    sumPlanned: document.getElementById('sumPlanned'), sumProgress: document.getElementById('sumProgress'),
    sumDone: document.getElementById('sumDone'), sumMissed: document.getElementById('sumMissed'),
    sumNext: document.getElementById('sumNext'), sumTotal: document.getElementById('sumTotal')
  };

  const state = {
    user: null,
    employee: null,
    viewYear: 0,
    viewMonth: 0,
    selectedDate: '',
    events: [],
    byDate: new Map(),
    idleTimer: null,
    timelineScrollRaf: 0,
    timelineProgrammaticUntil: 0
  };

  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymd(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
  function kstNowDate(){ return new Date(Date.now() + KST_OFFSET_MS); }
  function todayYmd(){ const d=kstNowDate(); return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); }
  function dateOnlyParts(dateStr){ const [y,m,d]=String(dateStr||'').split('-').map(Number); return {y,m,d}; }
  function formatKoreanDate(dateStr){ const {y,m,d}=dateOnlyParts(dateStr); if(!y) return '-'; const wd=['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()]; return `${y}년 ${m}월 ${d}일 (${wd})`; }
  function monthDateBounds(y,m){ const start=ymd(y,m,1); const endDate = m===12 ? ymd(y+1,1,1) : ymd(y,m+1,1); return {start,end:endDate}; }
  function monthUtcBounds(y,m){ const start=new Date(Date.UTC(y,m-1,1)-KST_OFFSET_MS).toISOString(); const end=new Date(Date.UTC(m===12?y+1:y,m===12?0:m,1)-KST_OFFSET_MS).toISOString(); return {start,end}; }
  function isoToKstParts(iso){
    if(!iso) return null;
    const d=new Date(iso); if(Number.isNaN(d.getTime())) return null;
    const k=new Date(d.getTime()+KST_OFFSET_MS);
    return {y:k.getUTCFullYear(),m:k.getUTCMonth()+1,d:k.getUTCDate(),hh:k.getUTCHours(),mm:k.getUTCMinutes(),ms:d.getTime()};
  }
  function isoToDateKey(iso){ const p=isoToKstParts(iso); return p?ymd(p.y,p.m,p.d):''; }
  function isoToTime(iso){ const p=isoToKstParts(iso); return p?`${pad2(p.hh)}:${pad2(p.mm)}`:'--:--'; }
  function escapeText(v){ return v==null?'':String(v); }
  function showLoading(show){ els.loading.classList.toggle('show',!!show); }
  let toastTimer=null;
  function toast(msg){ clearTimeout(toastTimer); els.toast.textContent=msg; els.toast.classList.add('show'); toastTimer=setTimeout(()=>els.toast.classList.remove('show'),2600); }

  function statusMeta(status){
    return {
      planned:{label:'예정',color:'#2563eb',cls:'planned'},
      progress:{label:'진행중',color:'#f97316',cls:'progress'},
      done:{label:'완료',color:'#16a34a',cls:'done'},
      missed:{label:'미실시',color:'#8a94a4',cls:'missed'},
      next:{label:'차기예약',color:'#7c3aed',cls:'next'}
    }[status] || {label:'예정',color:'#2563eb',cls:'planned'};
  }

  function primaryStatus(row, scheduledIso){
    const start=row.session_start_at ? new Date(row.session_start_at).getTime() : NaN;
    const end=row.session_end_at ? new Date(row.session_end_at).getTime() : NaN;
    const now=Date.now();
    if(Number.isFinite(end)) return 'done';
    if(Number.isFinite(start) && start<=now) return 'progress';
    const scheduled=scheduledIso ? new Date(scheduledIso).getTime() : NaN;
    if(Number.isFinite(scheduled) && scheduled<now) return 'missed';
    return 'planned';
  }

  function buildPrimaryEvent(source,row,basic,scheduledIso){
    if(!scheduledIso) return null;
    const key=isoToDateKey(scheduledIso); if(!key) return null;
    return {
      uid:`${source}:${row.id}:primary`, source, kind:'primary', date:key,
      time:isoToTime(scheduledIso), sortMs:new Date(scheduledIso).getTime(),
      status:primaryStatus(row,scheduledIso),
      clientId:row.client_id, name:basic?.client_name || '이름없음', phone:basic?.client_phone || '-',
      birthDate:basic?.birth_date || null,
      sessionNo:row.session_no || null,
      location:row.counseling_location || '-',
      sessionStatus:row.session_status || '-',
      counselLabel:source==='psych'?'심리상담':'진로상담'
    };
  }

  function buildNextEvent(source,row,basic){
    let date='',time='--:--',sortMs=Number.MAX_SAFE_INTEGER;
    if(row.next_session_at){
      date=isoToDateKey(row.next_session_at); time=isoToTime(row.next_session_at); sortMs=new Date(row.next_session_at).getTime();
    } else if(row.next_session_date){
      date=String(row.next_session_date).slice(0,10);
      const {y,m,d}=dateOnlyParts(date); sortMs=Date.UTC(y,m-1,d)-KST_OFFSET_MS;
    }
    if(!date) return null;
    return {
      uid:`${source}:${row.id}:next`,source,kind:'next',date,time,sortMs,status:'next',
      clientId:row.client_id,name:basic?.client_name || '이름없음',phone:basic?.client_phone || '-',birthDate:basic?.birth_date || null,
      sessionNo:row.session_no ? Number(row.session_no)+1 : null,
      location:row.counseling_location || '-',sessionStatus:row.session_status || '-',
      counselLabel:source==='psych'?'심리상담':'진로상담'
    };
  }

  async function getEmployee(){
    const {data:{session},error}=await sb.auth.getSession();
    if(error || !session?.user){
      alert('로그인이 필요합니다.'); location.href='index.html'; return false;
    }
    state.user=session.user;
    const {data,error:empErr}=await sb.from('employee').select('id,employee_code,position,name,permission,active').eq('auth_user_id',session.user.id).maybeSingle();
    if(empErr || !data || !data.active){
      alert('사용자 권한을 확인할 수 없습니다.'); await sb.auth.signOut(); location.href='index.html'; return false;
    }
    state.employee=data;
    els.userName.textContent=`${data.name} ${data.position||''}`.trim();
    els.userRole.textContent=`${data.permission} · ${data.employee_code}`;
    return true;
  }

  async function loadBasicMap(clientIds){
    const ids=[...new Set(clientIds.filter(Boolean))];
    if(!ids.length) return new Map();
    const {data,error}=await sb.from('DB_basic').select('id,client_name,client_phone,birth_date,counsel_type').in('id',ids);
    if(error) throw error;
    return new Map((data||[]).map(x=>[x.id,x]));
  }

  async function queryPsych(y,m){
    const u=monthUtcBounds(y,m), d=monthDateBounds(y,m);
    const orFilter=[
      `and(visit_at.gte.${u.start},visit_at.lt.${u.end})`,
      `and(visit_at.is.null,session_start_at.gte.${u.start},session_start_at.lt.${u.end})`,
      `and(next_session_at.gte.${u.start},next_session_at.lt.${u.end})`,
      `and(next_session_at.is.null,next_session_date.gte.${d.start},next_session_date.lt.${d.end})`
    ].join(',');
    const {data,error}=await sb.from('DB_psychological_counseling')
      .select('id,client_id,visit_at,session_start_at,session_end_at,next_session_at,next_session_date,session_no,session_status,counseling_location,record_active')
      .or(orFilter);
    if(error) throw error; return data||[];
  }

  async function queryCareer(y,m){
    const u=monthUtcBounds(y,m), d=monthDateBounds(y,m);
    const orFilter=[
      `and(appointment_at.gte.${u.start},appointment_at.lt.${u.end})`,
      `and(appointment_at.is.null,session_start_at.gte.${u.start},session_start_at.lt.${u.end})`,
      `and(next_session_at.gte.${u.start},next_session_at.lt.${u.end})`,
      `and(next_session_at.is.null,next_session_date.gte.${d.start},next_session_date.lt.${d.end})`
    ].join(',');
    const {data,error}=await sb.from('DB_career_counseling')
      .select('id,client_id,appointment_at,session_start_at,session_end_at,next_session_at,next_session_date,session_no,session_status,counseling_location,record_active')
      .or(orFilter);
    if(error) throw error; return data||[];
  }

  async function loadMonth(y,m){
    showLoading(true);
    try{
      const [psych,career]=await Promise.all([queryPsych(y,m),queryCareer(y,m)]);
      const basics=await loadBasicMap([...psych.map(x=>x.client_id),...career.map(x=>x.client_id)]);
      const monthStart=ymd(y,m,1), monthEnd=monthDateBounds(y,m).end;
      const events=[];
      for(const r of psych){
        if(r.record_active !== true && !r.session_end_at) continue;
        const b=basics.get(r.client_id);
        const primary=buildPrimaryEvent('psych',r,b,r.visit_at || r.session_start_at);
        const next=buildNextEvent('psych',r,b);
        if(primary && primary.date>=monthStart && primary.date<monthEnd) events.push(primary);
        if(next && next.date>=monthStart && next.date<monthEnd) events.push(next);
      }
      for(const r of career){
        if(r.record_active !== true && !r.session_end_at) continue;
        const b=basics.get(r.client_id);
        const primary=buildPrimaryEvent('career',r,b,r.appointment_at || r.session_start_at);
        const next=buildNextEvent('career',r,b);
        if(primary && primary.date>=monthStart && primary.date<monthEnd) events.push(primary);
        if(next && next.date>=monthStart && next.date<monthEnd) events.push(next);
      }
      events.sort((a,b)=>a.date.localeCompare(b.date)||a.sortMs-b.sortMs||a.name.localeCompare(b.name,'ko'));
      state.events=events;
      state.byDate=new Map();
      for(const ev of events){ if(!state.byDate.has(ev.date)) state.byDate.set(ev.date,[]); state.byDate.get(ev.date).push(ev); }
      renderAll();
    }catch(err){
      console.error('스케줄 조회 오류:',err);
      state.events=[]; state.byDate=new Map(); renderAll();
      toast('스케줄 조회 중 오류가 발생했습니다. RLS와 DB 연결을 확인해 주세요.');
    }finally{ showLoading(false); }
  }

  function sixWeekCells(y,m){
    const first=new Date(Date.UTC(y,m-1,1));
    const firstWeekday=first.getUTCDay();
    const gridStart=new Date(Date.UTC(y,m-1,1-firstWeekday));
    const cells=[];
    for(let i=0;i<42;i++){
      const d=new Date(gridStart.getTime()+i*86400000);
      const yy=d.getUTCFullYear(), mm=d.getUTCMonth()+1, dd=d.getUTCDate();
      cells.push({y:yy,m:mm,d:dd,key:ymd(yy,mm,dd),other:mm!==m,weekday:d.getUTCDay()});
    }
    return cells;
  }

  function renderCalendar(){
    els.monthLabel.textContent=`${state.viewYear}년 ${state.viewMonth}월`;
    els.calGrid.textContent='';
    const today=todayYmd();
    for(const c of sixWeekCells(state.viewYear,state.viewMonth)){
      const cell=document.createElement('div');
      cell.className=`day-cell${c.other?' other':''}${c.weekday===0?' sun':''}${c.weekday===6?' sat':''}${c.key===today?' today':''}${c.key===state.selectedDate?' selected':''}`;
      cell.dataset.date=c.key;
      const num=document.createElement('div'); num.className='day-num'; num.textContent=c.d; cell.appendChild(num);
      const holder=document.createElement('div'); holder.className='day-events';
      const events=(state.byDate.get(c.key)||[]).slice().sort((a,b)=>a.sortMs-b.sortMs);
      events.slice(0,MAX_CELL_ITEMS).forEach(ev=>{
        const meta=statusMeta(ev.status); const row=document.createElement('div'); row.className='day-event';
        const dot=document.createElement('i'); dot.style.background=meta.color;
        const time=document.createElement('span'); time.className='time'; time.textContent=ev.time;
        const name=document.createElement('span'); name.className='name'; name.textContent=ev.name;
        row.append(dot,time,name); holder.appendChild(row);
      });
      if(events.length>MAX_CELL_ITEMS){ const more=document.createElement('div'); more.className='more-event'; more.textContent=`+${events.length-MAX_CELL_ITEMS}건 더보기`; holder.appendChild(more); }
      cell.appendChild(holder);
      cell.addEventListener('click',()=>selectDate(c.key,c.y,c.m));
      els.calGrid.appendChild(cell);
    }
  }

  function countStatuses(items){
    const c={planned:0,progress:0,done:0,missed:0,next:0,total:items.length};
    items.forEach(x=>{ if(Object.prototype.hasOwnProperty.call(c,x.status)) c[x.status]++; });
    return c;
  }

  function renderSummary(){
    // 하단 KPI = 현재 달력에 표시 중인 "월 전체" 일정 기준
    const monthlyItems=[];
    for(const dateKey of monthDayKeys(state.viewYear,state.viewMonth)){
      const dayItems=state.byDate.get(dateKey)||[];
      monthlyItems.push(...dayItems);
    }
    const monthCount=countStatuses(monthlyItems);

    els.summaryDate.textContent=`${state.viewYear}년 ${state.viewMonth}월`;
    els.sumPlanned.textContent=`${monthCount.planned}건`;
    els.sumProgress.textContent=`${monthCount.progress}건`;
    els.sumDone.textContent=`${monthCount.done}건`;
    els.sumMissed.textContent=`${monthCount.missed}건`;
    els.sumNext.textContent=`${monthCount.next}건`;
    els.sumTotal.textContent=`${monthCount.total}건`;

    // 우측 타임라인 = 현재 선택된 날짜 기준
    const selectedItems=state.byDate.get(state.selectedDate)||[];
    const selectedCount=countStatuses(selectedItems);
    els.timelineDate.textContent=formatKoreanDate(state.selectedDate);
    els.timelineTotal.textContent=`총 ${selectedCount.total}건`;

    const psych=selectedItems.filter(x=>x.source==='psych').length;
    const career=selectedItems.filter(x=>x.source==='career').length;
    els.psychCount.textContent=`${psych}건`;
    els.careerCount.textContent=`${career}건`;
  }

  function renderCalendarSelectionOnly(){
    els.calGrid.querySelectorAll('.day-cell').forEach(cell=>{
      cell.classList.toggle('selected',cell.dataset.date===state.selectedDate);
    });
  }

  function syncSelectedDateFromTimeline(date){
    if(!date || date===state.selectedDate) return;
    const p=dateOnlyParts(date);
    if(p.y!==state.viewYear || p.m!==state.viewMonth) return;
    state.selectedDate=date;
    renderCalendarSelectionOnly();
    renderSummary();
  }

  function calculateAge(birthDate,refDate){
    if(!birthDate||!refDate) return null; const b=dateOnlyParts(birthDate), r=dateOnlyParts(refDate); if(!b.y||!r.y) return null;
    let age=r.y-b.y; if(r.m<b.m || (r.m===b.m && r.d<b.d)) age--; return age>=0?age:null;
  }

  function createTimelineEvent(ev,dateKey){
    const meta=statusMeta(ev.status), age=calculateAge(ev.birthDate,dateKey);
    const item=document.createElement('div'); item.className='t-item'; item.style.setProperty('--status-color',meta.color);
    const time=document.createElement('div'); time.className='t-time'; time.textContent=ev.time;
    const top=document.createElement('div'); top.className='t-top';
    const name=document.createElement('div'); name.className='t-name'; name.textContent=age==null?ev.name:`${ev.name} (${age}세)`;
    const pill=document.createElement('span'); pill.className='status-pill'; pill.textContent=meta.label; top.append(name,pill);
    const metaRow=document.createElement('div'); metaRow.className='t-meta';
    const fields=[`◉ ${ev.counselLabel}`, ev.sessionNo?`│ ${ev.sessionNo}회기`:'│ 회기 미지정', `⌖ ${ev.location||'-'}`];
    fields.forEach(v=>{ const s=document.createElement('span'); s.textContent=v; metaRow.appendChild(s); });
    const phone=document.createElement('div'); phone.className='t-phone'; phone.textContent=`연락처 ${ev.phone||'-'}`;
    item.append(time,top,metaRow,phone);
    return item;
  }

  function monthDayKeys(y,m){
    const last=new Date(Date.UTC(y,m,0)).getUTCDate();
    return Array.from({length:last},(_,i)=>ymd(y,m,i+1));
  }

  function renderTimeline(){
    els.timelineScroll.textContent='';
    const monthList=document.createElement('div'); monthList.className='timeline-month-list';

    for(const dateKey of monthDayKeys(state.viewYear,state.viewMonth)){
      const items=(state.byDate.get(dateKey)||[]).slice().sort((a,b)=>a.sortMs-b.sortMs||a.name.localeCompare(b.name,'ko'));
      const group=document.createElement('section');
      group.className='timeline-date-group';
      group.dataset.date=dateKey;

      const label=document.createElement('div'); label.className='timeline-date-label';
      const strong=document.createElement('strong'); strong.textContent=formatKoreanDate(dateKey);
      const cnt=document.createElement('span'); cnt.textContent=`${items.length}건`;
      label.append(strong,cnt);
      group.appendChild(label);

      if(items.length){
        const list=document.createElement('div'); list.className='timeline-list';
        items.forEach(ev=>list.appendChild(createTimelineEvent(ev,dateKey)));
        group.appendChild(list);
      }else{
        const empty=document.createElement('div'); empty.className='timeline-date-empty'; empty.textContent='등록된 상담 일정이 없습니다.';
        group.appendChild(empty);
      }
      monthList.appendChild(group);
    }

    els.timelineScroll.appendChild(monthList);
  }

  function scrollTimelineToDate(date,behavior='auto'){
    const group=els.timelineScroll.querySelector(`.timeline-date-group[data-date="${date}"]`);
    if(!group) return;
    state.timelineProgrammaticUntil=performance.now()+(behavior==='smooth'?800:160);
    const target=Math.max(0,group.offsetTop-2);
    els.timelineScroll.scrollTo({top:target,behavior});
  }

  function detectTimelineDate(){
    if(performance.now()<state.timelineProgrammaticUntil) return;
    const groups=[...els.timelineScroll.querySelectorAll('.timeline-date-group')];
    if(!groups.length) return;

    const base=els.timelineScroll.getBoundingClientRect().top+88;
    let activeGroup=null;
    let nearest=null;
    let nearestDistance=Infinity;

    for(const group of groups){
      const r=group.getBoundingClientRect();
      if(r.top<=base && r.bottom>base){
        activeGroup=group;
        break;
      }
      const dist=Math.abs(r.top-base);
      if(dist<nearestDistance){
        nearestDistance=dist;
        nearest=group;
      }
    }

    activeGroup=activeGroup||nearest;
    if(activeGroup) syncSelectedDateFromTimeline(activeGroup.dataset.date);
  }

  function onTimelineScroll(){
    if(state.timelineScrollRaf) return;
    state.timelineScrollRaf=requestAnimationFrame(()=>{
      state.timelineScrollRaf=0;
      detectTimelineDate();
    });
  }

  function renderAll(){
    renderCalendar();
    renderSummary();
    renderTimeline();
    requestAnimationFrame(()=>scrollTimelineToDate(state.selectedDate,'auto'));
  }

  function selectDate(date,y,m){
    if(y!==state.viewYear || m!==state.viewMonth){
      state.viewYear=y;
      state.viewMonth=m;
      state.selectedDate=date;
      loadMonth(y,m);
      return;
    }
    state.selectedDate=date;
    renderCalendarSelectionOnly();
    renderSummary();
    scrollTimelineToDate(date,'smooth');
  }

  function goMonth(delta){
    let y=state.viewYear,m=state.viewMonth+delta; if(m<1){y--;m=12}else if(m>12){y++;m=1}
    state.viewYear=y; state.viewMonth=m;
    const today=todayYmd(), t=dateOnlyParts(today);
    state.selectedDate=(t.y===y&&t.m===m)?today:ymd(y,m,1);
    loadMonth(y,m);
  }

  function resetIdle(){ clearTimeout(state.idleTimer); state.idleTimer=setTimeout(async()=>{ try{await sb.auth.signOut();}catch{} alert('10분 동안 사용이 없어 자동 로그아웃되었습니다.'); location.href='index.html'; },IDLE_MS); }
  ['click','keydown','mousemove','scroll','touchstart'].forEach(evt=>document.addEventListener(evt,resetIdle,{passive:true}));

  els.timelineScroll.addEventListener('scroll',onTimelineScroll,{passive:true});

  document.getElementById('prevBtn').addEventListener('click',()=>goMonth(-1));
  document.getElementById('nextBtn').addEventListener('click',()=>goMonth(1));
  document.getElementById('todayBtn').addEventListener('click',()=>{ const t=kstNowDate(); state.viewYear=t.getUTCFullYear(); state.viewMonth=t.getUTCMonth()+1; state.selectedDate=todayYmd(); loadMonth(state.viewYear,state.viewMonth); });
  document.getElementById('backBtn').addEventListener('click',()=>history.length>1?history.back():location.assign('index.html'));
  document.getElementById('logoutBtn').addEventListener('click',async()=>{ if(!confirm('로그아웃 하시겠습니까?')) return; await sb.auth.signOut(); location.href='index.html'; });

  async function init(){
    const ok=await getEmployee(); if(!ok) return;
    const t=kstNowDate(); state.viewYear=t.getUTCFullYear(); state.viewMonth=t.getUTCMonth()+1; state.selectedDate=todayYmd(); resetIdle(); await loadMonth(state.viewYear,state.viewMonth);
  }

  init();
})();
</script>
