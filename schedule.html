<script>
/*
  [DB 설계 원칙 - 조회 전용 스케줄]
  1) 별도 schedule 테이블을 만들지 않는다.
  2) 기본정보는 DB_basic.id = 각 상담 테이블.client_id 로 조회한다.
  3) 심리상담 일정: 실제 상담 시작(session_start_at)이 있으면 그 일시를 우선 사용하고,
     실제 시작이 없을 때만 예약일시(visit_at)를 사용한다.
     - 실제 상담 종료: session_end_at
     - 차기예약: next_session_at 우선, 없으면 next_session_date
  4) 진로상담 일정: 실제 상담 시작(session_start_at)이 있으면 그 일시를 우선 사용하고,
     실제 시작이 없을 때만 예약일시(appointment_at)를 사용한다.
     - 실제 상담 종료: session_end_at
     - 차기예약: next_session_at 우선, 없으면 next_session_date
  5) 화면 표시 대상은 record_active=true 또는 이미 완료(session_end_at 존재)된 기록이다.
     - 비활성 + 미실시 기록은 상담구분 변경 과정에서 생긴 중복 접수 가능성이 있어 제외한다.
     - 비활성이라도 실제 완료된 과거 상담은 일정 이력으로 보존해 표시한다.
  6) receipt_at은 상담/예약일과 별개의 '접수' 일정으로 달력에 함께 표시한다.
  7) 이 화면은 SELECT 전용이다. INSERT/UPDATE/DELETE를 하지 않는다.
*/

(() => {
  'use strict';
  console.info('schedule build: 20260913-day-detail-history-v4');

  const SUPABASE_URL = 'https://fafdxaifluftnertbpvr.supabase.co';
  const SUPABASE_KEY = 'sb_publishable_RNEAVQD2wZRtZojxVU11aA_Dacmf7db';
  const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY, {
    auth: {
      storage: window.sessionStorage,
      persistSession: true,
      autoRefreshToken: true,
      detectSessionInUrl: true
    }
  });

  async function secureScheduleMonth(year,month){
    const {data:sessionData,error:sessionError}=await sb.auth.getSession();
    if(sessionError) throw sessionError;

    const accessToken=sessionData?.session?.access_token;
    if(!accessToken) throw new Error('로그인 세션을 확인할 수 없습니다.');

    const response=await fetch(`${SUPABASE_URL}/functions/v1/secure-schedule-read`,{
      method:'POST',
      headers:{
        'Content-Type':'application/json',
        'Authorization':`Bearer ${accessToken}`,
        'apikey':SUPABASE_KEY
      },
      body:JSON.stringify({year,month}),
      cache:'no-store'
    });

    let result=null;
    try{ result=await response.json(); }catch(_){ result=null; }

    }

    return {
      psych:Array.isArray(result.data?.psych)?result.data.psych:[],
      career:Array.isArray(result.data?.career)?result.data.career:[]
    };
  }

  function pad2(n){ return String(n).padStart(2,'0'); }
  function ymd(y,m,d){ return `${y}-${pad2(m)}-${pad2(d)}`; }
  function kstNowDate(){ return new Date(Date.now() + KST_OFFSET_MS); }
  function todayYmd(){ const d=kstNowDate(); return ymd(d.getUTCFullYear(),d.getUTCMonth()+1,d.getUTCDate()); }
  function dateOnlyParts(dateStr){ const [y,m,d]=String(dateStr||'').split('-').map(Number); return {y,m,d}; }
  function formatKoreanDate(dateStr){ const {y,m,d}=dateOnlyParts(dateStr); if(!y) return '-'; const wd=['일','월','화','수','목','금','토'][new Date(Date.UTC(y,m-1,d)).getUTCDay()]; return `${y}년 ${m}월 ${d}일 (${wd})`; }
  function monthDateBounds(y,m){ const start=ymd(y,m,1); const endDate = m===12 ? ymd(y+1,1,1) : ymd(y,m+1,1); return {start,end:endDate}; }
  function monthUtcBounds(y,m){ const start=new Date(Date.UTC(y,m-1,1)-KST_OFFSET_MS).toISOString(); const end=new Date(Date.UTC(m===12?y+1:y,m===12?0:m,1)-KST_OFFSET_MS).toISOString(); return {start,end}; }
  function isoToKstParts(iso){
    if(!iso) return null;
    const d=new Date(iso); if(Number.isNaN(d.getTime())) return null;
    const k=new Date(d.getTime()+KST_OFFSET_MS);
    return {y:k.getUTCFullYear(),m:k.getUTCMonth()+1,d:k.getUTCDate(),hh:k.getUTCHours(),mm:k.getUTCMinutes(),ms:d.getTime()};
  }
  function isoToDateKey(iso){ const p=isoToKstParts(iso); return p?ymd(p.y,p.m,p.d):''; }
  function isoToTime(iso){ const p=isoToKstParts(iso); return p?`${pad2(p.hh)}:${pad2(p.mm)}`:'--:--'; }
  function escapeText(v){ return v==null?'':String(v); }
  function showLoading(show){ els.loading.classList.toggle('show',!!show); }

  function primaryStatus(row, scheduledIso){
    const end=row.session_end_at ? new Date(row.session_end_at).getTime() : NaN;
    const sessionStatus=String(row.session_status || '').trim();
    const now=Date.now();

    // 진행중 상태는 사용하지 않는다.
    // 실제 종료시각 또는 상담 상태가 '종결'이면 종료로 확정한다.
    if(Number.isFinite(end) || sessionStatus==='종결' || sessionStatus==='상담종료') return 'done';

    const scheduled=scheduledIso ? new Date(scheduledIso).getTime() : NaN;
    if(Number.isFinite(scheduled) && scheduled<now) return 'missed';
    return 'planned';
  }

  function buildReceiptEvent(source,row,basic){
    if(!row.receipt_at) return null;
    const key=isoToDateKey(row.receipt_at);
    if(!key) return null;

    return {
      uid:`${source}:${row.id}:receipt`,
      recordId:row.id,
      source,
      kind:'receipt',
      date:key,
      time:isoToTime(row.receipt_at),
      sortMs:new Date(row.receipt_at).getTime(),
      status:'received',
      clientId:row.client_id,
      name:basic?.client_name || '이름없음',
      phone:basic?.client_phone || '-',
      birthDate:basic?.birth_date || null,
      sessionNo:null,
      location:'-',
      sessionStatus:row.session_status || '-',
      counselLabel:source==='psych'?'심리상담 접수':'진로상담 접수'
    };
  }

  function buildPrimaryEvent(source,row,basic,scheduledIso){
    if(!scheduledIso) return null;
    const key=isoToDateKey(scheduledIso); if(!key) return null;
    return {
      uid:`${source}:${row.id}:primary`, recordId:row.id, source, kind:'primary', date:key,
      time:isoToTime(scheduledIso), sortMs:new Date(scheduledIso).getTime(),
      status:primaryStatus(row,scheduledIso),
      clientId:row.client_id, name:basic?.client_name || '이름없음', phone:basic?.client_phone || '-',
      birthDate:basic?.birth_date || null,
      sessionNo:row.session_no || null,
      location:row.counseling_location || '-',
      sessionStatus:row.session_status || '-',
      hasSessionStart:!!row.session_start_at,
      hasSessionEnd:!!row.session_end_at,
      counselLabel:source==='psych'?'심리상담':'진로상담'
    };
  }

  function buildNextEvent(source,row,basic){
    let date='',time='--:--',sortMs=Number.MAX_SAFE_INTEGER;
    if(row.next_session_at){
      date=isoToDateKey(row.next_session_at); time=isoToTime(row.next_session_at); sortMs=new Date(row.next_session_at).getTime();
    } else if(row.next_session_date){
      date=String(row.next_session_date).slice(0,10);
      const {y,m,d}=dateOnlyParts(date); sortMs=Date.UTC(y,m-1,d)-KST_OFFSET_MS;
    }
    if(!date) return null;
    return {
      uid:`${source}:${row.id}:next`,recordId:row.id,source,kind:'next',date,time,sortMs,status:'next',
      clientId:row.client_id,name:basic?.client_name || '이름없음',phone:basic?.client_phone || '-',birthDate:basic?.birth_date || null,
      sessionNo:row.session_no ? Number(row.session_no)+1 : null,
      location:row.counseling_location || '-',sessionStatus:row.session_status || '-',
      counselLabel:source==='psych'?'심리상담':'진로상담'
    };
  }

  function normalizedSessionStatus(v){
    return String(v || '').replace(/\s+/g,'').trim();
  }

  function eventDisplayStatus(ev){
    if(ev.kind==='receipt') return '접수완료';
    if(ev.kind==='next') return '차기예약';

    const sessionStatus=normalizedSessionStatus(ev.sessionStatus);
    const isCounselClosed=sessionStatus==='종결' || sessionStatus==='상담종료';

    if(ev.status==='done'){
      if(isCounselClosed) return '상담종료';
      if(ev.sessionNo) return `${ev.sessionNo}회기 종료`;
      return '상담종료';
    }

    if(ev.status==='missed'){
      if(ev.sessionNo) return `${ev.sessionNo}회기 미실시`;
      return '상담미실시';
    }

    if(ev.status==='planned'){
      return ev.date===todayYmd() ? '금일예정' : '예정';
    }

    return statusMeta(ev.status).label;
  }

  function eventIdentity(ev){
    if(ev.clientId!=null && String(ev.clientId)!=='') return `client:${ev.clientId}`;
    return `fallback:${ev.name}|${ev.phone}`;
  }

  function primaryEventQuality(ev){
    // 동일 회원·동일 시각 중복 시 실제 완료 기록을 최우선으로 남긴다.
    const statusScore={done:300,planned:200,missed:100}[ev.status] || 0;
    const finalScore=(normalizedSessionStatus(ev.sessionStatus)==='종결' || normalizedSessionStatus(ev.sessionStatus)==='상담종료') ? 40 : 0;
    const sessionScore=ev.sessionNo ? 10 : 0;
    const endScore=ev.hasSessionEnd ? 5 : 0;
    return statusScore+finalScore+sessionScore+endScore;
  }

  function dedupePrimaryEvents(items){
    const result=[];
    const indexByKey=new Map();

    for(const ev of items){
      if(ev.kind!=='primary'){
        result.push(ev);
        continue;
      }

      // 핵심 중복키: 동일 회원 + 동일 상담 일시.
      // 상담구분이 바뀌어 psych/career 양쪽에 같은 시간이 남아도 한 일정으로 계산한다.
      const key=`primary|${eventIdentity(ev)}|${ev.sortMs}`;
      const oldIndex=indexByKey.get(key);

      if(oldIndex===undefined){
        indexByKey.set(key,result.length);
        result.push(ev);
        continue;
      }

      const current=result[oldIndex];
      if(primaryEventQuality(ev)>primaryEventQuality(current)){
        result[oldIndex]=ev;
      }
    }

    return result;
  }

  async function loadMonth(y,m){
    showLoading(true);
    try{
      const bundle=await secureScheduleMonth(y,m);
      const psych=bundle.psych;
      const career=bundle.career;
      const monthStart=ymd(y,m,1), monthEnd=monthDateBounds(y,m).end;
      const events=[];

      /*
        접수 중복 방지
        - 동일 상담구분(source) + 동일 회원(client_id) + 동일 접수일시(receipt_at)는 1건만 표시한다.
        - 상담 회기(primary)와 차기예약(next)은 기존대로 각각 유지한다.
        - DB 데이터는 수정하지 않고, 이 조회 화면에서만 중복 표시를 제거한다.
      */
      const receiptEventKeys=new Set();
      function pushReceiptOnce(source,row,event){
        if(!event) return;
        const receiptMs=row?.receipt_at ? new Date(row.receipt_at).getTime() : NaN;
        const receiptKey=[
          source,
          row?.client_id ?? '',
          Number.isFinite(receiptMs) ? receiptMs : String(row?.receipt_at || '')
        ].join('|');

        if(receiptEventKeys.has(receiptKey)) return;
        receiptEventKeys.add(receiptKey);
        events.push(event);
      }

      /*
        서버에서 각 상담행에 basic 객체를 함께 반환한다.
        개인정보는 서버에서 암호화 컬럼을 복호화한 값이며,
        브라우저는 DB_basic을 직접 조회하지 않는다.
      */
      for(const r of psych){
        if(r.record_active !== true && !r.session_end_at) continue;
        const b=r.basic||null;
        const receipt=buildReceiptEvent('psych',r,b);
        const primary=buildPrimaryEvent('psych',r,b,r.session_start_at || r.visit_at);
        const next=buildNextEvent('psych',r,b);

        if(receipt && receipt.date>=monthStart && receipt.date<monthEnd) pushReceiptOnce('psych',r,receipt);
        if(primary && primary.date>=monthStart && primary.date<monthEnd) events.push(primary);
        if(next && next.date>=monthStart && next.date<monthEnd) events.push(next);
      }

      for(const r of career){
        if(r.record_active !== true && !r.session_end_at) continue;
        const b=r.basic||null;
        const receipt=buildReceiptEvent('career',r,b);
        const primary=buildPrimaryEvent('career',r,b,r.session_start_at || r.appointment_at);
        const next=buildNextEvent('career',r,b);

        if(receipt && receipt.date>=monthStart && receipt.date<monthEnd) pushReceiptOnce('career',r,receipt);
        if(primary && primary.date>=monthStart && primary.date<monthEnd) events.push(primary);
        if(next && next.date>=monthStart && next.date<monthEnd) events.push(next);
      }

      const normalizedEvents=dedupePrimaryEvents(events);
      normalizedEvents.sort((a,b)=>a.date.localeCompare(b.date)||a.sortMs-b.sortMs||a.name.localeCompare(b.name,'ko'));
      state.events=normalizedEvents;
      state.byDate=new Map();

      for(const ev of normalizedEvents){
        if(!state.byDate.has(ev.date)) state.byDate.set(ev.date,[]);
        state.byDate.get(ev.date).push(ev);
      }

      renderAll();
    }catch(err){
      console.error('스케줄 보안 조회 오류:',err);
      state.events=[];
      state.byDate=new Map();
      renderAll();
      toast('스케줄 조회 중 오류가 발생했습니다. 로그인 상태와 서버 연결을 확인해 주세요.');
    }finally{
      showLoading(false);
    }
  }

  function monthGridCells(y,m){
    const first=new Date(Date.UTC(y,m-1,1));
    const firstWeekday=first.getUTCDay();
    const daysInMonth=new Date(Date.UTC(y,m,0)).getUTCDate();
    const weekCount=Math.ceil((firstWeekday+daysInMonth)/7);
    const gridStart=new Date(Date.UTC(y,m-1,1-firstWeekday));
    const cells=[];
    const totalCells=weekCount*7;

    for(let i=0;i<totalCells;i++){
      const d=new Date(gridStart.getTime()+i*86400000);
      const yy=d.getUTCFullYear(), mm=d.getUTCMonth()+1, dd=d.getUTCDate();
      cells.push({y:yy,m:mm,d:dd,key:ymd(yy,mm,dd),other:mm!==m,weekday:d.getUTCDay()});
    }

    return {cells,weekCount};
  }

  function renderCalendar(){
    els.monthLabel.textContent=`${state.viewYear}년 ${state.viewMonth}월`;
    els.calGrid.textContent='';
    const today=todayYmd();
    const calendarData=monthGridCells(state.viewYear,state.viewMonth);
    els.calGrid.style.gridTemplateRows=`repeat(${calendarData.weekCount},minmax(0,1fr))`;

    for(const c of calendarData.cells){
      const holidayName=getHolidayName(c.key);
      const cell=document.createElement('div');
      cell.className=`day-cell${c.other?' other':''}${c.weekday===0?' sun':''}${c.weekday===6?' sat':''}${holidayName?' holiday':''}${c.key===today?' today':''}${c.key===state.selectedDate?' selected':''}`;
      cell.dataset.date=c.key;

      const headline=document.createElement('div'); headline.className='day-headline';
      const num=document.createElement('div'); num.className='day-num'; num.textContent=c.d; headline.appendChild(num);
      if(holidayName){
        const holiday=document.createElement('div');
        holiday.className='holiday-name';
        holiday.textContent=holidayName;
        holiday.title=holidayName;
        headline.appendChild(holiday);
      }
      cell.appendChild(headline);

      const holder=document.createElement('div'); holder.className='day-events';
      const events=(state.byDate.get(c.key)||[]).slice().sort((a,b)=>a.sortMs-b.sortMs);
      events.slice(0,MAX_CELL_ITEMS).forEach(ev=>{
        const meta=statusMeta(ev.status);
        const row=document.createElement('div');
        row.className=`day-event ${meta.cls}`;
        row.title=`${ev.name}-${ev.time}-${eventDisplayStatus(ev)}`;
        const text=document.createElement('span');
        text.className='event-text';
        text.textContent=`${ev.name}-${ev.time}-${eventDisplayStatus(ev)}`;
        row.appendChild(text);
        holder.appendChild(row);
      });
      if(events.length>MAX_CELL_ITEMS){ const more=document.createElement('div'); more.className='more-event'; more.textContent=`+${events.length-MAX_CELL_ITEMS}건 더보기`; holder.appendChild(more); }
      cell.appendChild(holder);
      cell.addEventListener('click',()=>selectDate(c.key,c.y,c.m));
      els.calGrid.appendChild(cell);
    }
  }

  function countStatuses(items){
    const c={received:0,planned:0,done:0,missed:0,next:0,total:0};
    items.forEach(x=>{
      if(['received','planned','done','missed','next'].includes(x.status)) c[x.status]++;
    });
    c.total=c.received+c.planned+c.done+c.missed+c.next;
    return c;
  }

  function renderSummary(){
    // 하단 KPI = Supabase에서 현재 조회 월로 불러온 실제 일정(state.events)을 직접 집계
    // 접수완료/예정/종료/미실시/차기예약의 합계가 총 일정이 된다.
    const monthCount=countStatuses(state.events);

    els.sumReceived.textContent=`${monthCount.received}건`;
    els.sumPlanned.textContent=`${monthCount.planned}건`;
    els.sumDone.textContent=`${monthCount.done}건`;
    els.sumMissed.textContent=`${monthCount.missed}건`;
    els.sumNext.textContent=`${monthCount.next}건`;
    els.sumTotal.textContent=`${monthCount.total}건`;

    // 우측 타임라인 = 현재 선택된 날짜 기준
    const selectedItems=state.byDate.get(state.selectedDate)||[];
    const uniqueClients=new Set(selectedItems.map(eventIdentity));
    els.timelineDate.textContent=formatKoreanDate(state.selectedDate);
    els.timelineTotal.textContent=`총 ${uniqueClients.size}명`;

  }

  function syncSelectedDateFromTimeline(date){

  function calculateAge(birthDate,refDate){
    if(!birthDate||!refDate) return null; const b=dateOnlyParts(birthDate), r=dateOnlyParts(refDate); if(!b.y||!r.y) return null;
    let age=r.y-b.y; if(r.m<b.m || (r.m===b.m && r.d<b.d)) age--; return age>=0?age:null;
  }

  function shortDate(dateStr){
    const p=dateOnlyParts(String(dateStr||'').slice(0,10));
    return p.y?`${p.m}/${p.d}`:'-';
  }

  function isoShortDate(iso){
    const key=isoToDateKey(iso);
    return key?shortDate(key):'-';
  }

  function uniqueBy(items,keyFn){
    const out=[],seen=new Set();
    for(const item of items){
      const key=keyFn(item);
      if(seen.has(key)) continue;
      seen.add(key); out.push(item);
    }
    return out;
  }

  async function loadMemberHistoryForEvent(ev){
    const cacheKey=`${ev.source}|${ev.clientId}`;
    if(state.historyCache.has(cacheKey)) return state.historyCache.get(cacheKey);
    if(!ev.recordId) throw new Error('상담기록 ID가 없습니다.');
    const data=await secureConsultationRecord(ev.recordId,ev.source);
    state.historyCache.set(cacheKey,data);
    return data;
  }

  function summarizeHistory(bundle,source,refDate){
    const basic=bundle?.basic||{};
    const type=source==='psych'?'PC':'CC';
    const rows=Array.isArray(bundle?.[type])?bundle[type]:[];
    const activeRows=rows.filter(r=>r?.record_active===true || r?.session_end_at);

    const receiptDates=uniqueBy(
      activeRows.filter(r=>r?.receipt_at).map(r=>isoToDateKey(r.receipt_at)).filter(Boolean).sort(),
      x=>x
    );

    const completed=activeRows
      .filter(r=>r?.session_end_at && Number(r?.session_no)>0)
      .map(r=>({no:Number(r.session_no),date:isoToDateKey(r.session_end_at)}))
      .filter(x=>x.date)
      .sort((a,b)=>a.no-b.no || a.date.localeCompare(b.date));
    const completedUnique=uniqueBy(completed,x=>`${x.no}|${x.date}`);

    const completedParts=[];
    if(receiptDates.length) completedParts.push(`접수(${shortDate(receiptDates[0])})`);
    for(const x of completedUnique) completedParts.push(`${x.no}회기(${shortDate(x.date)})`);

    let latestNext=null;
    for(const r of activeRows){
      const raw=r?.next_session_at || r?.next_session_date;
      if(!raw) continue;
      const date=r?.next_session_at?isoToDateKey(r.next_session_at):String(r.next_session_date).slice(0,10);
      if(!date) continue;
      const ms=r?.next_session_at?new Date(r.next_session_at).getTime():Date.parse(`${date}T00:00:00+09:00`);
      if(!latestNext || ms>latestNext.ms) latestNext={date,ms};
    }

    const maxCompleted=completedUnique.reduce((m,x)=>Math.max(m,x.no),0);
    const plannedParts=[];
    if(latestNext){
      plannedParts.push(`${maxCompleted+1}회기 예정(${shortDate(latestNext.date)})`);
    }else{
      const future=activeRows
        .map(r=>({
          no:Number(r?.session_no)||null,
          iso:r?.session_start_at || (source==='psych'?r?.visit_at:r?.appointment_at)
        }))
        .filter(x=>x.iso && new Date(x.iso).getTime()>Date.now())
        .sort((a,b)=>new Date(a.iso)-new Date(b.iso))[0];
      if(future){ plannedParts.push(`${future.no||maxCompleted+1}회기 예정(${isoShortDate(future.iso)})`); }
    }

    return {
      name:basic.client_name||'이름없음',
      age:calculateAge(basic.birth_date,refDate),
      memberKey:basic.member_key||'-',
      counselLabel:source==='psych'?'심리상담':'진로상담',
      completedText:completedParts.length?completedParts.join(' - '):'없음',
      plannedText:plannedParts.length?plannedParts.join(' - '):'없음'
    };
  }

  function createDayDetailCard(summary){
    const card=document.createElement('div'); card.className='day-detail-card';
    const title=document.createElement('div'); title.className='day-detail-title';
    title.textContent=`${summary.name}${summary.age==null?'':` (${summary.age}세)`} - ${summary.counselLabel} - ${summary.memberKey}`;

    const complete=document.createElement('div'); complete.className='day-detail-row complete';
    const cl=document.createElement('span'); cl.className='label'; cl.textContent='완료';
    const cv=document.createElement('span'); cv.className='value'; cv.textContent=summary.completedText;
    complete.append(cl,cv);

    const plan=document.createElement('div'); plan.className='day-detail-row plan';
    const pl=document.createElement('span'); pl.className='label'; pl.textContent='예정';
    const pv=document.createElement('span'); pv.className='value'; pv.textContent=summary.plannedText;
    plan.append(pl,pv);

    card.append(title,complete,plan);
    return card;
  }

  async function renderTimeline(){
    const requestSeq=++state.detailRequestSeq;
    els.timelineScroll.textContent='';
    const selected=(state.byDate.get(state.selectedDate)||[]).slice().sort((a,b)=>a.sortMs-b.sortMs||a.name.localeCompare(b.name,'ko'));
    if(!selected.length){
      const empty=document.createElement('div'); empty.className='day-detail-empty'; empty.textContent='선택한 날짜에 등록된 상담 일정이 없습니다.';
      els.timelineScroll.appendChild(empty); return;
    }

    const loading=document.createElement('div'); loading.className='day-detail-loading'; loading.textContent='상담 진행정보를 불러오는 중입니다...';
    els.timelineScroll.appendChild(loading);

    const representatives=[];
    const seen=new Set();
    for(const ev of selected){
      const key=`${ev.source}|${eventIdentity(ev)}`;
      if(seen.has(key)) continue;
      seen.add(key); representatives.push(ev);
    }

    try{
      const summaries=await Promise.all(representatives.map(async ev=>{
        const bundle=await loadMemberHistoryForEvent(ev);
        return summarizeHistory(bundle,ev.source,state.selectedDate);
      }));
      if(requestSeq!==state.detailRequestSeq) return;
      els.timelineScroll.textContent='';
      const list=document.createElement('div'); list.className='day-detail-list';
      summaries.forEach(x=>list.appendChild(createDayDetailCard(x)));
      els.timelineScroll.appendChild(list);
    }catch(err){
      console.error('선택일 상담 진행정보 조회 오류:',err);
      if(requestSeq!==state.detailRequestSeq) return;
      els.timelineScroll.textContent='';
      const empty=document.createElement('div'); empty.className='day-detail-empty'; empty.textContent='상담 진행정보를 불러오지 못했습니다.';
      els.timelineScroll.appendChild(empty);
      toast('선택일 상담 진행정보 조회 중 오류가 발생했습니다.');
    }
  }

  function scrollTimelineToDate(){ /* 선택일 상세형 화면에서는 사용하지 않음 */ }
  function detectTimelineDate(){ /* 선택일 상세형 화면에서는 사용하지 않음 */ }
  function onTimelineScroll(){ /* 선택일 상세형 화면에서는 사용하지 않음 */ }

  function renderAll(){
    renderCalendar();
    renderSummary();
    renderTimeline();
  }

  function selectDate(date,y,m){
    if(y!==state.viewYear || m!==state.viewMonth){
      state.viewYear=y;
      state.viewMonth=m;
      state.selectedDate=date;
      loadMonth(y,m);
      return;
    }
    state.selectedDate=date;
    renderCalendarSelectionOnly();
    renderSummary();
    renderTimeline();
  }

  function goMonth(delta){
    let y=state.viewYear,m=state.viewMonth+delta; if(m<1){y--;m=12}else if(m>12){y++;m=1}
    state.viewYear=y; state.viewMonth=m;
    const today=todayYmd(), t=dateOnlyParts(today);
    state.selectedDate=(t.y===y&&t.m===m)?today:ymd(y,m,1);
    loadMonth(y,m);
  }

  function resetIdle(){ clearTimeout(state.idleTimer); state.idleTimer=setTimeout(async()=>{ try{await sb.auth.signOut();}catch{} alert('10분 동안 사용이 없어 자동 로그아웃되었습니다.'); location.href='index.html'; },IDLE_MS); }
  ['click','keydown','mousemove','scroll','touchstart'].forEach(evt=>document.addEventListener(evt,resetIdle,{passive:true}));


  document.getElementById('prevBtn').addEventListener('click',()=>goMonth(-1));
  document.getElementById('nextBtn').addEventListener('click',()=>goMonth(1));
  document.getElementById('todayBtn').addEventListener('click',()=>{ const t=kstNowDate(); state.viewYear=t.getUTCFullYear(); state.viewMonth=t.getUTCMonth()+1; state.selectedDate=todayYmd(); loadMonth(state.viewYear,state.viewMonth); });
  document.getElementById('backBtn').addEventListener('click',()=>history.length>1?history.back():location.assign('index.html'));
  document.getElementById('logoutBtn').addEventListener('click',async()=>{ if(!confirm('로그아웃 하시겠습니까?')) return; await sb.auth.signOut(); location.href='index.html'; });

  async function init(){
    const ok=await getEmployee(); if(!ok) return;
    const t=kstNowDate(); state.viewYear=t.getUTCFullYear(); state.viewMonth=t.getUTCMonth()+1; state.selectedDate=todayYmd(); resetIdle(); await loadMonth(state.viewYear,state.viewMonth);
  }

  init();
})();
</script>
