<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>구인공고 검색</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;background:#f4f6f8;color:#1f2937;font-family:"Malgun Gothic","Noto Sans KR",Arial,sans-serif;font-size:14px}
    .wrap{max-width:1320px;margin:0 auto;padding:22px 18px 34px}
    .card{background:#fff;border:1px solid #d9dee5;border-radius:10px;padding:18px;margin-bottom:14px;box-shadow:0 2px 8px rgba(15,23,42,.035)}
    h1{margin:0;font-size:21px;letter-spacing:-.4px}
    h2{margin:0;font-size:16px}
    .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}
    .back{height:32px;padding:0 11px;border:1px solid #bfc9d5;border-radius:6px;background:#fff;color:#334155;font-size:13px;font-weight:700;cursor:pointer}
    .search-grid{display:grid;grid-template-columns:1fr 1fr 1.2fr auto;gap:10px;align-items:end}
    label{display:block;margin-bottom:5px;font-size:13px;font-weight:800;color:#344154}
    input,select{width:100%;height:36px;border:1px solid #cbd5e1;border-radius:6px;padding:0 10px;background:#fffde8;color:#1f2937;font-size:14px}
    .buttons{display:flex;gap:6px}
    button.primary,button.secondary{height:36px;padding:0 14px;border-radius:6px;font-size:14px;font-weight:800;cursor:pointer;white-space:nowrap}
    button.primary{border:1px solid #1f2937;background:#1f2937;color:#fff}
    button.secondary{border:1px solid #bfc9d5;background:#fff;color:#334155}
    .result-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
    .status{font-size:13px;color:#64748b}
    .guide{margin:0 0 14px;padding:11px 13px;border:1px solid #cfe0f7;border-radius:7px;background:#f6faff;color:#365475;font-size:13px;line-height:1.55}
    .empty{padding:34px 12px;text-align:center;color:#64748b;font-size:14px}
    .table-wrap{overflow-x:auto;border:1px solid #d9e0e8;border-radius:7px}
    table{width:100%;min-width:860px;border-collapse:collapse}
    th,td{padding:11px 10px;border-bottom:1px solid #e4e9ef;text-align:left;vertical-align:top;line-height:1.45}
    th{background:#f7f9fb;color:#334155;font-size:13px;white-space:nowrap}
    td.num{width:48px;text-align:center}td.source{width:110px;color:#475569;word-break:break-all}td.link{width:90px;white-space:nowrap}td.summary{color:#475569;min-width:280px}
    .title{font-weight:800;color:#172554;text-decoration:none}.open-link{color:#1d4ed8;text-decoration:none;font-weight:700}
    .notice{margin:12px 0 0;color:#64748b;font-size:12px;line-height:1.65}
    @media (max-width:900px){.search-grid{grid-template-columns:1fr 1fr}.buttons{grid-column:1 / -1;justify-content:flex-end}}
    @media (max-width:560px){.wrap{padding:14px 10px}.card{padding:14px}.search-grid{grid-template-columns:1fr}.buttons{grid-column:auto}.head{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body>
  <main class="wrap">
    <section class="card">
      <div class="head">
        <h1>구인공고 검색</h1>
        <button class="back" type="button" onclick="window.close()">닫기</button>
      </div>
      <div class="search-grid">
        <div>
          <label for="industry">업종</label>
          <input id="industry" type="text" placeholder="예: 제조업">
        </div>
        <div>
          <label for="region">지역</label>
          <select id="region"><option value="">전체</option><option>경남</option><option>부산</option><option>울산</option></select>
        </div>
        <div>
          <label for="keyword">직무·자격 키워드</label>
          <input id="keyword" type="text" placeholder="예: 전기, 자동화설비">
        </div>
        <div class="buttons">
          <button class="secondary" type="button" id="resetBtn">초기화</button>
          <button class="primary" type="button" id="searchBtn">검색</button>
        </div>
      </div>
    </section>

    <section class="card">
      <div class="result-head">
        <h2>검색 결과</h2>
        <span class="status" id="searchStatus">검색조건을 입력하고 검색하세요.</span>
      </div>
      <p class="guide">검색 결과는 제목·간단한 설명·원문 링크만 표로 표시합니다. 공고 내용을 수집하거나 DB·파일에 저장하지 않습니다.</p>
      <div id="emptyState" class="empty">아직 검색 결과가 없습니다.</div>
      <div id="resultTable" class="table-wrap" hidden>
        <table>
          <thead><tr><th>번호</th><th>공고명</th><th>출처</th><th>요약</th><th>원문 링크</th></tr></thead>
          <tbody id="resultBody"></tbody>
        </table>
      </div>
      <p class="notice">※ 업종·지역·직무·자격 키워드를 Google 검색어에 반영합니다. 실제 게시일·마감일·채용조건은 원문 공고에서 직접 확인하세요.</p>
    </section>
  </main>
  <script>
    const SEARCH_API_URL = 'https://YOUR-WORKER.workers.dev/search';
    const industry = document.getElementById('industry');
    const region = document.getElementById('region');
    const keyword = document.getElementById('keyword');
    const searchStatus = document.getElementById('searchStatus');
    const emptyState = document.getElementById('emptyState');
    const resultTable = document.getElementById('resultTable');
    const resultBody = document.getElementById('resultBody');
    const searchBtn = document.getElementById('searchBtn');
    function buildQuery(){
      const terms = [region.value, industry.value.trim(), keyword.value.trim(), '채용'].filter(Boolean);
      return terms.join(' ');
    }
    function addCell(row,className,value){const cell=document.createElement('td');cell.className=className;cell.textContent=String(value||'');row.appendChild(cell);return cell;}
    function renderResults(items){
      resultBody.replaceChildren();
      items.forEach((item,index)=>{
        const row=document.createElement('tr');
        addCell(row,'num',index+1);
        const titleCell=document.createElement('td'),title=document.createElement('a');
        title.className='title';title.href=item.link;title.target='_blank';title.rel='noopener noreferrer';title.textContent=item.title||'';titleCell.appendChild(title);row.appendChild(titleCell);
        addCell(row,'source',item.displayLink);addCell(row,'summary',item.snippet);
        const linkCell=document.createElement('td');linkCell.className='link';const link=document.createElement('a');link.className='open-link';link.href=item.link;link.target='_blank';link.rel='noopener noreferrer';link.textContent='공고 열기';linkCell.appendChild(link);row.appendChild(linkCell);resultBody.appendChild(row);
      });
    }
    async function executeSearch(){
      const query = buildQuery();
      if (!query || query === '채용'){searchStatus.textContent='지역·업종·직무·자격 중 한 항목을 입력하세요.';return;}
      searchBtn.disabled=true;searchStatus.textContent='검색 중';
      try{
        const response=await fetch(SEARCH_API_URL+'?q='+encodeURIComponent(query));
        const data=await response.json();
        if(!response.ok)throw new Error(data.message||'검색 요청에 실패했습니다.');
        renderResults(data.items||[]);emptyState.hidden=true;resultTable.hidden=false;searchStatus.textContent='검색어: '+query+' · '+(data.items||[]).length+'건';
      }catch(error){resultTable.hidden=true;emptyState.hidden=false;emptyState.textContent=error.message;searchStatus.textContent='검색 실패';}
      finally{searchBtn.disabled=false;}
    }
    document.getElementById('searchBtn').addEventListener('click',executeSearch);
    document.getElementById('resetBtn').addEventListener('click',() => {industry.value='';region.value='';keyword.value='';resultBody.replaceChildren();resultTable.hidden=true;emptyState.hidden=false;emptyState.textContent='아직 검색 결과가 없습니다.';searchStatus.textContent='검색조건을 입력하고 검색하세요.';});
    keyword.addEventListener('keydown',event=>{if(event.key==='Enter') executeSearch();});
  </script>
</body>
</html>
