<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>회원 가입 등록 - 마음:시나브로심리상담연구소</title>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{
      --line:#b8b8b8;
      --soft:#f5f7f8;
      --label:#f0f2f3;
      --text:#202428;
      --muted:#687078;
      --primary:#294d46;
      --danger:#c0392b;
      --input:#fff9d9;
    }
    html,body{margin:0;padding:0}
    body{
      font-family:"Malgun Gothic","맑은 고딕","Apple SD Gothic Neo",sans-serif;
      color:var(--text);
      background:#eef1f3;
      padding:14px 0;
      font-size:12.5px;
      line-height:1.35;
    }
    .page{
      position:relative;
      width:210mm;
      min-height:297mm;
      margin:0 auto;
      padding:10mm;
      background:#fff;
      border:1px solid #cfcfcf;
      box-shadow:0 2px 10px rgba(0,0,0,.08);
      overflow:hidden;
    }
    .top-actions{
      position:absolute;
      top:6mm;
      right:10mm;
      z-index:5;
    }
    .pdf-btn{
      min-width:104px;
      padding:7px 13px;
      border:0;
      border-radius:4px;
      background:var(--primary);
      color:#fff;
      font-size:12px;
      font-weight:700;
      cursor:pointer;
    }
    .doc-header{text-align:center;margin-bottom:10px}
    .brand{font-size:10.5px;color:var(--muted);text-align:right;margin-bottom:2px}
    h1{font-size:24px;letter-spacing:2px;line-height:1.15;margin:0 0 2px}
    .subtitle{font-size:11px;color:var(--muted)}

    .type-box{
      border:1px solid var(--line);
      background:var(--soft);
      min-height:38px;
      padding:7px 10px;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:22px;
      flex-wrap:wrap;
      margin-bottom:10px;
    }
    .type-box strong{font-size:13px}
    .type-box label,
    .service-box label{cursor:pointer;white-space:nowrap}
    input[type="radio"],input[type="checkbox"]{
      margin-right:5px;
      vertical-align:middle;
      accent-color:var(--primary);
    }
    .required{color:var(--danger)}

    .form-panel{display:none}
    .form-panel.active{display:block}
    .section-title{
      font-size:14px;
      font-weight:700;
      margin:8px 0 5px;
      padding-left:8px;
      border-left:4px solid var(--primary);
    }
    table{
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
    }
    td{
      border:1px solid var(--line);
      padding:5px 7px;
      vertical-align:middle;
    }
    .label{
      width:118px;
      background:var(--label);
      font-weight:700;
      text-align:center;
      white-space:nowrap;
    }
    input[type="text"],
    input[type="tel"],
    input[type="email"],
    input[type="date"],
    select,
    textarea{
      width:100%;
      min-height:30px;
      border:1px solid #c9c9c9;
      border-radius:2px;
      background:var(--input);
      padding:4px 6px;
      font:inherit;
      color:var(--text);
      outline:none;
    }
    input:focus,select:focus,textarea:focus{
      border-color:var(--primary);
      box-shadow:0 0 0 2px rgba(41,77,70,.08);
    }
    textarea{
      height:52px;
      min-height:52px;
      resize:none;
    }
    .service-box{
      display:flex;
      align-items:center;
      gap:15px;
      flex-wrap:wrap;
      min-height:30px;
    }
    .service-box label{font-size:12px}

    @media(max-width:720px){
      body{background:#fff;padding:0}
      .page{width:100%;min-height:auto;border:0;box-shadow:none;padding:18px 12px}
      .top-actions{position:static;text-align:right;margin-bottom:8px}
      .doc-header{margin-bottom:8px}
      h1{font-size:22px}
      .type-box{justify-content:flex-start;gap:12px 18px}
      table,tbody,tr,td{display:block;width:100%!important}
      tr{border:1px solid var(--line);margin-bottom:7px}
      td{border:0;border-bottom:1px solid #ddd}
      tr>td:last-child{border-bottom:0}
      .label{text-align:left}
      .service-box{gap:10px 14px}
    }

    @page{size:A4 portrait;margin:0}
    @media print{
      html,body{width:210mm;height:297mm;background:#fff!important}
      body{padding:0}
      .page{
        width:210mm!important;
        min-height:297mm!important;
        margin:0!important;
        padding:10mm!important;
        border:0!important;
        box-shadow:none!important;
      }
      .top-actions{display:none!important}
      input,select,textarea{
        -webkit-print-color-adjust:exact;
        print-color-adjust:exact;
      }
    }
  </style>
</head>
<body>
  <main class="page type-company" id="pageShell">
    <div class="top-actions">
      <button type="button" class="pdf-btn" id="pdfBtn">PDF 저장</button>
    </div>

    <div class="doc-header">
      <div class="brand">마음:시나브로심리상담연구소</div>
      <h1>회원 가입 등록</h1>
      <div class="subtitle">Membership Registration</div>
    </div>

    <form id="membershipForm" novalidate>
      <div class="type-box">
        <strong>회원 유형 <span class="required">*</span></strong>
        <label><input type="radio" name="memberType" value="institution"> 기관</label>
        <label><input type="radio" name="memberType" value="company"> 기업체 대표</label>
        <label><input type="radio" name="memberType" value="domestic"> 내국인</label>
        <label><input type="radio" name="memberType" value="foreigner"> 외국인</label>
      </div>

      <!-- 기관 / 기업체 대표 공용 양식 -->
      <section id="companyForm" class="form-panel active" data-types="institution company">
        <div class="section-title" id="companySectionTitle">기관 / 기업체 대표 회원정보</div>
        <table>
          <tr>
            <td class="label">회사명 <span class="required">*</span></td>
            <td><input type="text" name="company_name"></td>
            <td class="label">대표자명 <span class="required">*</span></td>
            <td><input type="text" name="company_ceo"></td>
          </tr>
          <tr>
            <td class="label">사업자등록번호</td>
            <td><input type="text" name="business_no"></td>
            <td class="label">업종</td>
            <td><input type="text" name="business_type"></td>
          </tr>
          <tr>
            <td class="label">담당자명</td>
            <td><input type="text" name="manager_name"></td>
            <td class="label">직책</td>
            <td><input type="text" name="manager_position"></td>
          </tr>
          <tr>
            <td class="label">연락처 <span class="required">*</span></td>
            <td><input type="tel" name="company_phone"></td>
            <td class="label">이메일 <span class="required">*</span></td>
            <td><input type="email" name="company_email"></td>
          </tr>
          <tr>
            <td class="label">회사 주소</td>
            <td colspan="3"><input type="text" name="company_address"></td>
          </tr>
          <tr>
            <td class="label">희망 서비스</td>
            <td colspan="3">
              <div class="service-box">
                <label><input type="checkbox" name="company_service" value="심리상담"> 심리상담</label>
                <label><input type="checkbox" name="company_service" value="진로상담"> 진로상담</label>
                <label><input type="checkbox" name="company_service" value="기업상담"> 기업상담</label>
                <label><input type="checkbox" name="company_service" value="취업정보"> 취업정보</label>
                <label><input type="checkbox" name="company_service" value="교육"> 교육</label>
                <label><input type="checkbox" name="company_service" value="기타"> 기타</label>
              </div>
            </td>
          </tr>
          <tr>
            <td class="label">요청사항</td>
            <td colspan="3"><textarea name="company_note"></textarea></td>
          </tr>
          <tr>
            <td class="label">가입일</td>
            <td colspan="3"><input type="date" name="company_join_date"></td>
          </tr>
        </table>
      </section>

      <!-- 내국인 -->
      <section id="domesticForm" class="form-panel" data-types="domestic">
        <div class="section-title">내국인 회원정보</div>
        <table>
          <tr>
            <td class="label">성명 <span class="required">*</span></td>
            <td><input type="text" name="domestic_name"></td>
            <td class="label">생년월일 <span class="required">*</span></td>
            <td><input type="text" name="domestic_birth"></td>
          </tr>
          <tr>
            <td class="label">성별</td>
            <td>
              <select name="domestic_gender">
                <option value=""></option>
                <option>남성</option>
                <option>여성</option>
                <option>기타</option>
              </select>
            </td>
            <td class="label">연락처 <span class="required">*</span></td>
            <td><input type="tel" name="domestic_phone"></td>
          </tr>
          <tr>
            <td class="label">이메일</td>
            <td><input type="email" name="domestic_email"></td>
            <td class="label">직업</td>
            <td><input type="text" name="domestic_job"></td>
          </tr>
          <tr>
            <td class="label">주소</td>
            <td colspan="3"><input type="text" name="domestic_address"></td>
          </tr>
          <tr>
            <td class="label">희망 서비스</td>
            <td colspan="3">
              <div class="service-box">
                <label><input type="checkbox" name="domestic_service" value="심리상담"> 심리상담</label>
                <label><input type="checkbox" name="domestic_service" value="진로상담"> 진로상담</label>
                <label><input type="checkbox" name="domestic_service" value="기업상담"> 기업상담</label>
                <label><input type="checkbox" name="domestic_service" value="취업정보"> 취업정보</label>
                <label><input type="checkbox" name="domestic_service" value="교육"> 교육</label>
                <label><input type="checkbox" name="domestic_service" value="기타"> 기타</label>
              </div>
            </td>
          </tr>
          <tr>
            <td class="label">특이사항</td>
            <td colspan="3"><textarea name="domestic_note"></textarea></td>
          </tr>
          <tr>
            <td class="label">가입일</td>
            <td colspan="3"><input type="date" name="domestic_join_date"></td>
          </tr>
        </table>
      </section>

      <!-- 외국인 -->
      <section id="foreignerForm" class="form-panel" data-types="foreigner">
        <div class="section-title">외국인 회원정보</div>
        <table>
          <tr>
            <td class="label">이름 <span class="required">*</span></td>
            <td><input type="text" name="foreigner_name"></td>
            <td class="label">영문이름 <span class="required">*</span></td>
            <td><input type="text" name="foreigner_english_name"></td>
          </tr>
          <tr>
            <td class="label">국적 <span class="required">*</span></td>
            <td><input type="text" name="nationality"></td>
            <td class="label">생년월일 <span class="required">*</span></td>
            <td><input type="text" name="foreigner_birth"></td>
          </tr>
          <tr>
            <td class="label">성별</td>
            <td>
              <select name="foreigner_gender">
                <option value=""></option>
                <option>남성</option>
                <option>여성</option>
                <option>기타</option>
              </select>
            </td>
            <td class="label">연락처 <span class="required">*</span></td>
            <td><input type="tel" name="foreigner_phone"></td>
          </tr>
          <tr>
            <td class="label">이메일</td>
            <td><input type="email" name="foreigner_email"></td>
            <td class="label">비자</td>
            <td><input type="text" name="visa"></td>
          </tr>
          <tr>
            <td class="label">입국일</td>
            <td><input type="text" name="entry_date"></td>
            <td class="label">출국예정일</td>
            <td><input type="text" name="departure_date"></td>
          </tr>
          <tr>
            <td class="label">직업</td>
            <td><input type="text" name="foreigner_job"></td>
            <td class="label">주요경력</td>
            <td><input type="text" name="career_summary" maxlength="30"></td>
          </tr>
          <tr>
            <td class="label">주소</td>
            <td colspan="3"><input type="text" name="foreigner_address"></td>
          </tr>
          <tr>
            <td class="label">희망 서비스</td>
            <td colspan="3">
              <div class="service-box">
                <label><input type="checkbox" name="foreigner_service" value="심리상담"> 심리상담</label>
                <label><input type="checkbox" name="foreigner_service" value="진로상담"> 진로상담</label>
                <label><input type="checkbox" name="foreigner_service" value="기업상담"> 기업상담</label>
                <label><input type="checkbox" name="foreigner_service" value="취업정보"> 취업정보</label>
                <label><input type="checkbox" name="foreigner_service" value="교육"> 교육</label>
                <label><input type="checkbox" name="foreigner_service" value="기타"> 기타</label>
              </div>
            </td>
          </tr>
          <tr>
            <td class="label">특이사항</td>
            <td colspan="3"><textarea name="foreigner_note"></textarea></td>
          </tr>
          <tr>
            <td class="label">가입일</td>
            <td colspan="3"><input type="date" name="foreigner_join_date"></td>
          </tr>
        </table>
      </section>
    </form>
  </main>

  <script>
  (() => {
    'use strict';

    const pageShell = document.getElementById('pageShell');
    const typeRadios = Array.from(document.querySelectorAll('input[name="memberType"]'));
    const panels = Array.from(document.querySelectorAll('.form-panel'));
    const companySectionTitle = document.getElementById('companySectionTitle');
    const pdfBtn = document.getElementById('pdfBtn');

    function showPanel(type){
      panels.forEach(panel => {
        const types = String(panel.dataset.types || '').split(/\s+/).filter(Boolean);
        panel.classList.toggle('active', types.includes(type));
      });

      pageShell.classList.remove('type-institution','type-company','type-domestic','type-foreigner');
      pageShell.classList.add(`type-${type}`);

      if(type === 'institution'){
        companySectionTitle.textContent = '기관 회원정보';
      }else if(type === 'company'){
        companySectionTitle.textContent = '기업체 대표 회원정보';
      }
    }

    typeRadios.forEach(radio => {
      radio.addEventListener('change', () => showPanel(radio.value));
    });

    pdfBtn.addEventListener('click', () => window.print());

    // 초기 화면: 라디오는 미선택, 기관/기업체 대표 공용 양식을 기본 표시
    typeRadios.forEach(radio => { radio.checked = false; });
    companySectionTitle.textContent = '기관 / 기업체 대표 회원정보';
  })();
  </script>
</body>
</html>
